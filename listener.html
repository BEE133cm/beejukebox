<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remote Jukebox - Listener</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #111827; color: white; overscroll-behavior-y: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        .marquee-container { overflow: hidden; white-space: nowrap; position: relative; width: 100%; display: flex; }
        .marquee-content { display: inline-block; white-space: nowrap; padding-left: 100vw; animation: marquee 15s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        .toast { position: fixed; top: 20px; right: 20px; z-index: 9999; transform: translateX(150%); transition: transform 0.3s ease-in-out; }
        .toast.show { transform: translateX(0); }
        .equalizer { display: flex; align-items: flex-end; gap: 3px; height: 20px; opacity: 0; transition: opacity 0.3s; }
        .equalizer.active { opacity: 1; }
        .eq-bar { width: 4px; background-color: #ef4444; border-radius: 2px; animation: eq-bounce 0.5s infinite alternate ease-in-out; }
        .eq-bar:nth-child(1) { animation-delay: 0.1s; height: 30%; }
        .eq-bar:nth-child(2) { animation-delay: 0.3s; height: 60%; }
        .eq-bar:nth-child(3) { animation-delay: 0.0s; height: 100%; }
        .eq-bar:nth-child(4) { animation-delay: 0.4s; height: 40%; }
        .eq-bar:nth-child(5) { animation-delay: 0.2s; height: 70%; }
        @keyframes eq-bounce { 0% { transform: scaleY(0.3); } 100% { transform: scaleY(1); } }
        .youtube-hidden { position: absolute; width: 1px; height: 1px; top: -9999px; left: -9999px; }
        .banned-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .layer-hidden { opacity: 0; pointer-events: none; z-index: 0; }
        .layer-visible { opacity: 1; pointer-events: auto; z-index: 10; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 12px); }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        .chat-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 30; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
        .chat-input-container { transition: all 0.2s ease; }
        @media (orientation: portrait) {
            .chat-backdrop.active { opacity: 1; pointer-events: auto; }
            .chat-input-floating { position: fixed !important; top: 35vh !important; left: 0 !important; right: 0 !important; z-index: 9999 !important; padding: 15px !important; background: rgba(24, 24, 27, 0.98) !important; border-top: 1px solid #4f46e5 !important; border-bottom: 1px solid #4f46e5 !important; box-shadow: 0 15px 30px rgba(0,0,0,0.8) !important; }
        }
        @media (orientation: landscape) { .chat-backdrop { display: none !important; } }
    </style>

    <!-- Firebase Initialization -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, addDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'jukebox-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.db = db;
        window.auth = auth;
        window.appId = appId;
        window.collection = collection;
        window.doc = doc;
        window.setDoc = setDoc;
        window.updateDoc = updateDoc;
        window.addDoc = addDoc;
        window.deleteDoc = deleteDoc;
        window.onSnapshot = onSnapshot;

        async function initFirebase() {
            try {
                if (initialAuthToken) await signInWithCustomToken(auth, initialAuthToken);
                else await signInAnonymously(auth);
                window.dispatchEvent(new Event('firebase-auth-ready'));
            } catch (e) {
                console.error("Firebase Auth Error:", e);
            }
        }
        initFirebase();
    </script>
</head>
<body class="p-0 overflow-hidden relative">

    <div id="toast" class="toast bg-gray-800 border-l-4 border-red-500 text-white p-4 rounded shadow-lg flex items-center gap-3">
        <span id="toast-msg"></span>
    </div>

    <!-- リスナー名入力モーダル -->
    <div id="name-modal" class="hidden fixed inset-0 z-[1000] bg-black/80 flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-indigo-500 rounded-xl p-6 w-full max-w-sm shadow-2xl text-center">
            <h3 class="text-xl font-bold text-white mb-2"><i class="fa-solid fa-user"></i> お名前を入力してください</h3>
            <p class="text-sm text-gray-400 mb-6">※入室後の名前変更はできません。</p>
            <input type="text" id="initial-name-input" onkeypress="if(event.key === 'Enter') submitName()" placeholder="例: リスナーA" class="w-full bg-gray-800 border border-gray-600 rounded p-3 text-white mb-2 outline-none focus:border-indigo-500">
            <p id="name-error" class="hidden text-red-500 text-xs mb-4">名前を入力してください</p>
            <div class="flex mt-4">
                <button onclick="submitName()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg">入室する</button>
            </div>
        </div>
    </div>

    <!-- リスナー画面 -->
    <div id="listener-view" class="flex fixed top-0 left-0 w-full h-[100dvh] z-50 bg-[#0e0e10] flex-col landscape:flex-row text-sm">
        
        <!-- 左ペイン: 映像 -->
        <div class="flex flex-col w-full landscape:w-auto landscape:flex-1 landscape:h-full shrink-0 relative z-20 bg-black">
            <div id="listener-video-area" class="relative w-full bg-black shrink-0 z-20 flex justify-center overflow-hidden aspect-video landscape:aspect-auto landscape:flex-1">
                <div class="absolute top-0 left-0 w-full bg-gradient-to-b from-black/90 to-transparent pt-1.5 pb-4 px-3 z-30 flex items-center gap-2 pointer-events-none">
                    <div id="listener-eq" class="equalizer scale-75 shrink-0 origin-left"><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div></div>
                    <div class="marquee-container h-4 flex-1">
                        <div class="marquee-content font-bold text-white text-[11px] leading-tight flex items-center gap-2 drop-shadow-md">
                            <span id="listener-now-playing">接続待ち...</span>
                            <span id="listener-now-requester" class="text-indigo-300 font-normal"></span>
                        </div>
                    </div>
                </div>

                <div id="listener-wp-layer" class="absolute inset-0 layer-visible bg-black">
                    <div id="listener-youtube-player-wrapper" class="w-full h-full">
                        <div id="listener-youtube-player" class="w-full h-full pointer-events-auto"></div>
                    </div>
                    <div id="listener-youtube-overlay" class="absolute inset-0 z-20 cursor-pointer bg-black/80 flex flex-col items-center justify-center text-white transition-colors duration-300" onclick="handleOverlayClick()">
                        <span class="text-4xl mb-2 hover:scale-110 transition-transform"><i class="fa-solid fa-play"></i></span>
                        <span class="text-sm font-bold">タップして音声をONにして視聴開始</span>
                    </div>
                </div>
            </div>

            <div id="listener-theme-container" class="bg-indigo-900/90 border-b border-indigo-500/50 text-indigo-100 text-[11px] py-1.5 px-3 text-center font-bold shrink-0 hidden shadow-md z-10 break-words"></div>
        </div> 

        <!-- 右ペイン: スクロール領域 (リクエスト類 ＋ チャット) -->
        <div class="flex-1 flex flex-col relative bg-[#0e0e10] min-h-0 landscape:w-[320px] lg:landscape:w-[400px] landscape:flex-none landscape:border-l landscape:border-gray-800">
            <details id="listener-menu-details" class="bg-[#18181b] border-b border-gray-800 shrink-0 group z-10 relative">
                <summary class="p-3 cursor-pointer text-gray-400 font-bold text-xs flex justify-between items-center outline-none hover:text-white transition-colors">
                    <div class="flex items-center gap-2"><i class="fa-solid fa-music text-indigo-400 text-sm"></i> <span>リクエスト等 (タップで開閉)</span></div>
                    <span class="group-open:rotate-180 transition-transform"><i class="fa-solid fa-chevron-down"></i></span>
                </summary>
                <div class="p-4 space-y-6 bg-[#111827] border-t border-gray-800 h-full overflow-y-auto pb-32">
                    <div class="space-y-3">
                        <h3 class="text-xs font-bold text-indigo-400 flex items-center gap-1"><i class="fa-solid fa-arrow-down text-indigo-400"></i> リクエストはこちらから！</h3>
                        <div class="flex gap-2">
                            <input type="text" id="listener-url" placeholder="https://youtu.be/..." class="flex-1 bg-gray-900 border border-gray-700 rounded p-2 text-white text-xs outline-none focus:border-indigo-500">
                            <button onclick="sendRequest()" class="bg-red-600 hover:bg-red-500 text-white px-4 rounded text-xs font-bold transition-colors">送信</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3 pt-4 border-t border-gray-800/60">
                        <div>
                            <h3 class="text-[10px] font-bold text-gray-400 mb-2 border-b border-gray-800 pb-1">順番待ち (<span id="listener-queue-count">0</span>)</h3>
                            <div id="listener-queue-list" class="space-y-1.5 max-h-32 overflow-y-auto text-[10px]"></div>
                        </div>
                    </div>
                </div>
            </details>

            <div id="listener-chat-area-wrapper" class="flex-1 flex flex-col min-h-0 relative">
                <div id="listener-status" class="absolute top-2 left-0 w-full text-center text-[10px] text-yellow-500 animate-pulse pointer-events-none">ルームに接続中...</div>
                <div id="listener-chat-backdrop" class="chat-backdrop" onclick="closeChatInput()"></div>
                <div id="listener-chat-list" class="flex-1 p-3 space-y-3 overflow-y-auto min-h-0 flex flex-col justify-end pb-4 pt-6 relative z-10"></div>
                
                <div id="listener-chat-input-container" class="flex-shrink-0 px-3 pt-2 pb-safe bg-[#18181b] border-t border-gray-800 flex gap-2 items-center chat-input-container relative z-20">
                    <input type="text" id="listener-chat-input" autocomplete="off" onfocus="focusChatInput()" onblur="blurChatInputDelay()" onkeypress="if(event.key === 'Enter') sendChatRequest()" class="flex-1 bg-[#27272a] text-white text-sm rounded-full px-4 py-2 border-none outline-none focus:ring-1 focus:ring-indigo-500 placeholder-gray-500" placeholder="チャットを送信">
                    <button onclick="sendChatRequest()" class="bg-indigo-600 hover:bg-indigo-500 text-white rounded-full w-9 h-9 flex items-center justify-center font-bold shrink-0 transition-colors shadow"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentRoomId = null;
        let queue = [];
        let chatHistory = []; 
        let currentSong = null;
        let viewerYTPlayer = null;
        let isWpOverlayActive = true;
        let listenerName = "名無し";

        document.addEventListener('DOMContentLoaded', () => {
            const menuDetails = document.getElementById('listener-menu-details');
            if (menuDetails) {
                menuDetails.addEventListener('toggle', () => {
                    const chatWrapper = document.getElementById('listener-chat-area-wrapper');
                    if (menuDetails.open) chatWrapper.classList.add('hidden');
                    else { chatWrapper.classList.remove('hidden'); const chatList = document.getElementById('listener-chat-list'); if(chatList) chatList.scrollTop = chatList.scrollHeight; }
                });
            }
        });

        function focusChatInput() { document.getElementById('listener-chat-input-container').classList.add('chat-input-floating'); document.getElementById('listener-chat-backdrop').classList.add('active'); }
        function closeChatInput() { const input = document.getElementById('listener-chat-input'); if (input) input.blur(); document.getElementById('listener-chat-input-container').classList.remove('chat-input-floating'); document.getElementById('listener-chat-backdrop').classList.remove('active'); }
        function blurChatInputDelay() { setTimeout(() => { const input = document.getElementById('listener-chat-input'); if (document.activeElement !== input) { document.getElementById('listener-chat-input-container').classList.remove('chat-input-floating'); document.getElementById('listener-chat-backdrop').classList.remove('active'); } }, 200); }

        window.onload = () => {
            const savedName = localStorage.getItem('jukebox_guest_name');
            if (savedName) listenerName = savedName;

            const params = new URLSearchParams(window.location.search);
            if(params.has('host')) {
                currentRoomId = params.get('host');
                if (window.db) initListener();
                else window.addEventListener('firebase-auth-ready', initListener, { once: true });
            } else {
                document.body.innerHTML = '<div class="banned-overlay"><h1 class="text-3xl mb-4 text-red-500">エラー</h1><p class="text-gray-300">ルームIDが指定されていません。</p></div>';
            }
        };

        function showToast(msg, type="info") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerHTML = msg;
            toast.className = `toast bg-gray-800 border-l-4 border-red-500 text-white p-4 rounded shadow-lg flex items-center gap-3 text-sm`;
            if (type === 'error') toast.classList.replace('border-indigo-500', 'border-red-500');
            else toast.classList.replace('border-red-500', 'border-indigo-500');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function showNameModal() {
            document.getElementById('name-modal').classList.remove('hidden');
            if (listenerName !== "名無し") document.getElementById('initial-name-input').value = listenerName;
        }

        function submitName() {
            const nameInput = document.getElementById('initial-name-input').value.trim();
            if (!nameInput) return document.getElementById('name-error').classList.remove('hidden');
            
            document.getElementById('name-error').classList.add('hidden');
            document.getElementById('name-modal').classList.add('hidden');
            
            listenerName = nameInput;
            localStorage.setItem('jukebox_guest_name', nameInput);
            startCloudConnection();
        }
        
        function loadYouTubeAPI() {
            if (window.YT && window.YT.Player) {
                // Ignore
            } else if (!document.getElementById('youtube-api-script')) {
                const tag = document.createElement('script');
                tag.id = 'youtube-api-script';
                tag.src = 'https://www.youtube.com/iframe_api';
                const firstScriptTag = document.getElementsByTagName('script')[0];
                firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
            }
        }

        function handleOverlayClick() {
            if (isWpOverlayActive) {
                if (viewerYTPlayer && typeof viewerYTPlayer.unMute === 'function') {
                    viewerYTPlayer.unMute();
                    if (typeof viewerYTPlayer.getPlayerState === 'function' && viewerYTPlayer.getPlayerState() !== 1 && viewerYTPlayer.getPlayerState() !== 3) {
                        viewerYTPlayer.playVideo();
                    }
                }
                document.getElementById('listener-youtube-overlay').style.display = 'none'; 
                isWpOverlayActive = false;
                showToast("視聴を開始しました！", "info");
            }
        }

        function initListener() {
            if (listenerName !== "名無し") {
                startCloudConnection();
            } else {
                showNameModal();
            }
        }

        function startCloudConnection() {
            document.getElementById('listener-status').textContent = "クラウド同期中...";
            document.getElementById('listener-status').classList.replace('text-yellow-500', 'text-green-500');
            
            // Listen to Room State
            window.onSnapshot(window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', currentRoomId), (docSnap) => {
                if (docSnap.exists()) {
                    handleRoomSync(docSnap.data());
                } else {
                    document.getElementById('listener-status').textContent = "ホストが見つかりません";
                    document.getElementById('listener-status').classList.replace('text-green-500', 'text-red-500');
                }
            }, (err) => console.error(err));

            // Listen to Queues
            window.onSnapshot(window.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'queues'), (snapshot) => {
                let allQ = [];
                snapshot.forEach(doc => {
                    const d = doc.data();
                    if (d.roomId === currentRoomId) allQ.push({ id: doc.id, ...d });
                });
                allQ.sort((a, b) => a.createdAt - b.createdAt);
                queue = allQ;
                renderQueue();
            }, (err) => console.error(err));

            // Listen to Chats
            window.onSnapshot(window.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'chats'), (snapshot) => {
                let allC = [];
                snapshot.forEach(doc => {
                    const d = doc.data();
                    if (d.roomId === currentRoomId) allC.push({ id: doc.id, ...d });
                });
                allC.sort((a, b) => a.createdAt - b.createdAt);
                chatHistory = allC.slice(-100);
                renderChatList('listener-chat-list', chatHistory);
            }, (err) => console.error(err));

            loadYouTubeAPI();
        }

        function handleRoomSync(data) {
            const tDiv = document.getElementById('listener-theme-container');
            if(data.theme) { tDiv.innerHTML = `<i class="fa-solid fa-bullhorn"></i> ${data.theme}`; tDiv.classList.remove('hidden'); }
            else tDiv.classList.add('hidden');

            const playingEl = document.getElementById('listener-now-playing');
            const reqEl = document.getElementById('listener-now-requester');
            const eq = document.getElementById('listener-eq');

            if (data.currentSong) {
                playingEl.textContent = data.currentSong.title;
                reqEl.innerHTML = data.currentSong.requester ? `- <i class="fa-solid fa-user"></i> ${data.currentSong.requester}` : "";
                if(data.status === 'playing') eq.classList.add('active'); else eq.classList.remove('active');
                
                // Timestamp based Sync
                if (!currentSong || currentSong.videoId !== data.currentSong.videoId) {
                    currentSong = data.currentSong;
                    if (viewerYTPlayer) viewerYTPlayer.loadVideoById(currentSong.videoId);
                }

                if (viewerYTPlayer && typeof viewerYTPlayer.getPlayerState === 'function') {
                    const state = viewerYTPlayer.getPlayerState();
                    if (data.status === 'playing') {
                        const expectedTime = (Date.now() - currentSong.startedAt) / 1000;
                        if (state !== 1 && state !== 3) {
                            viewerYTPlayer.seekTo(expectedTime, true);
                            viewerYTPlayer.playVideo();
                        } else {
                            const diff = expectedTime - viewerYTPlayer.getCurrentTime();
                            if (Math.abs(diff) > 2.0) viewerYTPlayer.seekTo(expectedTime, true);
                        }
                    } else if (data.status === 'paused') {
                        if (state === 1) {
                            viewerYTPlayer.pauseVideo();
                            viewerYTPlayer.seekTo(currentSong.pausePosition || 0, true);
                        }
                    }
                }
            } else {
                currentSong = null;
                playingEl.textContent = "BGM停止中";
                reqEl.textContent = "";
                eq.classList.remove('active');
                if (viewerYTPlayer && typeof viewerYTPlayer.stopVideo === 'function') viewerYTPlayer.stopVideo();
            }
        }

        // Initialize Player for Timestamp Sync
        window.onYouTubeIframeAPIReady = function() {
            viewerYTPlayer = new YT.Player('listener-youtube-player', {
                height: '100%', width: '100%',
                playerVars: { autoplay: 1, controls: 0, rel: 0, disablekb: 0 },
                events: {
                    'onReady': (event) => { event.target.mute(); }
                }
            });
        };

        function extractVideoId(url) {
            const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=))([^"&?\/\s]{11})/);
            return match ? match[1] : null;
        }

        async function fetchYouTubeTitle(videoId) {
            try {
                const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
                if(res.ok) { const data = await res.json(); return data.title || "不明なタイトル"; }
            } catch(e) {}
            return "不明なタイトル";
        }

        function sendRequest() {
            const url = document.getElementById('listener-url').value;
            if(!url) return showToast("URLを入力してください！", "error");
            
            const vid = extractVideoId(url);
            if(vid) {
                document.getElementById('listener-url').value = '';
                showToast("リクエストを送信中...");
                fetchYouTubeTitle(vid).then(title => {
                    window.addDoc(window.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'queues'), {
                        roomId: currentRoomId,
                        videoId: vid,
                        title: title,
                        requester: listenerName,
                        requesterReal: listenerName,
                        isAnon: false,
                        isRemote: false,
                        createdAt: Date.now()
                    });
                    showToast("リクエストを送信しました！");
                });
            } else showToast("無効なYouTube URLです", "error");
        }

        function sendChatRequest() {
            const inputId = 'listener-chat-input';
            const text = document.getElementById(inputId).value.trim();
            if(!text) return;
            document.getElementById(inputId).value = '';
            closeChatInput();

            window.addDoc(window.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'chats'), {
                roomId: currentRoomId,
                text: text,
                sender: listenerName,
                senderReal: listenerName,
                isAnon: false,
                isRemote: false,
                createdAt: Date.now()
            });
        }

        function renderQueue() {
            const countEl = document.getElementById('listener-queue-count');
            if(countEl) countEl.textContent = queue.length;
            
            const qList = document.getElementById('listener-queue-list');
            if(qList) {
                qList.innerHTML = '';
                queue.forEach((q, idx) => {
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between bg-gray-800/50 p-2 rounded border border-gray-700/50 text-sm mb-1";
                    const isCrown = q.isRemote ? '(<i class="fa-solid fa-crown text-yellow-400"></i>)' : '';
                    div.innerHTML = `
                        <div class="flex items-center gap-2 overflow-hidden">
                            <span class="text-gray-500 font-bold w-4">${idx+1}</span>
                            <div class="truncate">
                                <p class="text-gray-200 truncate font-medium">${q.title}</p>
                                <p class="text-[10px] text-gray-400 truncate"><i class="fa-solid fa-user"></i> ${q.requester} ${isCrown}</p>
                            </div>
                        </div>
                    `;
                    qList.appendChild(div);
                });
            }
        }

        function renderChatList(containerId, chats) {
            const container = document.getElementById(containerId);
            if(!container) return;
            container.innerHTML = '';
            chats.forEach(c => {
                const div = document.createElement('div');
                div.className = "text-[13px] leading-relaxed flex group";
                const badge = c.isRemote ? '<i class="fa-solid fa-crown text-yellow-400"></i> ' : '';
                const nameColor = c.isRemote ? 'text-yellow-400' : 'text-indigo-400';
                div.innerHTML = `
                    <div class="flex-1 break-words">
                        <span class="font-bold ${nameColor} mr-1">${badge}${c.senderReal}:</span>
                        <span class="text-gray-100">${c.text}</span>
                    </div>
                `;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
