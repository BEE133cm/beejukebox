<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remote Jukebox - Listener</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #111827; color: white; overscroll-behavior-y: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .marquee-container { overflow: hidden; white-space: nowrap; position: relative; width: 100%; display: flex; }
        .marquee-content { 
            display: inline-block; 
            white-space: nowrap;
            padding-left: 100vw; 
            animation: marquee 15s linear infinite; 
        }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .toast {
            position: fixed; top: 20px; right: 20px; z-index: 9999;
            transform: translateX(150%); transition: transform 0.3s ease-in-out;
        }
        .toast.show { transform: translateX(0); }

        .equalizer {
            display: flex; align-items: flex-end; gap: 3px; height: 20px; opacity: 0; transition: opacity 0.3s;
        }
        .equalizer.active { opacity: 1; }
        .eq-bar {
            width: 4px; background-color: #ef4444; border-radius: 2px;
            animation: eq-bounce 0.5s infinite alternate ease-in-out;
        }
        .eq-bar:nth-child(1) { animation-delay: 0.1s; height: 30%; }
        .eq-bar:nth-child(2) { animation-delay: 0.3s; height: 60%; }
        .eq-bar:nth-child(3) { animation-delay: 0.0s; height: 100%; }
        .eq-bar:nth-child(4) { animation-delay: 0.4s; height: 40%; }
        .eq-bar:nth-child(5) { animation-delay: 0.2s; height: 70%; }
        
        @keyframes eq-bounce {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1); }
        }

        .youtube-hidden { position: absolute; width: 1px; height: 1px; top: -9999px; left: -9999px; }
