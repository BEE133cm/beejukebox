<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remote Jukebox - Host</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #111827; color: white; overscroll-behavior-y: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .marquee-container { overflow: hidden; white-space: nowrap; position: relative; width: 100%; display: flex; }
        .marquee-content { 
            display: inline-block; 
            white-space: nowrap;
            padding-left: 100vw; 
            animation: marquee 15s linear infinite; 
        }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .toast {
            position: fixed; top: 20px; right: 20px; z-index: 9999;
            transform: translateX(150%); transition: transform 0.3s ease-in-out;
        }
        .toast.show { transform: translateX(0); }

        .youtube-hidden { position: absolute; width: 1px; height: 1px; top: -9999px; left: -9999px; }

        #host-view.share-mode .hide-on-share { display: none !important; }
        #host-view.share-mode #host-player-col { grid-column: 1 / -1 !important; }
        .show-on-share { display: none !important; }
        #host-view.share-mode .show-on-share { display: flex !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 sm:p-8 relative">

    <!-- トースト通知 -->
    <div id="toast" class="toast bg-gray-800 border-l-4 border-red-500 text-white p-4 rounded shadow-lg flex items-center gap-3">
        <span id="toast-msg"></span>
    </div>

    <!-- ================= 1. ルーム作成画面 (初期画面) ================= -->
    <div id="setup-view" class="w-full max-w-md bg-gray-900 border border-gray-700 p-6 rounded-2xl shadow-2xl mt-10">
        <h1 class="text-2xl font-bold text-center mb-2 text-white"><i class="fa-solid fa-music text-indigo-400"></i> Remote Jukebox</h1>
        <p class="text-gray-400 text-center text-sm mb-6">配信者用管理画面</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm text-gray-400 mb-1">ルームID (半角英数字)</label>
                <input type="text" id="input-room-id" placeholder="例: my-radio-123" class="w-full bg-gray-800 text-white border border-gray-600 rounded p-3 outline-none focus:border-red-500">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">配信者の名前</label>
                <input type="text" id="input-host-name" placeholder="例: 配信太郎" class="w-full bg-gray-800 text-white border border-gray-600 rounded p-3 outline-none focus:border-red-500">
            </div>
            <div class="border-t border-gray-700 pt-4 mt-2">
                <label class="block text-sm text-gray-400 mb-1"><i class="fa-solid fa-lock"></i> 管理パスワード (任意)</label>
                <input type="password" id="input-host-password" placeholder="例: 1234 (空欄ならパス不要)" class="w-full bg-gray-800 text-white border border-gray-600 rounded p-3 outline-none focus:border-red-500">
                <p class="text-[10px] text-gray-500 mt-1">※設定すると、コントローラーやカメラからの接続時にパスワードを要求します。</p>
            </div>
            <button onclick="createRoom()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-lg transition-colors mt-4">
                部屋を作成する
            </button>
            
            <div class="border-t border-gray-700 pt-4 mt-6">
                <h3 class="text-sm font-bold text-gray-300 mb-3"><i class="fa-regular fa-clock"></i> 過去に作成したルーム</h3>
                <div id="setup-history-list" class="flex flex-col gap-2 max-h-40 overflow-y-auto">
                    <!-- 履歴がここに入る -->
                </div>
            </div>
        </div>
        <p class="text-center text-xs text-gray-500 mt-6">Host UI</p>
    </div>

    <!-- ================= 2. 配信者 (Host) 画面 ================= -->
    <div id="host-view" class="hidden w-full max-w-6xl flex-col gap-6">
        <div class="flex items-center justify-between bg-gray-800 p-4 rounded-xl border border-gray-700 hide-on-share gap-4">
            <div class="flex-shrink-0">
                <h2 class="font-bold text-xl text-white"><i class="fa-solid fa-crown text-yellow-400"></i> 配信コントロール</h2>
                <p class="text-sm text-gray-400">ルームID: <span id="display-room-id" class="text-red-400 font-mono"></span></p>
            </div>
            
            <div class="flex-1 overflow-hidden flex items-center justify-center">
                <div id="host-news-ticker" class="bg-gray-900/90 text-yellow-400 font-bold text-sm px-4 py-2 rounded-full border border-yellow-500/50 shadow-lg opacity-0 transition-opacity duration-300 whitespace-nowrap overflow-hidden text-ellipsis max-w-full">
                </div>
            </div>

            <div id="connection-status" class="flex flex-col items-end gap-1 text-sm flex-shrink-0">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-yellow-500 animate-pulse" id="status-dot"></span>
                    <span id="status-text" class="text-gray-300">起動中...</span>
                </div>
                <span id="error-text" class="text-xs text-red-400 hidden"></span>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- プレイヤー列 -->
            <div id="host-player-col" class="space-y-6 lg:col-span-1">
                <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 text-center relative transition-all duration-300">
                    <div class="flex justify-between items-center mb-4 relative z-20">
                        <button onclick="toggleShareMode(true)" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded hide-on-share flex items-center gap-1 shadow font-bold transition-transform active:scale-95">
                            <i class="fa-solid fa-tv"></i> 画面共有モード
                        </button>
                        <button onclick="toggleShareMode(false)" class="text-xs bg-gray-600 hover:bg-gray-500 text-white px-4 py-2 rounded show-on-share items-center gap-2 shadow-lg font-bold transition-transform active:scale-95 mx-auto">
                            <i class="fa-solid fa-xmark"></i> 共有モード解除
                        </button>
                        <button onclick="toggleLightMode()" id="btn-light-mode" class="text-xs bg-gray-700 hover:bg-gray-600 text-white px-3 py-2 rounded transition-colors border border-gray-600 shadow hide-on-share">
                            <i class="fa-solid fa-video"></i> 映像ON
                        </button>
                    </div>

                    <div id="youtube-player-container" class="w-full aspect-video bg-black rounded-lg overflow-hidden mb-4 relative shadow-inner">
                        <div id="youtube-player"></div>
                    </div>
                    
                    <h3 class="text-sm text-red-400 font-bold mb-1 uppercase tracking-wider">Now Playing</h3>
                    <div class="marquee-container h-8 mb-2">
                        <div id="host-now-playing" class="marquee-content font-bold text-xl text-white">再生待機中...</div>
                    </div>
                    <p id="host-now-requester" class="text-sm text-gray-400 mb-6">リクエスト待ち</p>
                    
                    <div class="flex justify-center gap-6 hide-on-share">
                        <button onclick="togglePlayHost()" id="btn-host-play" class="bg-red-600 hover:bg-red-500 text-white p-4 rounded-full flex items-center justify-center w-14 h-14 shadow-lg transition-transform active:scale-95">
                            <i class="fa-solid fa-play text-xl"></i>
                        </button>
                        <button onclick="playNext(true)" class="bg-gray-700 hover:bg-gray-600 text-white p-4 rounded-full flex items-center justify-center w-14 h-14 shadow transition-transform active:scale-95">
                            <i class="fa-solid fa-forward-step text-xl"></i>
                        </button>
                    </div>
                </div>

                <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 space-y-4 hide-on-share">
                    <h3 class="font-bold text-gray-200 border-b border-gray-700 pb-2"><i class="fa-solid fa-gear"></i> 配信設定</h3>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">配信者の名前</label>
                        <input type="text" id="setting-host-name" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm text-white" onchange="updateHostSettings()">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">現在のテーマ・気分 (リスナーに表示)</label>
                        <input type="text" id="setting-theme" placeholder="例: ドライブ中！アニソンリクエスト募集！" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm text-white" onchange="updateHostSettings()">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">動画尺制限 (分) ※0で無制限</label>
                        <input type="number" id="setting-duration" value="10" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm text-white" onchange="updateHostSettings()">
                    </div>
                </div>
            </div>

            <!-- キュー＆BGM列 -->
            <div id="host-center-col" class="space-y-6 lg:col-span-1 hide-on-share">
                <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 h-64 flex flex-col">
                    <h3 class="font-bold text-gray-200 border-b border-gray-700 pb-2 mb-3"><i class="fa-solid fa-list-ul"></i> リクエストキュー</h3>
                    <div id="host-queue-list" class="flex-1 overflow-y-auto space-y-2 pr-2"></div>
                </div>

                <div class="bg-gray-800 p-5 rounded-xl border border-gray-700">
                    <h3 class="font-bold text-gray-200 border-b border-gray-700 pb-2 mb-3"><i class="fa-solid fa-music text-indigo-400"></i> 待機用BGM / プレイリスト</h3>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="input-bgm-url" placeholder="YouTube URL / プレイリスト" class="min-w-0 flex-1 bg-gray-900 border border-gray-600 rounded p-2 text-sm text-white">
                        <button onclick="addBGM()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded text-sm whitespace-nowrap flex-shrink-0">追加</button>
                        <button onclick="saveToMyList()" title="マイリストに保存" class="bg-yellow-600 hover:bg-yellow-500 text-white px-3 py-2 rounded text-sm whitespace-nowrap flex-shrink-0"><i class="fa-solid fa-star"></i></button>
                    </div>
                    <div class="flex gap-3 mb-2 text-xs text-gray-300 border-b border-gray-700 pb-2">
                        <label class="flex items-center gap-1 cursor-pointer hover:text-white transition-colors">
                            <input type="checkbox" id="bgm-shuffle" onchange="updateBGMPlaybackSettings()" class="rounded bg-gray-900 border-gray-600 text-indigo-500 focus:ring-indigo-500">
                            <i class="fa-solid fa-shuffle"></i> シャッフル
                        </label>
                        <label class="flex items-center gap-1 cursor-pointer hover:text-white transition-colors">
                            <input type="checkbox" id="bgm-loop" checked onchange="updateBGMPlaybackSettings()" class="rounded bg-gray-900 border-gray-600 text-indigo-500 focus:ring-indigo-500">
                            <i class="fa-solid fa-repeat"></i> リストループ
                        </label>
                        <label class="flex items-center gap-1 cursor-pointer hover:text-white transition-colors">
                            <input type="checkbox" id="bgm-loop-one" onchange="updateBGMPlaybackSettings()" class="rounded bg-gray-900 border-gray-600 text-indigo-500 focus:ring-indigo-500">
                            <i class="fa-solid fa-rotate-right"></i> 1曲ループ
                        </label>
                    </div>
                    <div class="mb-3">
                        <label class="text-xs text-gray-400">マイリストから追加:</label>
                        <select id="select-mylist" onchange="loadFromMyList()" class="w-full bg-gray-900 border border-gray-600 rounded p-1 text-sm text-white mt-1">
                            <option value="">-- 選択してください --</option>
                        </select>
                    </div>
                    <div id="host-bgm-list" class="space-y-2 max-h-24 overflow-y-auto text-sm"></div>
                </div>

                <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 h-48 flex flex-col">
                    <h3 class="font-bold text-gray-200 border-b border-gray-700 pb-2 mb-3"><i class="fa-regular fa-clock"></i> 再生履歴</h3>
                    <div id="host-history-list" class="flex-1 overflow-y-auto space-y-2 pr-2 text-sm text-gray-400"></div>
                </div>
            </div>

            <div id="host-right-col" class="space-y-6 lg:col-span-1 hide-on-share">
                <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 flex flex-col" style="height: 350px;">
                    <div class="flex justify-between items-center border-b border-gray-700 pb-2 mb-2">
                        <h3 class="font-bold text-gray-200"><i class="fa-solid fa-comment-dots"></i> リアルタイムチャット</h3>
                        <label class="flex items-center gap-1 text-xs text-gray-300 cursor-pointer">
                            <input type="checkbox" id="host-tts-toggle" class="rounded bg-gray-900 border-gray-600 text-indigo-500">
                            <i class="fa-solid fa-head-side-waveform"></i> 読上
                        </label>
                    </div>
                    <div id="host-chat-list" class="flex-1 overflow-y-auto space-y-1 pr-2 mb-2"></div>
                    <div class="flex gap-2 mt-auto">
                        <input type="text" id="host-chat-input" onkeypress="if(event.key === 'Enter') sendChatRequest()" placeholder="チャットを送信..." class="flex-1 bg-gray-900 border border-gray-600 rounded p-2 text-sm text-white" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
                        <button onclick="sendChatRequest()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded text-sm font-bold">送信</button>
                    </div>
                </div>

                <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 flex flex-col" style="height: 350px;">
                    <div class="flex justify-between items-center mb-3 border-b border-gray-700 pb-2">
                        <h3 class="font-bold text-gray-200"><i class="fa-solid fa-users"></i> 参加者管理 <span id="host-participant-count" class="text-sm font-normal text-indigo-300 ml-1"></span></h3>
                        <label class="flex items-center gap-1 text-xs text-gray-300 cursor-pointer">
                            <input type="checkbox" id="setting-cam-approval" onchange="toggleCamApproval()" class="rounded bg-gray-900 border-gray-600 text-red-500">
                            視聴承認制
                        </label>
                    </div>
                    <div id="host-participant-list" class="flex-1 overflow-y-auto space-y-2 pr-2"></div>
                </div>

                <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 space-y-3">
                    <h3 class="font-bold text-gray-200 border-b border-gray-700 pb-2"><i class="fa-solid fa-link"></i> 共有URL</h3>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1"><i class="fa-solid fa-headphones"></i> リスナー招待用 URL</label>
                        <div class="flex gap-2">
                            <input type="text" id="url-listener" readonly class="flex-1 bg-gray-900 border border-gray-600 rounded p-1 text-xs text-gray-300">
                            <button onclick="copyURL('url-listener')" class="bg-gray-700 hover:bg-gray-600 px-2 rounded text-xs">コピー</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-red-400 mb-1"><i class="fa-solid fa-crown text-yellow-400"></i> リモコン専用ポータル URL</label>
                        <div class="flex gap-2">
                            <input type="text" id="url-remote" readonly class="flex-1 bg-gray-900 border border-gray-600 rounded p-1 text-xs text-gray-300">
                            <button onclick="copyURL('url-remote')" class="bg-gray-700 hover:bg-gray-600 px-2 rounded text-xs">コピー</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-green-400 mb-1"><i class="fa-solid fa-camera"></i> カメラ専用ポータル URL</label>
                        <div class="flex gap-2">
                            <input type="text" id="url-camera" readonly class="flex-1 bg-gray-900 border border-gray-600 rounded p-1 text-xs text-gray-300">
                            <button onclick="copyURL('url-camera')" class="bg-gray-700 hover:bg-gray-600 px-2 rounded text-xs">コピー</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-blue-400 mb-1"><i class="fa-solid fa-tv"></i> OBSカメラ取り込み専用 URL (映像+音声)</label>
                        <div class="flex gap-2">
                            <input type="text" id="url-obs-cam" readonly class="flex-1 bg-gray-900 border border-gray-600 rounded p-1 text-xs text-gray-300">
                            <button onclick="copyURL('url-obs-cam')" class="bg-gray-700 hover:bg-gray-600 px-2 rounded text-xs">コピー</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1"><i class="fa-solid fa-tv text-gray-500"></i> 旧OBS用 URL (再生バーのみ透過)</label>
                        <div class="flex gap-2">
                            <input type="text" id="url-obs" readonly class="flex-1 bg-gray-900 border border-gray-600 rounded p-1 text-xs text-gray-300">
                            <button onclick="copyURL('url-obs')" class="bg-gray-700 hover:bg-gray-600 px-2 rounded text-xs">コピー</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <p class="text-center text-xs text-gray-500 mt-4">Host UI</p>
    </div>

    <!-- カメラ中継用のダミー要素 -->
    <audio id="dummy-audio" src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA" loop playsinline></audio>
    <video id="host-relay-video" class="hidden" autoplay playsinline muted></video>

    <script>
        let peer = null;
        let currentRoomId = null;
        let isHost = true;
        
        let hostPassword = ''; 
        let queue = [];
        let bgmQueue = [];
        let historyQueue = [];
        let chatHistory = []; 
        let currentSong = null;
        let player = null;
        let isLightMode = false;
        let hostName = "配信太郎";
        let hostTheme = "";
        let durationLimit = 10 * 60;
        let bgmResumeData = null; 

        let connectedListeners = {}; 
        let bannedUsers = {}; 
        let cameraApprovalMode = false;
        let myList = [];

        let hostMediaConn = null; 
        let currentStreamToListeners = null;

        window.onload = () => {
            const unlockTTS = () => { window.speechSynthesis.speak(new SpeechSynthesisUtterance('')); };
            const hTts = document.getElementById('host-tts-toggle');
            if(hTts) hTts.addEventListener('change', unlockTTS);

            try {
                const rawData = localStorage.getItem('jukebox_mylist');
                if (rawData) {
                    const parsed = JSON.parse(rawData);
                    if (Array.isArray(parsed)) myList = parsed;
                }
            } catch(e) { myList = []; }

            const params = new URLSearchParams(window.location.search);
            try {
                if(params.has('setup_host')) {
                    currentRoomId = params.get('setup_host');
                    const history = JSON.parse(localStorage.getItem('jukebox_host_history')) || [];
                    const item = history.find(h => h.roomId === currentRoomId);
                    if(item) {
                        document.getElementById('input-room-id').value = item.roomId;
                        document.getElementById('input-host-name').value = item.hostName;
                        document.getElementById('input-host-password').value = item.password || '';
                        createRoom();
                    } else {
                        showView('setup-view');
                        renderHostHistory();
                    }
                } else {
                    showView('setup-view');
                    renderHostHistory();
                }
            } catch(e) {
                console.error("Initialization error:", e);
                showView('setup-view');
                renderHostHistory();
            }
        };

        function showView(viewId) {
            ['setup-view', 'host-view'].forEach(id => {
                const el = document.getElementById(id);
                if(el) { el.classList.add('hidden'); el.classList.remove('flex'); }
            });
            const v = document.getElementById(viewId);
            if(v) {
                v.classList.remove('hidden');
                if(viewId === 'host-view') v.classList.add('flex');
            }
        }

        function showToast(msg, type="info") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerHTML = msg;
            toast.className = `toast bg-gray-800 border-l-4 border-red-500 text-white p-4 rounded shadow-lg flex items-center gap-3 text-sm`;
            if (type === 'error') toast.classList.replace('border-indigo-500', 'border-red-500');
            else toast.classList.replace('border-red-500', 'border-indigo-500');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        let hostNewsTimeout = null;
        function showHostNews(msg) {
            const ticker = document.getElementById('host-news-ticker');
            if(ticker) {
                ticker.innerHTML = msg;
                ticker.style.opacity = '1';
                if(hostNewsTimeout) clearTimeout(hostNewsTimeout);
                hostNewsTimeout = setTimeout(() => {
                    ticker.style.opacity = '0';
                }, 5000);
            }
        }

        function generateId() { return Math.random().toString(36).substring(2, 9); }

        function generateHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash = hash & hash; 
            }
            return Math.abs(hash).toString(36);
        }

        function createRoom() {
            try {
                const idInput = document.getElementById('input-room-id').value.trim();
                const nameInput = document.getElementById('input-host-name').value.trim();
                const passInput = document.getElementById('input-host-password').value.trim(); 
                if(!idInput) { showToast("ルームIDを入力してください", "error"); return; }
                
                let baseId = idInput.replace(/[^a-zA-Z0-9-]/g, '');
                if(!baseId) { showToast("ルームIDは半角英数字で入力してください", "error"); return; }
                
                hostName = nameInput || "配信太郎";
                hostPassword = passInput; 
                
                if (hostPassword) {
                    currentRoomId = baseId + '-' + generateHash(hostPassword);
                } else {
                    currentRoomId = baseId;
                }
                
                const settingNameEl = document.getElementById('setting-host-name');
                if(settingNameEl) settingNameEl.value = hostName;
                
                generateURLs();
                updateMyListSelect();
                saveHostHistory(baseId, hostName, hostPassword); 
                initHost();
            } catch (err) {
                showToast("エラーが発生しました: " + err.message, "error");
            }
        }

        // URL生成部分を独立したファイル群へのリンクに変更
        function generateURLs() {
            const currentHref = window.location.href.split('?')[0].split('#')[0];
            const basePath = currentHref.substring(0, currentHref.lastIndexOf('/') + 1);

            const elListener = document.getElementById('url-listener');
            if(elListener) elListener.value = `${basePath}listner.html?host=${currentRoomId}`;

            const elRemote = document.getElementById('url-remote');
            if(elRemote) elRemote.value = `${basePath}controller.html?remote=${currentRoomId}`;

            const elCamera = document.getElementById('url-camera');
            if(elCamera) elCamera.value = `${basePath}camera.html?host=${currentRoomId}`;

            const elObsCam = document.getElementById('url-obs-cam');
            if(elObsCam) elObsCam.value = `${basePath}OBS.html?obs_cam=${currentRoomId}`;

            const elObs = document.getElementById('url-obs');
            if(elObs) elObs.value = `${basePath}OBS.html?obs=${currentRoomId}`;
        }

        function copyURL(inputId) {
            document.getElementById(inputId).select();
            document.execCommand("copy");
            showToast("コピーしました！");
        }

        function renderHostHistory() {
            const list = document.getElementById('setup-history-list');
            if(!list) return;
            const history = JSON.parse(localStorage.getItem('jukebox_host_history')) || [];
            
            if(history.length === 0) {
                list.innerHTML = '<p class="text-gray-500 text-center text-sm py-4">過去の作成履歴はありません</p>';
                return;
            }

            list.innerHTML = '';
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'bg-gray-800 p-3 rounded-lg flex justify-between items-center cursor-pointer hover:bg-gray-700 transition border border-transparent hover:border-red-500/50 mb-2';
                div.innerHTML = `
                    <div class="flex-1 min-w-0" onclick="joinFromHostHistory('${item.roomId}', '${item.hostName}', '${item.password || ''}')">
                        <div class="font-bold text-white text-sm truncate">${item.hostName} の部屋</div>
                        <div class="text-xs text-gray-400">ID: ${item.roomId}</div>
                    </div>
                    <button class="text-red-400 hover:text-red-300 p-2" onclick="deleteHostHistory('${item.roomId}', event)"><i class="fa-solid fa-xmark"></i></button>
                `;
                list.appendChild(div);
            });
        }

        function saveHostHistory(roomId, hostName, password) {
            if(!roomId) return;
            let history = JSON.parse(localStorage.getItem('jukebox_host_history')) || [];
            history = history.filter(h => h.roomId !== roomId);
            history.unshift({ roomId: roomId, hostName: hostName || roomId, password: password || '', time: Date.now() });
            if(history.length > 10) history = history.slice(0, 10);
            localStorage.setItem('jukebox_host_history', JSON.stringify(history));
        }

        function deleteHostHistory(roomId, event) {
            event.stopPropagation();
            let history = JSON.parse(localStorage.getItem('jukebox_host_history')) || [];
            history = history.filter(h => h.roomId !== roomId);
            localStorage.setItem('jukebox_host_history', JSON.stringify(history));
            renderHostHistory();
            showToast("履歴を削除しました");
        }

        function joinFromHostHistory(roomId, hostName, password) {
            document.getElementById('input-room-id').value = roomId;
            document.getElementById('input-host-name').value = hostName;
            document.getElementById('input-host-password').value = password || '';
            createRoom();
        }

        function toggleShareMode(enable) {
            const view = document.getElementById('host-view');
            if(enable) {
                view.classList.add('share-mode');
                showToast("画面共有モードをONにしました");
            } else {
                view.classList.remove('share-mode');
                showToast("画面共有モードを解除しました");
            }
        }

        function initHost() {
            showView('host-view');
            document.getElementById('display-room-id').textContent = currentRoomId;
            generateURLs();

            const url = new URL(window.location);
            url.searchParams.set('setup_host', currentRoomId);
            history.replaceState(null, '', url);

            peer = new Peer(`jukebox-${currentRoomId}`);

            peer.on('open', (id) => {
                document.getElementById('status-dot').classList.replace('bg-yellow-500', 'bg-green-500');
                document.getElementById('status-text').textContent = "オンライン (待機中)";
                document.getElementById('error-text').classList.add('hidden');
                loadHostState(); 
                loadYouTubeAPI(); 
                
                setInterval(() => {
                    if (player && typeof player.getCurrentTime === 'function' && typeof player.getPlayerState === 'function') {
                        let actualVideoId = currentSong ? currentSong.videoId : null;
                        try {
                            const vData = player.getVideoData();
                            if(vData && vData.video_id) actualVideoId = vData.video_id;
                        } catch(e) {}

                        const syncData = {
                            type: 'sync_playback',
                            videoId: actualVideoId,
                            time: player.getCurrentTime(),
                            status: player.getPlayerState()
                        };
                        Object.values(connectedListeners).forEach(p => {
                            if(p.conn.open) p.conn.send(syncData);
                        });
                    }
                }, 1000);

                setInterval(() => {
                    const now = Date.now();
                    Object.values(connectedListeners).forEach(p => {
                        if (p.conn.open) {
                            if (!p.lastPongReceived) p.lastPongReceived = now;
                            if (now - p.lastPongReceived > 30000) {
                                p.conn.close();
                                delete connectedListeners[p.id];
                                updateParticipantsUI();
                                broadcastState();
                            } else {
                                p.conn.send({ type: 'ping' });
                            }
                        } else {
                            delete connectedListeners[p.id];
                            updateParticipantsUI();
                            broadcastState();
                        }
                    });
                }, 10000);
            });

            peer.on('error', (err) => {
                document.getElementById('status-dot').classList.replace('bg-yellow-500', 'bg-red-500');
                document.getElementById('status-text').textContent = "エラー";
                const errTxt = document.getElementById('error-text');
                errTxt.textContent = err.type;
                errTxt.classList.remove('hidden');
            });

            peer.on('connection', (conn) => {
                if(bannedUsers[conn.peer]) {
                    conn.on('open', () => { conn.send({type: 'banned'}); conn.close(); });
                    return;
                }
                
                conn.isAuthenticated = false;

                connectedListeners[conn.peer] = {
                    id: conn.peer, conn: conn, name: "名無し", isMuted: false, cameraStatus: 'none', isRemote: false, isObs: false, call: null, hasAnnounced: false, lastPongReceived: Date.now(), isCam: conn.peer.startsWith('cam-')
                };
                updateParticipantsUI();

                conn.on('open', () => { 
                    conn.send({
                        type: 'state',
                        status: player ? (player.getPlayerState && player.getPlayerState() === 1 ? 'playing' : 'paused') : 'paused',
                        videoId: currentSong ? currentSong.videoId : null,
                        hostName: hostName,
                        requirePassword: !!hostPassword 
                    });
                    broadcastState(); 
                });
                
                conn.on('data', (data) => { 
                    if (hostPassword) {
                        if (data.type === 'auth_request') {
                            if (data.password === hostPassword) {
                                conn.isAuthenticated = true;
                                conn.send({ type: 'auth_response', success: true });
                                broadcastState();
                            } else {
                                conn.send({ type: 'auth_response', success: false });
                            }
                            return;
                        }

                        if (data.uuid) {
                            const isBannedUUID = Object.values(bannedUsers).some(u => u.uuid === data.uuid);
                            if (isBannedUUID) {
                                conn.send({type: 'banned'});
                                conn.close();
                                return;
                            }
                        }

                        const isRemoteOrCam = data.isRemote || conn.peer.startsWith('cam-');
                        if (isRemoteOrCam && !conn.isAuthenticated) {
                            conn.send({ type: 'auth_required' }); 
                            return;
                        }
                    } else {
                        conn.isAuthenticated = true;
                    }

                    if (data.type === 'pong') {
                        if (connectedListeners[conn.peer]) {
                            connectedListeners[conn.peer].lastPongReceived = Date.now();
                        }
                        return;
                    }
                    
                    handleHostData(data, conn); 
                });
                
                conn.on('close', () => {
                    if(connectedListeners[conn.peer]) {
                        delete connectedListeners[conn.peer];
                        updateParticipantsUI();
                    }
                });
            });

            peer.on('call', (call) => {
                if(call.peer.startsWith('cam-')) {
                    hostMediaConn = call;
                    call.answer();
                    call.on('stream', (stream) => {
                        const relayVid = document.getElementById('host-relay-video');
                        if (relayVid) { relayVid.srcObject = stream; relayVid.play().catch(e=>{}); }
                        document.getElementById('dummy-audio').play().catch(e=>{});
                        broadcastStreamToListeners(stream);
                    });
                    call.on('close', () => stopBroadcastStream());
                }
            });
        }

        async function fetchYouTubeTitle(videoId) {
            try {
                const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
                if(res.ok) {
                    const data = await res.json();
                    return data.title || "不明なタイトル";
                }
            } catch(e) {}
            return "不明なタイトル";
        }

        function handleHostData(data, conn) {
            const peerId = conn.peer;
            const listener = connectedListeners[peerId];

            if(bannedUsers[peerId]) return; 

            if(data.type === 'update_profile') {
                if(listener) {
                    let isReconnected = false;
                    let restoredCameraStatus = 'none';
                    let restoredIsMuted = false;

                    if (data.uuid) {
                        Object.values(connectedListeners).forEach(oldP => {
                            if (oldP.uuid === data.uuid && oldP.id !== peerId) {
                                isReconnected = true;
                                restoredCameraStatus = oldP.cameraStatus;
                                restoredIsMuted = oldP.isMuted;
                                oldP.conn.close();
                                delete connectedListeners[oldP.id];
                            }
                        });
                    }

                    const isNew = (listener.name === "名無し" || !listener.hasAnnounced) && data.name !== "名無し" && !data.isObs && !data.isRemote && !isReconnected && !listener.isCam;
                    listener.name = data.name;
                    listener.isRemote = data.isRemote || false;
                    listener.isObs = data.isObs || false;
                    listener.uuid = data.uuid; 
                    listener.lastPongReceived = Date.now();
                    
                    if (isReconnected) {
                        listener.cameraStatus = restoredCameraStatus;
                        listener.isMuted = restoredIsMuted;
                    }

                    if (listener.isObs || listener.isRemote) {
                        listener.cameraStatus = 'approved';
                        if (currentStreamToListeners && !listener.call) {
                            sendStreamToPeer(listener.id);
                        }
                    } else if (isReconnected && listener.cameraStatus === 'approved') {
                        if (currentStreamToListeners && !listener.call) {
                            sendStreamToPeer(listener.id);
                        }
                    }

                    if (isNew) {
                        listener.hasAnnounced = true;
                        showHostNews(`<i class="fa-solid fa-door-open"></i> ${data.name} が入室しました`);
                        Object.values(connectedListeners).forEach(p => {
                            if (p.isRemote && p.conn.open) p.conn.send({type: 'remote_alert', msg: `<i class="fa-solid fa-door-open"></i> <b>${data.name}</b> が入室しました`});
                        });
                    } else if (isReconnected) {
                        listener.hasAnnounced = true;
                    }

                    updateParticipantsUI();
                }
            }
            else if(data.type === 'request') {
                if(listener && listener.isMuted) {
                    conn.send({type: 'error', msg: '現在リクエストが制限されています'});
                    return;
                }
                const song = {
                    id: generateId(), videoId: data.videoId, title: "取得中...", requester: data.requester, requesterReal: data.requesterReal, isAnon: data.isAnon, isRemote: data.isRemote || false
                };
                queue.push(song);
                showToast(`${song.requester} からリクエスト！`);
                showHostNews(`<i class="fa-solid fa-music"></i> リクエスト受信: ${data.requesterReal}`);
                
                Object.values(connectedListeners).forEach(p => {
                    if (p.isRemote && p.conn.open) p.conn.send({type: 'remote_alert', msg: `<i class="fa-solid fa-music"></i> リクエスト追加: <b>${data.requesterReal}</b>`});
                });

                saveHostState();
                updateUI();
                
                fetchYouTubeTitle(song.videoId).then(title => {
                    const qItem = queue.find(q => q.id === song.id);
                    if(qItem) { qItem.title = title; saveHostState(); updateUI(); }
                });

                if(!currentSong || currentSong.isBGM) {
                    if(player && typeof player.getPlayerState === 'function') playNext();
                }
            }
            else if(data.type === 'cancel') {
                queue = queue.filter(q => q.id !== data.id);
                saveHostState();
                updateUI();
            }
            else if(data.type === 'remote_cmd') {
                if(data.cmd === 'toggle') togglePlayHost();
                else if(data.cmd === 'skip') playNext(true); 
                else if(data.cmd === 'manage') {
                    if (data.action === 'cancel_req') removeQueue(data.targetId);
                    else if (data.action === 'toggle_cam_approval') {
                        const el = document.getElementById('setting-cam-approval');
                        if (el) el.checked = data.targetId;
                        toggleCamApproval();
                    }
                    else manageUser(data.targetId, data.action);
                }
            }
            else if(data.type === 'update_theme') {
                hostTheme = data.theme;
                const themeInput = document.getElementById('setting-theme');
                if(themeInput) themeInput.value = hostTheme;
                saveHostState();
                broadcastState();
                showToast("テーマが変更されました");
            }
            else if(data.type === 'request_camera') {
                if(listener) {
                    if(cameraApprovalMode && !listener.isRemote && !listener.isObs) {
                        listener.cameraStatus = 'requested';
                        updateParticipantsUI();
                        showHostNews(`<i class="fa-solid fa-bell text-yellow-400"></i> ${listener.name} がStream視聴承認待ちです`);
                        Object.values(connectedListeners).forEach(p => {
                            if(p.isRemote && p.conn.open) p.conn.send({type: 'camera_request_alert', id: listener.id, name: listener.name});
                        });
                    } else {
                        listener.cameraStatus = 'approved';
                        if(currentStreamToListeners && !listener.call) sendStreamToPeer(peerId);
                    }
                }
            }
            else if(data.type === 'camera_stop') {
                if(hostMediaConn) hostMediaConn.close();
                stopBroadcastStream();
            }
            else if(data.type === 'chat') {
                const newChat = {
                    id: generateId(), text: data.text, sender: data.sender, senderReal: data.senderReal, isAnon: data.isAnon, isRemote: data.isRemote, time: Date.now()
                };
                
                if(!chatHistory.some(c => c.id === newChat.id)) {
                    chatHistory.push(newChat);
                    if(chatHistory.length > 100) chatHistory.shift();
                    saveHostState();
                    updateUI(); 
                    showHostNews(`<i class="fa-solid fa-comment"></i> ${newChat.senderReal}: ${newChat.text}`);
                    
                    Object.values(connectedListeners).forEach(p => {
                        if(p.conn.open) p.conn.send({type: 'new_chat', chat: newChat});
                    });
                    triggerTTS(newChat);
                }
            }
            else if(data.type === 'delete_chat') {
                deleteChat(data.id);
            }
        }

        function toggleCamApproval() {
            cameraApprovalMode = document.getElementById('setting-cam-approval').checked;
            if(!cameraApprovalMode) {
                Object.values(connectedListeners).forEach(p => {
                    if(!p.isRemote && !p.isObs) {
                        p.cameraStatus = 'approved';
                        if(currentStreamToListeners && !p.call) sendStreamToPeer(p.id);
                    }
                });
            } else {
                Object.values(connectedListeners).forEach(p => {
                    if(!p.isObs && !p.isRemote && p.cameraStatus !== 'approved') {
                        p.cameraStatus = 'none';
                    }
                });
            }
            broadcastState();
            updateParticipantsUI();
        }

        function manageUser(peerId, action) {
            const p = connectedListeners[peerId];
            if(action === 'unban') {
                delete bannedUsers[peerId];
                saveHostState();
                updateParticipantsUI();
                showToast("BANを解除しました");
                return;
            }

            if(!p) return;
            if(action === 'approve_cam') {
                p.cameraStatus = 'approved';
                if(currentStreamToListeners && !p.call) sendStreamToPeer(peerId);
                showToast(`${p.name}の視聴を許可しました`);
            } else if(action === 'reject_cam') {
                p.cameraStatus = 'none';
                showToast(`${p.name}の視聴を拒否しました`);
            } else if(action === 'mute') {
                p.isMuted = !p.isMuted;
                showToast(`${p.name}を${p.isMuted ? '投稿禁止' : '解除'}しました`);
            } else if(action === 'ban') {
                bannedUsers[peerId] = { name: p.name, time: Date.now(), uuid: p.uuid }; 
                saveHostState();
                if(p.call) p.call.close();
                p.conn.send({type: 'banned'});
                p.conn.close();
                delete connectedListeners[peerId];
                showToast(`ユーザーをBANしました`, 'error');
            }
            updateParticipantsUI();
            broadcastState(); 
        }

        function updateParticipantsUI() {
            const hList = document.getElementById('host-participant-list');
            if(hList) renderParticipantList(hList);
        }

        function renderParticipantList(container) {
            if(!container) return;
            container.innerHTML = '';
            const list = Object.values(connectedListeners);
            
            let validParticipantCount = 0;

            list.forEach(p => {
                if(p.isObs || p.isCam) return; 
                validParticipantCount++;
                const div = document.createElement('div');
                div.className = "flex items-center justify-between bg-gray-700 p-2 rounded text-sm mb-1";
                
                let nameLabel = p.name;
                if(p.isRemote) nameLabel += ' <span class="text-xs text-yellow-400">(<i class="fa-solid fa-crown text-yellow-400"></i>)</span>';
                if(p.isMuted) nameLabel += ' <span class="text-xs text-red-400"><i class="fa-solid fa-volume-xmark"></i>ミュート</span>';

                let controls = '';
                if(!p.isRemote) {
                    if(cameraApprovalMode) {
                        if(p.cameraStatus === 'requested') {
                            controls += `<button onclick="manageUser('${p.id}', 'approve_cam')" class="text-xs bg-yellow-600 hover:bg-yellow-500 text-white px-2 py-1 rounded mr-1"><i class="fa-solid fa-check"></i></button>`;
                            controls += `<button onclick="manageUser('${p.id}', 'reject_cam')" class="text-xs bg-gray-600 hover:bg-gray-500 text-white px-2 py-1 rounded mr-2"><i class="fa-solid fa-xmark"></i></button>`;
                        } else if(p.cameraStatus === 'approved') {
                            controls += `<span class="text-xs text-green-400 mr-2"><i class="fa-solid fa-video"></i>許可済</span>`;
                        }
                    }
                    controls += `<button onclick="manageUser('${p.id}', 'mute')" class="text-xs ${p.isMuted ? 'bg-gray-500' : 'bg-orange-600'} text-white px-2 py-1 rounded mr-1" title="リクエスト禁止"><i class="fa-solid fa-volume-xmark"></i></button>`;
                    controls += `<button onclick="manageUser('${p.id}', 'ban')" class="text-xs bg-red-600 hover:bg-red-500 text-white px-2 py-1 rounded" title="BAN"><i class="fa-solid fa-ban"></i></button>`;
                }

                div.innerHTML = `<div class="truncate flex-1"><span class="text-gray-200">${nameLabel}</span></div><div class="flex-shrink-0 flex items-center">${controls}</div>`;
                container.appendChild(div);
            });

            const countEl = document.getElementById('host-participant-count');
            if (countEl) countEl.textContent = `(現在: ${validParticipantCount}人)`;

            if(Object.keys(bannedUsers).length > 0) {
                const banHeader = document.createElement('div');
                banHeader.className = "text-xs font-bold text-red-400 mt-4 mb-2 border-b border-gray-700 pb-1";
                banHeader.innerHTML = `<i class="fa-solid fa-ban"></i> BANされたユーザー`;
                container.appendChild(banHeader);

                Object.entries(bannedUsers).forEach(([id, info]) => {
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between bg-red-900/30 border border-red-900 p-2 rounded text-sm mb-1";
                    div.innerHTML = `
                        <div class="truncate flex-1"><span class="text-gray-300 line-through">${info.name}</span></div>
                        <button onclick="manageUser('${id}', 'unban')" class="text-xs bg-gray-600 hover:bg-gray-500 text-white px-2 py-1 rounded">解除</button>
                    `;
                    container.appendChild(div);
                });
            }
        }

        function updateHostSettings() {
            hostName = document.getElementById('setting-host-name').value || "配信太郎";
            hostTheme = document.getElementById('setting-theme').value;
            durationLimit = parseInt(document.getElementById('setting-duration').value) * 60;
            if(isNaN(durationLimit)) durationLimit = 0;
            saveHostState();
            broadcastState();
        }

        function broadcastState() {
            const safeParticipants = Object.values(connectedListeners).map(p => ({
                id: p.id, name: p.name, isMuted: p.isMuted, cameraStatus: p.cameraStatus, isRemote: p.isRemote, isObs: p.isObs, isCam: p.isCam
            }));

            let stateCurrentSong = currentSong ? { ...currentSong } : null;
            if (stateCurrentSong && player && typeof player.getVideoData === 'function') {
                try {
                    const vData = player.getVideoData();
                    if(vData && vData.video_id) {
                        stateCurrentSong.videoId = vData.video_id;
                    }
                } catch(e) {}
            }

            const state = {
                type: 'state', queue: queue, historyQueue: historyQueue, chatHistory: chatHistory, currentSong: stateCurrentSong,
                isPlaying: player && typeof player.getPlayerState === 'function' ? (player.getPlayerState() === 1) : false,
                hostTheme: hostTheme, isLive: !!currentStreamToListeners, cameraApprovalMode: cameraApprovalMode,
                participants: safeParticipants, bannedUsers: bannedUsers
            };
            Object.values(connectedListeners).forEach(p => { if(p.conn.open) p.conn.send(state); });
        }

        function loadYouTubeAPI() {
            if (window.YT && window.YT.Player) {
                if (document.getElementById('youtube-player')) {
                    initPlayer();
                }
            } else if (!document.getElementById('youtube-api-script')) {
                const tag = document.createElement('script');
                tag.id = 'youtube-api-script';
                tag.src = 'https://www.youtube.com/iframe_api';
                const firstScriptTag = document.getElementsByTagName('script')[0];
                firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
            }
        }
        
        window.onYouTubeIframeAPIReady = function() { 
            if (document.getElementById('youtube-player')) {
                initPlayer(); 
            }
        };

        function initPlayer() {
            if(player && typeof player.playVideo === 'function') return;
            if(!document.getElementById('youtube-player')) return; 
            player = new YT.Player('youtube-player', {
                height: '100%', width: '100%',
                playerVars: { autoplay: 1, controls: 1, rel: 0 },
                events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerReady(event) {
            if(currentSong) {
                if (currentSong.listId) player.loadPlaylist({list: currentSong.listId, index: currentSong.playlistIndex || 0, startSeconds: currentSong.startSeconds || 0});
                else player.loadVideoById({videoId: currentSong.videoId, startSeconds: currentSong.startSeconds || 0});
            } else if (queue.length > 0 || bgmQueue.length > 0) playNext();
        }

        let durationCheckTimeout = null;

        function onPlayerStateChange(event) {
            updateUI(); 
            if (event.data === YT.PlayerState.PLAYING) {
                if (currentSong && currentSong.isBGM && currentSong.listId && !currentSong._settingsApplied) {
                    currentSong._settingsApplied = true;
                    if (typeof player.setShuffle === 'function') {
                        player.setShuffle(document.getElementById('bgm-shuffle').checked);
                    }
                    if (typeof player.setLoop === 'function') {
                        player.setLoop(document.getElementById('bgm-loop').checked);
                    }
                }

                if(currentSong) {
                    try {
                        let videoData = player.getVideoData();
                        if(videoData && videoData.title && currentSong.title === "取得中...") {
                            currentSong.title = videoData.title;
                            updateUI();
                        }
                    } catch(e) {}
                }
                
                if(currentSong && !currentSong.isBGM && durationLimit > 0) {
                    if(durationCheckTimeout) clearTimeout(durationCheckTimeout);
                    durationCheckTimeout = setTimeout(() => {
                        const dur = player.getDuration();
                        if(dur > durationLimit) {
                            showToast(`曲が長すぎるためスキップしました(${Math.floor(dur/60)}分)`, "error");
                            playNext(true);
                        }
                    }, 1000); 
                }
            } 
            else if (event.data === YT.PlayerState.ENDED) {
                if (currentSong && currentSong.isBGM && document.getElementById('bgm-loop-one') && document.getElementById('bgm-loop-one').checked) {
                    player.seekTo(0);
                    player.playVideo();
                    return;
                }
                playNext();
            }
        }

        function togglePlayHost() {
            if(!player || !currentSong || typeof player.getPlayerState !== 'function') return;
            if(player.getPlayerState() === 1) player.pauseVideo();
            else player.playVideo();
        }

        function playNext(forceSkip = false) {
            if (!player || typeof player.loadVideoById !== 'function') return;

            if (currentSong && !currentSong.isBGM) {
                historyQueue.unshift(currentSong);
                if (historyQueue.length > 20) historyQueue.pop();
            }

            if (currentSong && currentSong.isBGM && queue.length > 0 && !forceSkip) {
                bgmResumeData = {
                    videoId: currentSong.videoId, listId: currentSong.listId, title: currentSong.title,
                    time: player.getCurrentTime(), playlistIndex: player.getPlaylistIndex ? player.getPlaylistIndex() : 0
                };
            }

            if (queue.length > 0) {
                currentSong = queue.shift();
                player.loadVideoById({videoId: currentSong.videoId});
            } 
            else if (bgmResumeData) {
                currentSong = {
                    id: 'bgm-resumed', videoId: bgmResumeData.videoId, listId: bgmResumeData.listId,
                    title: bgmResumeData.title, requester: '🎵 待機BGM (再開)', isBGM: true,
                    startSeconds: bgmResumeData.time, playlistIndex: bgmResumeData.playlistIndex
                };
                if (currentSong.listId) player.loadPlaylist({list: currentSong.listId, index: bgmResumeData.playlistIndex, startSeconds: bgmResumeData.time});
                else player.loadVideoById({videoId: currentSong.videoId, startSeconds: bgmResumeData.time});
                bgmResumeData = null; 
            }
            else if (bgmQueue.length > 0) {
                let bgm;
                let shuffleOn = document.getElementById('bgm-shuffle') && document.getElementById('bgm-shuffle').checked;
                let loopOn = document.getElementById('bgm-loop') && document.getElementById('bgm-loop').checked;

                if (shuffleOn && bgmQueue.length > 1 && !bgmQueue[0].isPlaylist) {
                    let randomIndex = Math.floor(Math.random() * bgmQueue.length);
                    bgm = bgmQueue.splice(randomIndex, 1)[0];
                } else {
                    bgm = bgmQueue.shift();
                }

                if (loopOn) {
                    bgmQueue.push(bgm); 
                }
                
                if(bgm.isPlaylist) {
                    currentSong = { id: 'bgm-pl', videoId: '', listId: bgm.listId, title: '📁 プレイリスト', requester: '🎵 待機BGM', isBGM: true };
                    player.loadPlaylist({list: bgm.listId});
                } else {
                    currentSong = { id: 'bgm-' + generateId(), videoId: bgm.videoId, listId: null, title: bgm.title || "取得中...", requester: '🎵 待機BGM', isBGM: true };
                    player.loadVideoById({videoId: currentSong.videoId});
                }
            } else {
                currentSong = null;
                player.stopVideo();
            }
            saveHostState();
            updateUI();
        }

        function extractVideoId(url) {
            const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=))([^"&?\/\s]{11})/);
            return match ? match[1] : null;
        }

        function extractPlaylistId(url) {
            const match = url.match(/[?&]list=([^#\&\?]+)/);
            return match ? match[1] : null;
        }

        function addBGM() {
            const url = document.getElementById('input-bgm-url').value;
            if(!url) return;

            const listId = extractPlaylistId(url);
            if(listId) {
                bgmQueue.push({ isPlaylist: true, listId: listId, rawUrl: url, title: "📁 プレイリスト" });
                showToast("プレイリストを追加しました");
                updateAndSaveBGM();
            } else {
                const vid = extractVideoId(url);
                if(vid) {
                    const bgmItem = { isPlaylist: false, videoId: vid, rawUrl: url, title: "取得中..." };
                    bgmQueue.push(bgmItem);
                    showToast("BGMを追加しました");
                    updateAndSaveBGM();
                    
                    fetchYouTubeTitle(vid).then(title => {
                        const bItem = bgmQueue.find(b => b.videoId === vid);
                        if(bItem) { bItem.title = title; updateAndSaveBGM(); }
                    });
                } else showToast("無効なURLです", "error");
            }
            document.getElementById('input-bgm-url').value = '';
        }

        function updateAndSaveBGM() {
            saveHostState();
            updateUI();
            if(!currentSong && player && typeof player.getPlayerState === 'function') playNext();
        }

        function updateBGMPlaybackSettings() {
            saveHostState();
            if (player && typeof player.setShuffle === 'function' && currentSong && currentSong.isBGM && currentSong.listId) {
                player.setShuffle(document.getElementById('bgm-shuffle').checked);
                player.setLoop(document.getElementById('bgm-loop').checked);
            }
        }

        function toggleLightMode() {
            isLightMode = !isLightMode;
            const container = document.getElementById('youtube-player-container');
            const btn = document.getElementById('btn-light-mode');
            if(isLightMode) {
                container.classList.add('youtube-hidden');
                btn.innerHTML = '<i class="fa-solid fa-ban"></i> 映像OFF';
                btn.classList.replace('bg-gray-700', 'bg-red-600');
            } else {
                container.classList.remove('youtube-hidden');
                btn.innerHTML = '<i class="fa-solid fa-video"></i> 映像ON';
                btn.classList.replace('bg-red-600', 'bg-gray-700');
            }
        }

        function updateUI() {
            if(currentSong) {
                document.getElementById('host-now-playing').textContent = currentSong.title;
                document.getElementById('host-now-requester').textContent = currentSong.requester || "";
                document.querySelectorAll('.marquee-content').forEach(el => { el.style.animation = 'none'; el.offsetHeight; el.style.animation = null; });
            } else {
                document.getElementById('host-now-playing').textContent = "BGM停止中";
                document.getElementById('host-now-requester').textContent = "リクエスト待ち...";
            }

            const playBtn = document.getElementById('btn-host-play');
            if(playBtn && player && typeof player.getPlayerState === 'function') {
                const isPlaying = player.getPlayerState() === 1;
                playBtn.innerHTML = isPlaying 
                    ? `<i class="fa-solid fa-pause text-xl"></i>` 
                    : `<i class="fa-solid fa-play text-xl"></i>`;
            }

            const qList = document.getElementById('host-queue-list');
            if(qList) {
                qList.innerHTML = '';
                queue.forEach((q, idx) => {
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between bg-gray-700 p-2 rounded text-sm mb-1";
                    div.innerHTML = `
                        <div class="flex items-center gap-2 overflow-hidden">
                            <span class="text-gray-400 font-bold w-4">${idx+1}</span>
                            <div class="truncate">
                                <p class="text-white truncate font-medium">${q.title}</p>
                                <p class="text-xs text-gray-400 truncate"><i class="fa-solid fa-user"></i> ${q.requesterReal || q.requester} ${q.isRemote ? '(<i class="fa-solid fa-crown text-yellow-400"></i>)' : ''}</p>
                            </div>
                        </div>
                        <button onclick="removeQueue('${q.id}')" class="text-red-400 hover:text-red-300 px-2 flex-shrink-0"><i class="fa-solid fa-xmark"></i></button>
                    `;
                    qList.appendChild(div);
                });
            }

            const hostHist = document.getElementById('host-history-list');
            if(hostHist) {
                hostHist.innerHTML = '';
                historyQueue.forEach((q, idx) => {
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between bg-gray-900 border border-gray-700 p-2 rounded text-sm mb-1";
                    div.innerHTML = `
                        <div class="flex items-center gap-2 overflow-hidden flex-1">
                            <span class="text-gray-500 font-bold w-4">${idx+1}</span>
                            <div class="truncate">
                                <p class="text-gray-300 truncate font-medium">${q.title}</p>
                                <p class="text-xs text-gray-500 truncate"><i class="fa-solid fa-user"></i> ${q.requesterReal}</p>
                            </div>
                        </div>
                        <button onclick="reRequestHost('${q.videoId}', '${q.requesterReal}')" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-2 py-1 rounded flex-shrink-0"><i class="fa-solid fa-rotate-right"></i></button>
                    `;
                    hostHist.appendChild(div);
                });
            }

            const bList = document.getElementById('host-bgm-list');
            if(bList) {
                bList.innerHTML = '';
                bgmQueue.forEach((b, idx) => {
                    const div = document.createElement('div');
                    div.className = "flex justify-between bg-gray-900 border border-gray-700 p-2 rounded items-center mb-1";
                    div.innerHTML = `
                        <span class="text-gray-300 truncate text-xs flex-1">${b.title || '取得中...'}</span>
                        <button onclick="removeBGM(${idx})" class="text-red-400 hover:text-red-300 px-2"><i class="fa-solid fa-xmark"></i></button>
                    `;
                    bList.appendChild(div);
                });
            }

            renderChatList('host-chat-list', chatHistory);
            broadcastState();
        }

        function reRequestHost(videoId, reqName) {
            queue.push({ id: generateId(), videoId: videoId, title: "取得中...", requester: reqName, requesterReal: reqName, isAnon: false });
            showToast("再リクエストしました");
            updateUI();
            
            fetchYouTubeTitle(videoId).then(title => {
                const qItem = queue[queue.length - 1];
                if(qItem && qItem.videoId === videoId) { qItem.title = title; updateUI(); }
            });
            if(!currentSong || currentSong.isBGM) playNext();
        }

        function removeQueue(id) { queue = queue.filter(q => q.id !== id); saveHostState(); updateUI(); }
        function removeBGM(idx) { bgmQueue.splice(idx, 1); saveHostState(); updateUI(); }

        function saveHostState() {
            const bgmSettings = {
                shuffle: document.getElementById('bgm-shuffle') ? document.getElementById('bgm-shuffle').checked : false,
                loop: document.getElementById('bgm-loop') ? document.getElementById('bgm-loop').checked : true,
                loopOne: document.getElementById('bgm-loop-one') ? document.getElementById('bgm-loop-one').checked : false
            };
            const data = { queue, bgmQueue, historyQueue, chatHistory, currentSong, bgmResumeData, hostName, hostTheme, durationLimit, cameraApprovalMode, bannedUsers, bgmSettings };
            localStorage.setItem('jukebox_state_' + currentRoomId, JSON.stringify(data));
        }

        function loadHostState() {
            try {
                const saved = localStorage.getItem('jukebox_state_' + currentRoomId);
                if(saved) {
                    const data = JSON.parse(saved);
                    queue = Array.isArray(data.queue) ? data.queue : [];
                    bgmQueue = Array.isArray(data.bgmQueue) ? data.bgmQueue : [];
                    historyQueue = Array.isArray(data.historyQueue) ? data.historyQueue : [];
                    chatHistory = Array.isArray(data.chatHistory) ? data.chatHistory : [];
                    currentSong = data.currentSong || null;
                    bgmResumeData = data.bgmResumeData || null;
                    cameraApprovalMode = !!data.cameraApprovalMode;
                    bannedUsers = data.bannedUsers || {};
                    
                    const camAppEl = document.getElementById('setting-cam-approval');
                    if(camAppEl) camAppEl.checked = cameraApprovalMode;
                    
                    if(data.hostName) { hostName = data.hostName; document.getElementById('setting-host-name').value = hostName; }
                    if(data.hostTheme) { hostTheme = data.hostTheme; document.getElementById('setting-theme').value = hostTheme; }
                    if(data.durationLimit !== undefined) { durationLimit = data.durationLimit; document.getElementById('setting-duration').value = durationLimit / 60; }
                    
                    if(data.bgmSettings) {
                        if(document.getElementById('bgm-shuffle')) document.getElementById('bgm-shuffle').checked = data.bgmSettings.shuffle;
                        if(document.getElementById('bgm-loop')) document.getElementById('bgm-loop').checked = data.bgmSettings.loop;
                        if(document.getElementById('bgm-loop-one')) document.getElementById('bgm-loop-one').checked = data.bgmSettings.loopOne;
                    }

                    updateUI();
                }
            } catch(e) { console.warn("Failed to load host state", e); }
        }

        function saveToMyList() {
            const url = document.getElementById('input-bgm-url').value;
            if(!url) return showToast("URLを入力してください", "error");
            const name = prompt("このURLをマイリストに保存します。\n名前を付けてください:", "お気に入りBGM");
            if(name) {
                myList.push({ name: name, url: url });
                try {
                    localStorage.setItem('jukebox_mylist', JSON.stringify(myList));
                    updateMyListSelect();
                    showToast("マイリストに保存しました");
                } catch(e) { showToast("保存に失敗しました", "error"); }
            }
        }

        function updateMyListSelect() {
            const sel = document.getElementById('select-mylist');
            if(!sel) return;
            sel.innerHTML = '<option value="">-- 選択してください --</option>';
            myList.forEach((item, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = item.name;
                sel.appendChild(opt);
            });
        }

        function loadFromMyList() {
            const sel = document.getElementById('select-mylist');
            if(sel.value === "") return;
            document.getElementById('input-bgm-url').value = myList[sel.value].url;
            addBGM();
            sel.value = ""; 
        }

        function applyBitrate(call, bitrateKbps) {
            if(!call || !call.peerConnection) return;
            const senders = call.peerConnection.getSenders();
            const videoSender = senders.find(s => s.track && s.track.kind === 'video');
            if (videoSender) {
                const params = videoSender.getParameters();
                if (!params.encodings) params.encodings = [{}];
                params.encodings[0].maxBitrate = bitrateKbps * 1000;
                videoSender.setParameters(params).catch(e => console.log("Bitrate error:", e));
            }
        }

        function sendStreamToPeer(peerId) {
            if(!currentStreamToListeners) return;
            const listener = connectedListeners[peerId];
            if(listener && listener.conn.open) {
                const call = peer.call(peerId, currentStreamToListeners);
                listener.call = call;
                setTimeout(() => applyBitrate(call, 2500), 1000); 
            }
        }

        function broadcastStreamToListeners(stream) {
            currentStreamToListeners = stream;
            Object.values(connectedListeners).forEach(listener => {
                if(!cameraApprovalMode || listener.cameraStatus === 'approved' || listener.isObs || listener.isRemote) {
                    sendStreamToPeer(listener.id);
                }
            });
            showToast("カメラ中継を開始しました！", "info");
            broadcastState();
        }

        function stopBroadcastStream() {
            currentStreamToListeners = null;
            Object.values(connectedListeners).forEach(listener => {
                if(listener.call) { listener.call.close(); listener.call = null; }
            });
            showToast("カメラ中継が停止しました", "info");
            broadcastState(); 
        }

        function sendChatRequest() {
            const inputId = 'host-chat-input';
            const text = document.getElementById(inputId).value.trim();
            if(!text) return;

            const sender = `👑 ${hostName}`;
            const senderReal = hostName;
            
            handleHostData({type: 'chat', text: text, sender: sender, senderReal: senderReal, isAnon: false, isRemote: true}, {peer: 'host-self'});
            document.getElementById(inputId).value = '';
        }

        function deleteChat(id) {
            chatHistory = chatHistory.filter(c => c.id !== id);
            saveHostState();
            updateUI();
        }

        function renderChatList(containerId, chats) {
            const container = document.getElementById(containerId);
            if(!container) return;
            
            container.innerHTML = '';
            chats.forEach(c => {
                const div = document.createElement('div');
                div.className = "text-sm bg-gray-900/50 p-2 rounded mb-1 flex justify-between group";
                
                const dispName = c.isAnon ? '184(匿名)' : c.senderReal;
                const badge = c.isRemote ? '<i class="fa-solid fa-crown text-yellow-400"></i> ' : '';
                
                div.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <span class="text-xs text-gray-400 font-bold block truncate">${badge}${dispName}</span>
                        <p class="text-gray-200 break-all">${c.text}</p>
                    </div>
                `;
                const delBtn = document.createElement('button');
                delBtn.className = "text-red-500 hover:text-red-400 opacity-0 group-hover:opacity-100 px-2 transition-opacity flex-shrink-0";
                delBtn.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
                delBtn.onclick = () => deleteChat(c.id);
                div.appendChild(delBtn);
                
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function triggerTTS(chatObj) {
            let ttsOn = false;
            const toggle = document.getElementById('host-tts-toggle');
            if(toggle) ttsOn = toggle.checked;
            
            if(!ttsOn) return;
            
            let name = chatObj.isAnon ? '184(匿名)' : chatObj.senderReal;
            const text = `${name}さんから、${chatObj.text}`;
            const ut = new SpeechSynthesisUtterance(text);
            ut.lang = 'ja-JP';
            window.speechSynthesis.speak(ut);
        }
    </script>
</body>
