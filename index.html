<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remote Jukebox - Host Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0e0e10; color: #e4e4e7; overscroll-behavior-y: none; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0e0e10; border-left: 1px solid #27272a; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 0px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }
        .marquee-container { overflow: hidden; white-space: nowrap; position: relative; width: 100%; display: flex; }
        .marquee-content { display: inline-block; white-space: nowrap; padding-left: 100vw; animation: marquee 15s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        .toast { position: fixed; top: 20px; right: 20px; z-index: 9999; transform: translateX(150%); transition: transform 0.3s ease-in-out; }
        .toast.show { transform: translateX(0); }
        .youtube-hidden { position: absolute; width: 1px; height: 1px; top: -9999px; left: -9999px; opacity: 0; pointer-events: none; }
        input[type="text"], input[type="password"], input[type="number"], select { background-color: #0e0e10; border: 1px solid #3f3f46; color: #e4e4e7; border-radius: 2px; outline: none; transition: border-color 0.2s; }
        input[type="text"]:focus, input[type="password"]:focus, input[type="number"]:focus, select:focus { border-color: #6366f1; }
        button { border-radius: 2px; }
    </style>

    <!-- Firebase Initialization -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, addDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // 【重要】Firebase 接続設定
        // クラウド同期を利用するには、ご自身でFirebaseプロジェクトを作成し、
        // 以下の myFirebaseConfig に設定オブジェクトを貼り付けてください。
        // 例: const myFirebaseConfig = { apiKey: "AIza...", authDomain: "...", projectId: "..." };
        // ==========================================
        const myFirebaseConfig =  {
  apiKey: "AIzaSyCxE0jwT0tuvsEvMWTS4SH9FYTLdYzlIvM",
  authDomain: "beejukebox-94ad8.firebaseapp.com",
  projectId: "beejukebox-94ad8",
  storageBucket: "beejukebox-94ad8.firebasestorage.app",
  messagingSenderId: "902266249398",
  appId: "1:902266249398:web:8de3ff1d14ea5eef224617",
  measurementId: "G-H4SV4FHX3Z"
};

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'jukebox-app';
        let firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        if (!firebaseConfig && myFirebaseConfig) {
            firebaseConfig = myFirebaseConfig;
        }

        try {
            if (!firebaseConfig || Object.keys(firebaseConfig).length === 0) {
                throw new Error("Firebaseの接続設定がありません。コード内の myFirebaseConfig を設定してください。");
            }

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            // Make Firebase instances globally available for the rest of the script
            window.db = db;
            window.auth = auth;
            window.appId = appId;
            window.collection = collection;
            window.doc = doc;
            window.setDoc = setDoc;
            window.updateDoc = updateDoc;
            window.addDoc = addDoc;
            window.deleteDoc = deleteDoc;
            window.onSnapshot = onSnapshot;

            async function initFirebase() {
                try {
                    if (initialAuthToken) await signInWithCustomToken(auth, initialAuthToken);
                    else await signInAnonymously(auth);
                    window.dispatchEvent(new Event('firebase-auth-ready'));
                } catch (e) {
                    console.error("Firebase Auth Error:", e);
                    window.firebaseInitError = "Firebase認証に失敗しました: " + e.message;
                }
            }
            initFirebase();

        } catch (e) {
            console.error("Firebase Setup Error:", e);
            window.firebaseInitError = e.message;
        }
    </script>
</head>
<body class="h-[100dvh] w-full flex flex-col p-0 m-0 overflow-hidden text-sm">

    <div id="toast" class="toast bg-gray-800 border-l-4 border-indigo-500 text-white p-3 rounded-sm shadow-lg flex items-center gap-3 font-bold text-xs">
        <span id="toast-msg"></span>
    </div>

    <!-- ================= 1. ルーム作成画面 ================= -->
    <div id="setup-view" class="w-full max-w-sm bg-[#18181b] border border-gray-700 p-6 shadow-2xl m-auto relative overflow-hidden rounded-sm">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-600 to-indigo-400"></div>
        <h1 class="text-xl font-black text-center mb-1 text-white tracking-wide"><i class="fa-solid fa-music text-indigo-400"></i> REMOTE JUKEBOX</h1>
        <p class="text-gray-500 text-center text-[10px] font-bold tracking-widest uppercase mb-6">Host Dashboard (Cloud Sync)</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-[10px] font-bold text-gray-400 mb-1"><i class="fa-solid fa-hashtag"></i> ROOM ID</label>
                <input type="text" id="input-room-id" placeholder="Ex: my-radio-123" class="w-full p-2.5 text-xs shadow-inner">
            </div>
            <div>
                <label class="block text-[10px] font-bold text-gray-400 mb-1"><i class="fa-solid fa-user"></i> HOST NAME</label>
                <input type="text" id="input-host-name" placeholder="Ex: 配信太郎" class="w-full p-2.5 text-xs shadow-inner">
            </div>
            <div class="border-t border-gray-800 pt-4 mt-2">
                <label class="block text-[10px] font-bold text-gray-400 mb-1"><i class="fa-solid fa-lock"></i> PASSWORD (OPTIONAL)</label>
                <input type="password" id="input-host-password" placeholder="Ex: 1234" class="w-full p-2.5 text-xs shadow-inner">
            </div>
            <button onclick="createRoom()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 transition-colors shadow mt-2 text-xs uppercase tracking-wider">
                Create Room
            </button>
            <div class="border-t border-gray-800 pt-4 mt-4">
                <h3 class="text-[10px] font-bold text-gray-400 mb-2 uppercase tracking-wider"><i class="fa-regular fa-clock"></i> Recent Rooms</h3>
                <div id="setup-history-list" class="flex flex-col gap-1.5 max-h-32 overflow-y-auto pr-1"></div>
            </div>
        </div>
    </div>

    <!-- ================= 2. 配信者 (Host) 画面 ================= -->
    <div id="host-view" class="hidden flex-col w-full h-full">
        <header class="h-12 bg-[#18181b] border-b border-gray-700 flex items-center justify-between px-4 shrink-0 shadow-sm z-30">
            <div class="flex items-center gap-4">
                <h2 class="font-black text-sm text-gray-200 tracking-wider"><i class="fa-solid fa-crown text-yellow-500"></i> HOST DASHBOARD</h2>
                <div class="hidden sm:flex items-center gap-2 border-l border-gray-700 pl-4">
                    <span class="text-[10px] text-gray-500 font-bold uppercase">Room ID:</span>
                    <span id="display-room-id" class="text-indigo-400 font-mono font-bold text-xs bg-[#0e0e10] border border-gray-800 px-2 py-0.5 rounded-sm"></span>
                </div>
            </div>
            <div class="flex-1 overflow-hidden flex items-center justify-center px-4">
                <div id="host-news-ticker" class="text-yellow-400 font-bold text-xs opacity-0 transition-opacity duration-300 whitespace-nowrap overflow-hidden text-ellipsis"></div>
            </div>
            <div id="connection-status" class="flex items-center gap-3 shrink-0">
                <span id="error-text" class="text-[10px] text-red-400 hidden font-bold"></span>
                <div class="flex items-center gap-2 bg-[#0e0e10] border border-gray-800 px-2 py-1 rounded-sm">
                    <span class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse shadow-[0_0_5px_rgba(234,179,8,0.8)]" id="status-dot"></span>
                    <span id="status-text" class="text-[10px] font-bold text-gray-300">起動中...</span>
                </div>
            </div>
        </header>

        <div id="mobile-tab-header" class="flex lg:hidden bg-[#18181b] border-b border-gray-800 shrink-0 z-20">
            <button onclick="switchHostMobileTab('col1')" id="mobile-tab-col1" class="flex-1 py-2 text-[10px] font-bold text-indigo-400 border-b-2 border-indigo-500 transition-colors"><i class="fa-solid fa-desktop"></i> PREVIEW</button>
            <button onclick="switchHostMobileTab('col2')" id="mobile-tab-col2" class="flex-1 py-2 text-[10px] font-bold text-gray-500 border-b-2 border-transparent transition-colors"><i class="fa-solid fa-list-ul"></i> QUEUE</button>
            <button onclick="switchHostMobileTab('col3')" id="mobile-tab-col3" class="flex-1 py-2 text-[10px] font-bold text-gray-500 border-b-2 border-transparent transition-colors"><i class="fa-solid fa-gear"></i> SETTINGS</button>
        </div>

        <main class="flex-1 flex flex-col lg:flex-row overflow-hidden relative">
            <!-- Column 1: Preview -->
            <div id="host-col-1" class="flex flex-col w-full lg:w-5/12 h-full border-b lg:border-b-0 lg:border-r border-gray-800 bg-[#111827] overflow-y-auto p-3 gap-3">
                <div id="mobile-now-playing-container" class="lg:hidden flex items-center gap-2 bg-[#0e0e10] border border-gray-700 p-2 rounded-sm shrink-0 shadow-sm">
                    <span class="text-[9px] font-black text-red-500 tracking-widest shrink-0"><i class="fa-solid fa-play"></i> NOW:</span>
                    <div class="marquee-container h-4 flex-1">
                        <div class="marquee-content host-now-playing-text font-bold text-[10px] text-gray-100 tracking-wide">BGM停止中</div>
                    </div>
                </div>

                <div class="flex items-center gap-2 bg-[#0e0e10] border border-gray-700 p-1.5 rounded-sm shrink-0 shadow-sm">
                    <span class="bg-gray-800 text-yellow-500 text-[9px] font-black tracking-widest px-2 py-1 rounded-sm border border-gray-700">THEME</span>
                    <input type="text" id="setting-theme" class="flex-1 bg-transparent outline-none text-xs text-white placeholder-gray-600 font-bold" placeholder="現在のテーマ・気分を入力して共有..." onchange="updateHostSettings()">
                </div>

                <div class="flex justify-between items-center shrink-0">
                    <div class="hidden lg:flex items-center gap-2 overflow-hidden flex-1 mr-4 bg-[#0e0e10] border border-gray-700 p-1.5 rounded-sm shadow-sm">
                        <span class="text-[9px] font-black text-red-500 tracking-widest shrink-0"><i class="fa-solid fa-play"></i> NOW:</span>
                        <div class="marquee-container h-4 flex-1">
                            <div class="marquee-content host-now-playing-text font-bold text-[10px] text-gray-100 tracking-wide">BGM停止中</div>
                        </div>
                        <span class="host-now-requester-text text-gray-500 font-normal text-[10px] shrink-0 ml-2">---</span>
                    </div>
                    <div class="flex justify-end lg:shrink-0 w-full lg:w-auto">
                        <button onclick="toggleLightMode()" id="btn-light-mode" class="text-[10px] bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 px-2 py-1 rounded-sm transition-colors flex items-center gap-1.5 font-bold shadow-sm">
                            <i class="fa-solid fa-video"></i> 映像ON
                        </button>
                    </div>
                </div>

                <div class="flex flex-col lg:flex-row gap-2 shrink-0">
                    <div class="flex-1 bg-black border border-gray-700 relative aspect-video shadow-inner rounded-sm overflow-hidden">
                        <div class="absolute top-1 left-1 bg-indigo-600/90 border border-indigo-400 px-1.5 py-0.5 text-[9px] font-bold z-10 text-white rounded-sm tracking-wider">JUKEBOX</div>
                        <div id="youtube-player-container" class="w-full h-full"><div id="youtube-player"></div></div>
                    </div>
                    <div class="hidden lg:flex flex-1 bg-black border border-gray-700 relative aspect-video items-center justify-center shadow-inner rounded-sm overflow-hidden">
                        <div class="absolute top-1 left-1 bg-red-600/90 border border-red-400 px-1.5 py-0.5 text-[9px] font-bold z-10 text-white rounded-sm tracking-wider">STREAM</div>
                        <span id="host-stream-offline" class="text-gray-700 text-[10px] font-black tracking-widest z-0">NO SIGNAL</span>
                        <video id="host-stream-preview" playsinline class="w-full h-full object-contain absolute inset-0 z-10 hidden"></video>
                    </div>
                </div>

                <div id="mobile-controls-container" class="lg:hidden flex flex-col gap-2 shrink-0">
                    <div class="flex justify-center gap-4">
                        <button onclick="togglePlayHost()" class="btn-host-play bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-600 p-2.5 rounded-sm flex items-center justify-center w-12 h-10 shadow transition-colors">
                            <i class="fa-solid fa-play text-sm"></i>
                        </button>
                        <button onclick="playNext(true)" class="bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-600 p-2.5 rounded-sm flex items-center justify-center w-12 h-10 shadow transition-colors">
                            <i class="fa-solid fa-forward-step text-sm"></i>
                        </button>
                    </div>
                    <div class="flex gap-1.5">
                        <input type="text" id="host-request-url-mobile" placeholder="YouTube URLをリクエスト..." class="flex-1 p-2 text-[10px] shadow-inner bg-[#0e0e10] border border-gray-700 text-white">
                        <button onclick="sendHostRequest('mobile')" class="bg-red-600 hover:bg-red-500 text-white px-3 rounded-sm text-[10px] font-bold transition-colors shadow-sm">追加</button>
                    </div>
                </div>

                <div id="host-audio-mixer" class="hidden lg:block bg-[#18181b] border border-gray-700 p-2.5 rounded-sm shrink-0 shadow-sm">
                    <div class="text-[9px] font-black text-gray-500 mb-2 border-b border-gray-800 pb-1 tracking-widest">AUDIO MIXER (MONITORING)</div>
                    <div class="space-y-2.5">
                        <div class="flex items-center gap-3">
                            <span class="w-14 text-[10px] font-bold text-indigo-400 tracking-wider">JUKEBOX</span>
                            <button onclick="toggleHostJukeboxMute()" class="w-6 h-6 bg-[#0e0e10] hover:bg-gray-800 border border-gray-700 rounded-sm flex items-center justify-center text-gray-400 transition-colors shrink-0">
                                <i id="icon-host-jukebox-mute" class="fa-solid fa-volume-high text-[10px]"></i>
                            </button>
                            <input type="range" id="host-jukebox-vol" min="0" max="100" value="100" class="flex-1 h-1.5 bg-gray-800 rounded-full appearance-none accent-indigo-500 cursor-pointer" oninput="changeHostJukeboxVol(this.value)">
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="w-14 text-[10px] font-bold text-red-400 tracking-wider">STREAM</span>
                            <button onclick="toggleHostStreamMute()" class="w-6 h-6 bg-[#0e0e10] hover:bg-gray-800 border border-gray-700 rounded-sm flex items-center justify-center text-gray-400 transition-colors shrink-0">
                                <i id="icon-host-stream-mute" class="fa-solid fa-volume-xmark text-[10px]"></i>
                            </button>
                            <input type="range" id="host-stream-vol" min="0" max="100" value="0" class="flex-1 h-1.5 bg-gray-800 rounded-full appearance-none accent-red-500 cursor-pointer" oninput="changeHostStreamVol(this.value)">
                        </div>
                    </div>
                </div>

                <div id="pc-controls-container" class="hidden lg:flex bg-[#18181b] border border-gray-700 p-3 rounded-sm flex-col gap-2 shrink-0 shadow-sm mt-1">
                    <div class="flex justify-center gap-4">
                        <button onclick="togglePlayHost()" class="btn-host-play bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-600 p-2.5 rounded-sm flex items-center justify-center w-12 h-8 transition-colors shadow">
                            <i class="fa-solid fa-play text-sm"></i>
                        </button>
                        <button onclick="playNext(true)" class="bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-600 p-2.5 rounded-sm flex items-center justify-center w-12 h-8 transition-colors shadow">
                            <i class="fa-solid fa-forward-step text-sm"></i>
                        </button>
                    </div>
                    <div class="border-t border-gray-800 pt-2 flex gap-1.5 shrink-0 mt-1">
                        <input type="text" id="host-request-url-pc" placeholder="YouTube URLをリクエスト..." class="flex-1 p-1.5 text-[10px] bg-[#0e0e10] border border-gray-700 text-white">
                        <button onclick="sendHostRequest('pc')" class="bg-red-600 hover:bg-red-500 text-white px-3 rounded-sm text-[10px] font-bold transition-colors shadow-sm">追加</button>
                    </div>
                </div>
                <div id="mobile-chat-participant-container" class="flex flex-col gap-3 lg:hidden shrink-0 pb-4"></div>
            </div>

            <!-- Column 2: Queue -->
            <div id="host-col-2" class="hidden lg:flex flex-col w-full lg:w-3/12 h-full border-b lg:border-b-0 lg:border-r border-gray-800 bg-[#0e0e10]">
                <div class="h-1/2 flex flex-col border-b border-gray-800 p-2.5">
                    <div class="flex justify-between items-center border-b border-gray-800 pb-1.5 mb-2 shrink-0">
                        <h3 class="text-[10px] font-black text-gray-400 tracking-widest uppercase"><i class="fa-solid fa-list-ul"></i> REQUEST QUEUE</h3>
                        <span class="text-[9px] bg-gray-800 px-1.5 py-0.5 rounded-sm text-gray-300 font-bold border border-gray-700" id="queue-badge">0</span>
                    </div>
                    <div id="host-queue-list" class="flex-1 overflow-y-auto space-y-1.5 pr-1 min-h-0"></div>
                </div>
                <div class="h-1/2 flex flex-col p-2.5">
                    <h3 class="text-[10px] font-black text-gray-400 border-b border-gray-800 pb-1.5 mb-2 shrink-0 tracking-widest uppercase"><i class="fa-regular fa-clock"></i> HISTORY</h3>
                    <div id="host-history-list" class="flex-1 overflow-y-auto space-y-1.5 pr-1 min-h-0"></div>
                </div>
            </div>

            <!-- Column 3: Chat & Settings -->
            <div id="host-col-3" class="hidden lg:flex flex-col w-full lg:w-4/12 h-full bg-[#0e0e10]">
                <div id="host-col-3-top" class="hidden lg:flex h-1/2 flex-col border-b border-gray-800 p-2.5">
                    <div id="chat-container" class="flex flex-col h-full bg-[#111827] rounded-sm p-2 shadow-sm">
                        <div class="flex justify-between items-center border-b border-gray-800 pb-1.5 mb-2 shrink-0">
                            <h3 class="text-[10px] font-black text-gray-400 tracking-widest uppercase"><i class="fa-solid fa-comment-dots"></i> LIVE CHAT</h3>
                            <label class="flex items-center gap-1.5 text-[9px] font-bold text-gray-400 cursor-pointer hover:text-gray-200 transition-colors">
                                <input type="checkbox" id="host-tts-toggle" class="rounded-sm bg-[#0e0e10] border-gray-700 text-indigo-500 focus:ring-transparent">
                                <i class="fa-solid fa-head-side-waveform"></i> 読上
                            </label>
                        </div>
                        <div id="host-chat-list" class="flex-1 overflow-y-auto space-y-1 pr-1 mb-2 min-h-0"></div>
                        <div class="flex gap-1.5 shrink-0">
                            <input type="text" id="host-chat-input" onkeypress="if(event.key === 'Enter') sendChatRequest()" placeholder="メッセージ..." class="flex-1 p-2 text-xs bg-[#0e0e10] border border-gray-700" autocomplete="off">
                            <button onclick="sendChatRequest()" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 w-10 rounded-sm flex items-center justify-center transition-colors shadow-sm"><i class="fa-solid fa-paper-plane text-xs"></i></button>
                        </div>
                    </div>
                </div>

                <div class="flex-1 lg:h-1/2 flex flex-col">
                    <div class="flex bg-[#18181b] border-b border-gray-700 shrink-0 shadow-sm">
                        <button onclick="switchHostSettingsTab('participants')" id="tab-btn-participants" class="hidden lg:block flex-1 py-2 text-[9px] font-black tracking-widest border-b-2 border-indigo-500 text-indigo-400 transition-colors">PARTICIPANTS</button>
                        <button onclick="switchHostSettingsTab('bgm')" id="tab-btn-bgm" class="flex-1 py-2 text-[9px] font-black tracking-widest border-b-2 border-transparent text-gray-500 hover:text-gray-300 transition-colors">BGM</button>
                        <button onclick="switchHostSettingsTab('settings')" id="tab-btn-settings" class="flex-1 py-2 text-[9px] font-black tracking-widest border-b-2 border-transparent text-gray-500 hover:text-gray-300 transition-colors">SETTING/URL</button>
                    </div>

                    <div class="flex-1 overflow-y-auto p-2.5 relative min-h-0">
                        <div id="tab-content-participants" class="absolute inset-0 p-2.5 flex flex-col overflow-y-auto">
                            <div id="participant-container" class="flex flex-col h-full bg-[#111827] rounded-sm p-2 shadow-sm min-h-0">
                                <div class="flex justify-between items-center mb-2 border-b border-gray-800 pb-1.5 shrink-0">
                                    <h3 class="text-[10px] font-bold text-gray-400"><i class="fa-solid fa-users"></i> 参加者 <span id="host-participant-count" class="font-normal ml-1"></span></h3>
                                </div>
                                <div id="host-participant-list" class="flex-1 space-y-1 pr-1 overflow-y-auto min-h-0"></div>
                            </div>
                        </div>

                        <div id="tab-content-bgm" class="hidden absolute inset-0 p-2.5 flex flex-col overflow-y-auto space-y-3">
                            <div>
                                <div class="flex gap-1.5 mb-2">
                                    <input type="text" id="input-bgm-url" placeholder="YouTube URL" class="min-w-0 flex-1 p-2 text-[10px]">
                                    <button onclick="addBGM()" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 px-3 rounded-sm text-[10px] font-bold transition-colors">追加</button>
                                </div>
                                <div class="flex flex-wrap gap-x-3 gap-y-1.5 mb-2 text-[9px] text-gray-400 border-b border-gray-800 pb-2 font-bold uppercase">
                                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="bgm-shuffle" class="rounded-sm bg-[#0e0e10] border-gray-700 text-indigo-500"> <i class="fa-solid fa-shuffle"></i> SHUF</label>
                                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="bgm-loop" checked class="rounded-sm bg-[#0e0e10] border-gray-700 text-indigo-500"> <i class="fa-solid fa-repeat"></i> LOOP</label>
                                </div>
                            </div>
                            <div class="flex-1 border-t border-gray-800 pt-2 min-h-0">
                                <div id="host-bgm-list" class="space-y-1 max-h-full overflow-y-auto pr-1"></div>
                            </div>
                        </div>

                        <div id="tab-content-settings" class="hidden absolute inset-0 p-2.5 flex flex-col overflow-y-auto space-y-3">
                            <div class="space-y-2 border-b border-gray-800 pb-3">
                                <h3 class="text-[10px] font-bold text-gray-400 mb-1"><i class="fa-solid fa-gear"></i> BASIC CONFIG</h3>
                                <div><label class="block text-[9px] text-gray-500 mb-0.5">HOST NAME</label><input type="text" id="setting-host-name" class="w-full p-1.5 text-xs" onchange="updateHostSettings()"></div>
                                <div><label class="block text-[9px] text-gray-500 mb-0.5">MAX DURATION (MIN)</label><input type="number" id="setting-duration" value="10" class="w-full p-1.5 text-xs" onchange="updateHostSettings()"></div>
                            </div>
                            <div class="space-y-2.5">
                                <h3 class="text-[10px] font-bold text-gray-400 mb-1"><i class="fa-solid fa-link"></i> SHARED URLs</h3>
                                <div>
                                    <label class="block text-[9px] font-bold text-gray-400 mb-0.5">LISTENER (VIEWER)</label>
                                    <div class="flex gap-1.5">
                                        <input type="text" id="url-listener" readonly class="flex-1 p-1 text-[10px] text-gray-400 border-gray-800 bg-gray-900/30">
                                        <button onclick="copyURL('url-listener')" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 px-2 rounded-sm text-[9px] font-bold">COPY</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- カメラ中継用ダミー -->
    <audio id="dummy-audio" src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA" loop playsinline></audio>

    <script>
        let peer = null;
        let currentRoomId = null;
        
        let hostPassword = ''; 
        let queue = [];
        let bgmQueue = [];
        let historyQueue = [];
        let chatHistory = []; 
        let currentSong = null;
        let player = null;
        let isLightMode = false;
        let hostName = "配信太郎";
        let hostTheme = "";
        let durationLimit = 10 * 60;
        let isHostStateLoaded = false; 

        let connectedListeners = {}; 

        // === Layout Adjustments ===
        function adjustLayoutForMobile() {
            const isMobile = window.innerWidth < 1024;
            const chatContainer = document.getElementById('chat-container');
            const participantContainer = document.getElementById('participant-container');
            const col3Top = document.getElementById('host-col-3-top');
            const tabParticipants = document.getElementById('tab-content-participants');
            const mobileContainer = document.getElementById('mobile-chat-participant-container');
            
            if (isMobile) {
                if (chatContainer.parentNode !== mobileContainer) { mobileContainer.appendChild(chatContainer); chatContainer.classList.remove('h-full'); chatContainer.style.height = '280px'; }
                if (participantContainer.parentNode !== mobileContainer) { mobileContainer.appendChild(participantContainer); participantContainer.classList.remove('h-full'); participantContainer.style.height = '250px'; }
            } else {
                if (chatContainer.parentNode !== col3Top) { col3Top.appendChild(chatContainer); chatContainer.classList.add('h-full'); chatContainer.style.height = '100%'; }
                if (participantContainer.parentNode !== tabParticipants) { tabParticipants.appendChild(participantContainer); participantContainer.classList.add('h-full'); participantContainer.style.height = '100%'; }
            }
        }
        function updateStreamAudioByWindowSize() {
            const vid = document.getElementById('host-stream-preview');
            if(!vid) return;
            if(window.innerWidth < 1024) vid.muted = true;
            else {
                const icon = document.getElementById('icon-host-stream-mute');
                vid.muted = icon ? icon.classList.contains('fa-volume-xmark') : false;
                const volSlider = document.getElementById('host-stream-vol');
                if (volSlider) vid.volume = volSlider.value / 100;
            }
        }

        window.addEventListener('resize', () => {
            adjustLayoutForMobile();
            updateStreamAudioByWindowSize();
            if(window.innerWidth >= 1024) {
                document.getElementById('host-col-1').classList.replace('hidden', 'flex');
                document.getElementById('host-col-2').classList.replace('hidden', 'flex');
                document.getElementById('host-col-3').classList.replace('hidden', 'flex');
            }
        });

        function switchHostMobileTab(tabName) {
            ['col1', 'col2', 'col3'].forEach(name => {
                const btn = document.getElementById('mobile-tab-' + name);
                if(btn) {
                    if(name === tabName) btn.classList.add('text-indigo-400', 'border-indigo-500');
                    else { btn.classList.remove('text-indigo-400', 'border-indigo-500'); btn.classList.add('text-gray-500', 'border-transparent'); }
                }
            });
            const cols = [document.getElementById('host-col-1'), document.getElementById('host-col-2'), document.getElementById('host-col-3')];
            if(window.innerWidth < 1024) {
                cols.forEach((col, idx) => {
                    if(`col${idx+1}` === tabName) col.classList.replace('hidden', 'flex');
                    else col.classList.replace('flex', 'hidden');
                });
                if (tabName === 'col3') {
                    const partContent = document.getElementById('tab-content-participants');
                    if(partContent && !partContent.classList.contains('hidden')) switchHostSettingsTab('bgm');
                    else if (document.getElementById('tab-btn-bgm').classList.contains('border-transparent') && document.getElementById('tab-btn-settings').classList.contains('border-transparent')) switchHostSettingsTab('bgm');
                }
            }
        }

        function switchHostSettingsTab(tabName) {
            ['participants', 'bgm', 'settings'].forEach(name => {
                const btn = document.getElementById('tab-btn-' + name);
                const content = document.getElementById('tab-content-' + name);
                if(btn) {
                    if(name === tabName) { btn.classList.add('text-indigo-400', 'border-indigo-500'); btn.classList.remove('text-gray-500', 'border-transparent'); if(content) content.classList.remove('hidden'); }
                    else { btn.classList.remove('text-indigo-400', 'border-indigo-500'); btn.classList.add('text-gray-500', 'border-transparent'); if(content) content.classList.add('hidden'); }
                }
            });
        }

        function showToast(msg, type="info") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerHTML = msg;
            toast.className = `toast bg-[#18181b] border-l-4 border-indigo-500 text-gray-200 p-3 rounded-sm shadow-xl flex items-center gap-3 text-xs font-bold`;
            if (type === 'error') toast.classList.replace('border-indigo-500', 'border-red-500');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function generateId() { return Math.random().toString(36).substring(2, 9); }
        function generateHash(str) { let hash = 0; for (let i = 0; i < str.length; i++) { hash = ((hash << 5) - hash) + str.charCodeAt(i); hash = hash & hash; } return Math.abs(hash).toString(36); }

        window.onload = () => {
            adjustLayoutForMobile(); 
            const unlockTTS = () => { window.speechSynthesis.speak(new SpeechSynthesisUtterance('')); };
            const hTts = document.getElementById('host-tts-toggle');
            if(hTts) hTts.addEventListener('change', unlockTTS);

            const params = new URLSearchParams(window.location.search);
            if(params.has('setup_host')) {
                currentRoomId = params.get('setup_host');
                const history = JSON.parse(localStorage.getItem('jukebox_host_history')) || [];
                const item = history.find(h => h.roomId === currentRoomId);
                if(item) {
                    document.getElementById('input-room-id').value = item.roomId;
                    document.getElementById('input-host-name').value = item.hostName;
                    document.getElementById('input-host-password').value = item.password || '';
                    createRoom();
                } else {
                    showView('setup-view'); renderHostHistory();
                }
            } else {
                showView('setup-view'); renderHostHistory();
            }
        };

        function showView(viewId) {
            ['setup-view', 'host-view'].forEach(id => {
                const el = document.getElementById(id);
                if(el) el.classList.replace('flex', 'hidden') || el.classList.add('hidden');
            });
            const v = document.getElementById(viewId);
            if(v) { v.classList.remove('hidden'); if(viewId === 'host-view') v.classList.add('flex'); }
        }

        function createRoom() {
            const idInput = document.getElementById('input-room-id').value.trim();
            const nameInput = document.getElementById('input-host-name').value.trim();
            const passInput = document.getElementById('input-host-password').value.trim(); 
            if(!idInput) return showToast("ルームIDを入力してください", "error");
            
            let baseId = idInput.replace(/[^a-zA-Z0-9-]/g, '');
            if(!baseId) return showToast("ルームIDは半角英数字で入力してください", "error");

            if (window.firebaseInitError) {
                alert("【DB接続エラー】\n" + window.firebaseInitError + "\n\nクラウド同期を利用するには、ご自身でFirebaseを作成しコードに設定キーを貼り付ける必要があります。");
                return;
            }
            
            hostName = nameInput || "配信太郎";
            hostPassword = passInput; 
            currentRoomId = hostPassword ? baseId + '-' + generateHash(hostPassword) : baseId;
            
            const settingNameEl = document.getElementById('setting-host-name');
            if(settingNameEl) settingNameEl.value = hostName;
            
            generateURLs();
            saveHostHistory(baseId, hostName, hostPassword); 

            // Firebase Readiness Check before initHost
            if (window.db) {
                initHost();
            } else {
                window.addEventListener('firebase-auth-ready', initHost, { once: true });
            }
        }

        function generateURLs() {
            const base = window.location.href.split('?')[0].split('#')[0];
            const baseUrlPath = base.substring(0, base.lastIndexOf('/') + 1);
            const elListener = document.getElementById('url-listener');
            if(elListener) elListener.value = `${baseUrlPath}listener.html?host=${currentRoomId}`;
        }

        function copyURL(inputId) { document.getElementById(inputId).select(); document.execCommand("copy"); showToast("URLをコピーしました！"); }

        function renderHostHistory() {
            const list = document.getElementById('setup-history-list');
            if(!list) return;
            const history = JSON.parse(localStorage.getItem('jukebox_host_history')) || [];
            if(history.length === 0) { list.innerHTML = '<p class="text-gray-600 text-center text-xs py-4 font-bold">過去の作成履歴はありません</p>'; return; }
            list.innerHTML = '';
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'bg-[#0e0e10] p-2.5 rounded-sm flex justify-between items-center cursor-pointer hover:bg-gray-800 transition border border-gray-800 hover:border-indigo-500/50 mb-1.5 shadow-inner group';
                div.innerHTML = `
                    <div class="flex-1 min-w-0" onclick="joinFromHostHistory('${item.roomId}', '${item.hostName}', '${item.password || ''}')">
                        <div class="font-bold text-gray-200 text-xs truncate group-hover:text-indigo-400 transition-colors">${item.hostName} の部屋</div>
                        <div class="text-[9px] text-gray-500 font-mono mt-0.5 tracking-wider">ID: ${item.roomId}</div>
                    </div>
                    <button class="text-gray-600 hover:text-red-400 px-2 transition-colors" onclick="deleteHostHistory('${item.roomId}', event)"><i class="fa-solid fa-trash-can"></i></button>
                `;
                list.appendChild(div);
            });
        }

        function saveHostHistory(roomId, hostName, password) {
            let history = JSON.parse(localStorage.getItem('jukebox_host_history')) || [];
            history = history.filter(h => h.roomId !== roomId);
            history.unshift({ roomId: roomId, hostName: hostName || roomId, password: password || '', time: Date.now() });
            if(history.length > 10) history = history.slice(0, 10);
            localStorage.setItem('jukebox_host_history', JSON.stringify(history));
        }

        function deleteHostHistory(roomId, event) {
            event.stopPropagation();
            let history = JSON.parse(localStorage.getItem('jukebox_host_history')) || [];
            history = history.filter(h => h.roomId !== roomId);
            localStorage.setItem('jukebox_host_history', JSON.stringify(history));
            renderHostHistory();
        }

        function joinFromHostHistory(roomId, hostName, password) {
            document.getElementById('input-room-id').value = roomId;
            document.getElementById('input-host-name').value = hostName;
            document.getElementById('input-host-password').value = password || '';
            createRoom();
        }

        // ================= Firestore Integration =================
        function initHost() {
            showView('host-view');
            document.getElementById('display-room-id').textContent = currentRoomId;
            generateURLs();
            const url = new URL(window.location);
            url.searchParams.set('setup_host', currentRoomId);
            history.replaceState(null, '', url);

            // Initialize Room in Firestore
            window.setDoc(window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', currentRoomId), {
                hostName: hostName,
                theme: hostTheme,
                status: 'paused',
                currentSong: null,
                isLive: false
            }, { merge: true }).then(() => {
                document.getElementById('status-dot').classList.replace('bg-yellow-500', 'bg-green-500');
                document.getElementById('status-text').textContent = "CLOUD SYNC ACTIVE";
            });

            // Listen to Queues from Firestore
            window.onSnapshot(window.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'queues'), (snapshot) => {
                let allQ = [];
                snapshot.forEach(doc => {
                    const d = doc.data();
                    if (d.roomId === currentRoomId) allQ.push({ id: doc.id, ...d });
                });
                allQ.sort((a, b) => a.createdAt - b.createdAt);
                queue = allQ;
                updateUI();
                
                // Auto play if stopped
                if(!currentSong && queue.length > 0 && player && typeof player.getPlayerState === 'function') {
                     playNext();
                }
            });

            // Listen to Chats from Firestore
            window.onSnapshot(window.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'chats'), (snapshot) => {
                let allC = [];
                snapshot.forEach(doc => {
                    const d = doc.data();
                    if (d.roomId === currentRoomId) allC.push({ id: doc.id, ...d });
                });
                allC.sort((a, b) => a.createdAt - b.createdAt);
                
                // Diff check to trigger TTS for new messages
                if (allC.length > chatHistory.length && allC.length > 0) {
                    const newestChat = allC[allC.length - 1];
                    // Very simple check to prevent TTS on initial load flood
                    if (Date.now() - newestChat.createdAt < 5000) {
                        triggerTTS(newestChat);
                    }
                }
                
                chatHistory = allC.slice(-100);
                renderChatList('host-chat-list', chatHistory);
            });

            loadYouTubeAPI(); 
            
            // --- Legacy P2P (Kept temporarily for camera/participant if needed later) ---
            peer = new Peer(`jukebox-${currentRoomId}`);
            peer.on('connection', (conn) => {
                 // For now, accept connection but rely on Firestore for main data
                 connectedListeners[conn.peer] = { id: conn.peer, conn: conn, name: "リスナー", isMuted: false, cameraStatus: 'none', isRemote: false, isObs: false, isCam: false };
                 updateParticipantsUI();
            });
            peer.on('call', (call) => {
                 // Reserved for camera relay
            });
        }

        async function fetchYouTubeTitle(videoId) {
            try {
                const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
                if(res.ok) { const data = await res.json(); return data.title || "不明なタイトル"; }
            } catch(e) {}
            return "不明なタイトル";
        }

        function extractVideoId(url) {
            const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=))([^"&?\/\s]{11})/);
            return match ? match[1] : null;
        }

        // Send Request -> Firestore
        function sendHostRequest(mode = 'pc') {
            const inputId = mode === 'mobile' ? 'host-request-url-mobile' : 'host-request-url-pc';
            const url = document.getElementById(inputId).value;
            if(!url) return;
            const vid = extractVideoId(url);
            if(vid) {
                document.getElementById(inputId).value = '';
                showToast(`リクエストを送信中...`);
                fetchYouTubeTitle(vid).then(title => {
                    window.addDoc(window.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'queues'), {
                        roomId: currentRoomId,
                        videoId: vid,
                        title: title,
                        requester: "👑 " + hostName,
                        requesterReal: hostName,
                        isAnon: false,
                        isRemote: true,
                        isBGM: false,
                        createdAt: Date.now()
                    });
                });
            } else {
                showToast("無効なYouTube URLです", "error");
            }
        }

        // Send Chat -> Firestore
        function sendChatRequest() {
            const inputId = 'host-chat-input';
            const text = document.getElementById(inputId).value.trim();
            if(!text) return;
            document.getElementById(inputId).value = '';

            window.addDoc(window.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'chats'), {
                roomId: currentRoomId,
                text: text,
                sender: `👑 ${hostName}`,
                senderReal: hostName,
                isAnon: false,
                isRemote: true,
                createdAt: Date.now()
            });
        }

        function removeQueue(docId) {
            window.deleteDoc(window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'queues', docId));
        }

        // YouTube Player Logic with Firestore Sync
        function loadYouTubeAPI() {
            if (window.YT && window.YT.Player) {
                if (document.getElementById('youtube-player')) initPlayer();
            } else if (!document.getElementById('youtube-api-script')) {
                const tag = document.createElement('script');
                tag.id = 'youtube-api-script';
                tag.src = 'https://www.youtube.com/iframe_api';
                const firstScriptTag = document.getElementsByTagName('script')[0];
                firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
            }
        }
        window.onYouTubeIframeAPIReady = function() { if (document.getElementById('youtube-player')) initPlayer(); };

        function initPlayer() {
            if(player && typeof player.playVideo === 'function') return;
            if(!document.getElementById('youtube-player')) return; 
            player = new YT.Player('youtube-player', {
                height: '100%', width: '100%',
                playerVars: { autoplay: 1, controls: 1, rel: 0 },
                events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerReady(event) {
            if(currentSong) {
                player.loadVideoById({videoId: currentSong.videoId});
            } else if (queue.length > 0) {
                playNext();
            }
        }

        function onPlayerStateChange(event) {
            updateUI(); 
            if (event.data === YT.PlayerState.PLAYING) {
                if (currentSong) {
                    const startedAt = Date.now() - (player.getCurrentTime() * 1000);
                    window.updateDoc(window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', currentRoomId), {
                        status: 'playing',
                        'currentSong.startedAt': startedAt
                    });
                }
            } else if (event.data === YT.PlayerState.PAUSED) {
                if (currentSong) {
                    window.updateDoc(window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', currentRoomId), {
                        status: 'paused',
                        'currentSong.pausePosition': player.getCurrentTime()
                    });
                }
            } else if (event.data === YT.PlayerState.ENDED) {
                playNext();
            }
        }

        function togglePlayHost() {
            if(!player || !currentSong || typeof player.getPlayerState !== 'function') return;
            if(player.getPlayerState() === 1) player.pauseVideo();
            else player.playVideo();
        }

        function playNext() {
            if (!player || typeof player.loadVideoById !== 'function') return;

            if (currentSong && !currentSong.isBGM) {
                historyQueue.unshift(currentSong);
                if (historyQueue.length > 20) historyQueue.pop();
            }

            if (queue.length > 0) {
                currentSong = queue[0];
                // Remove from Firestore queue
                removeQueue(currentSong.id);
                
                // Update Room State
                window.updateDoc(window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', currentRoomId), {
                    currentSong: currentSong,
                    status: 'paused'
                });
                
                player.loadVideoById({videoId: currentSong.videoId});
            } else {
                currentSong = null;
                window.updateDoc(window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', currentRoomId), {
                    currentSong: null,
                    status: 'paused'
                });
                player.stopVideo();
            }
            updateUI();
        }

        function updateHostSettings() {
            hostName = document.getElementById('setting-host-name').value || "配信太郎";
            hostTheme = document.getElementById('setting-theme').value;
            window.updateDoc(window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', currentRoomId), {
                theme: hostTheme
            });
        }

        // --- UI Updates ---
        function updateUI() {
            if(currentSong) {
                document.querySelectorAll('.host-now-playing-text').forEach(el => el.textContent = currentSong.title);
                document.querySelectorAll('.host-now-requester-text').forEach(el => {
                    el.innerHTML = `<i class="fa-solid fa-user text-gray-600 text-[10px]"></i> ${currentSong.requester || ""}`;
                });
            } else {
                document.querySelectorAll('.host-now-playing-text').forEach(el => el.textContent = "STOPPED");
                document.querySelectorAll('.host-now-requester-text').forEach(el => el.textContent = "---");
            }

            document.querySelectorAll('.btn-host-play').forEach(btn => {
                if (player && typeof player.getPlayerState === 'function') {
                    const isPlaying = player.getPlayerState() === 1;
                    btn.innerHTML = isPlaying ? `<i class="fa-solid fa-pause text-sm"></i>` : `<i class="fa-solid fa-play text-sm ml-0.5"></i>`;
                }
            });

            const qList = document.getElementById('host-queue-list');
            const qBadge = document.getElementById('queue-badge');
            if(qList) {
                qList.innerHTML = '';
                if(qBadge) qBadge.textContent = queue.length;
                queue.forEach((q, idx) => {
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between bg-[#18181b] p-2 rounded-sm border border-gray-800 text-[10px] mb-1.5 shadow-sm";
                    div.innerHTML = `
                        <div class="flex items-center gap-2 overflow-hidden">
                            <span class="text-gray-600 font-black w-4 text-center">${idx+1}</span>
                            <div class="truncate">
                                <p class="text-gray-300 truncate font-bold">${q.title}</p>
                                <p class="text-[9px] text-gray-500 truncate mt-0.5"><i class="fa-solid fa-user"></i> ${q.requesterReal || q.requester}</p>
                            </div>
                        </div>
                        <button onclick="removeQueue('${q.id}')" class="text-gray-600 hover:text-red-500 px-2 flex-shrink-0 transition-colors"><i class="fa-solid fa-xmark"></i></button>
                    `;
                    qList.appendChild(div);
                });
            }
        }

        function renderChatList(containerId, chats) {
            const container = document.getElementById(containerId);
            if(!container) return;
            container.innerHTML = '';
            chats.forEach(c => {
                const div = document.createElement('div');
                div.className = "text-[11px] bg-[#18181b] border border-gray-800 p-2 rounded-sm mb-1 flex justify-between group shadow-sm";
                div.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <span class="text-[9px] text-gray-500 font-bold block truncate mb-0.5">${c.senderReal}</span>
                        <p class="text-gray-300 break-all">${c.text}</p>
                    </div>
                `;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function triggerTTS(chatObj) {
            let ttsOn = false;
            const toggle = document.getElementById('host-tts-toggle');
            if(toggle) ttsOn = toggle.checked;
            if(!ttsOn) return;
            let name = chatObj.isAnon ? '184(匿名)' : chatObj.senderReal;
            const text = `${name}さんから、${chatObj.text}`;
            const ut = new SpeechSynthesisUtterance(text);
            ut.lang = 'ja-JP';
            window.speechSynthesis.speak(ut);
        }

        function toggleLightMode() {
            isLightMode = !isLightMode;
            const container = document.getElementById('youtube-player-container');
            const btn = document.getElementById('btn-light-mode');
            if(isLightMode) {
                container.classList.add('youtube-hidden');
                btn.innerHTML = '<i class="fa-solid fa-ban text-red-500"></i> 映像OFF';
            } else {
                container.classList.remove('youtube-hidden');
                btn.innerHTML = '<i class="fa-solid fa-video"></i> 映像ON';
            }
        }
