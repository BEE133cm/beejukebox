        function showToast(msg, type="info") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerHTML = msg;
            toast.className = `toast bg-[#18181b] border-l-4 border-indigo-500 text-gray-200 p-3 rounded-sm shadow-xl flex items-center gap-3 text-xs font-bold`;
            if (type === 'error') toast.classList.replace('border-indigo-500', 'border-red-500');
            else toast.classList.replace('border-red-500', 'border-indigo-500');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        let hostNewsTimeout = null;
        function showHostNews(msg) {
            const ticker = document.getElementById('host-news-ticker');
            if(ticker) {
                ticker.innerHTML = msg;
                ticker.style.opacity = '1';
                if(hostNewsTimeout) clearTimeout(hostNewsTimeout);
                hostNewsTimeout = setTimeout(() => {
                    ticker.style.opacity = '0';
                }, 5000);
            }
        }

        function generateId() { return Math.random().toString(36).substring(2, 9); }

        function generateHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash = hash & hash; 
            }
            return Math.abs(hash).toString(36);
        }

        function createRoom() {
            try {
                const idInput = document.getElementById('input-room-id').value.trim();
                const nameInput = document.getElementById('input-host-name').value.trim();
                const passInput = document.getElementById('input-host-password').value.trim(); 
                if(!idInput) { showToast("ルームIDを入力してください", "error"); return; }
                
                let baseId = idInput.replace(/[^a-zA-Z0-9-]/g, '');
                if(!baseId) { showToast("ルームIDは半角英数字で入力してください", "error"); return; }
                
                hostName = nameInput || "配信太郎";
                hostPassword = passInput; 
                
                if (hostPassword) {
                    currentRoomId = baseId + '-' + generateHash(hostPassword);
                } else {
                    currentRoomId = baseId;
                }
                
                const settingNameEl = document.getElementById('setting-host-name');
                if(settingNameEl) settingNameEl.value = hostName;
                
                generateURLs();
                updateMyListSelect();
                saveHostHistory(baseId, hostName, hostPassword); 
                initHost();
            } catch (err) {
                showToast("エラーが発生しました: " + err.message, "error");
            }
        }

        function generateURLs() {
            const base = window.location.href.split('?')[0].split('#')[0];
            const baseUrlPath = base.substring(0, base.lastIndexOf('/') + 1);

            const elListener = document.getElementById('url-listener');
            if(elListener) elListener.value = `${baseUrlPath}listener.html?host=${currentRoomId}`;

            const elRemote = document.getElementById('url-remote');
            if(elRemote) elRemote.value = `${baseUrlPath}controller.html`;

            const elCamera = document.getElementById('url-camera');
            if(elCamera) elCamera.value = `${baseUrlPath}camera.html`;

            const elObsCam = document.getElementById('url-obs-cam');
            if(elObsCam) elObsCam.value = `${baseUrlPath}OBS.html?obs_cam=${currentRoomId}`;

            const elObs = document.getElementById('url-obs');
            if(elObs) elObs.value = `${baseUrlPath}OBS.html?obs=${currentRoomId}`;
        }

        function copyURL(inputId) {
            document.getElementById(inputId).select();
            document.execCommand("copy");
            showToast("URLをコピーしました！");
        }

        function renderHostHistory() {
            const list = document.getElementById('setup-history-list');
            if(!list) return;
            const history = JSON.parse(localStorage.getItem('jukebox_host_history')) || [];
            
            if(history.length === 0) {
                list.innerHTML = '<p class="text-gray-600 text-center text-xs py-4 font-bold">過去の作成履歴はありません</p>';
                return;
            }

            list.innerHTML = '';
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'bg-[#0e0e10] p-2.5 rounded-sm flex justify-between items-center cursor-pointer hover:bg-gray-800 transition border border-gray-800 hover:border-indigo-500/50 mb-1.5 shadow-inner group';
                div.innerHTML = `
                    <div class="flex-1 min-w-0" onclick="joinFromHostHistory('${item.roomId}', '${item.hostName}', '${item.password || ''}')">
                        <div class="font-bold text-gray-200 text-xs truncate group-hover:text-indigo-400 transition-colors">${item.hostName} の部屋</div>
                        <div class="text-[9px] text-gray-500 font-mono mt-0.5 tracking-wider">ID: ${item.roomId}</div>
                    </div>
                    <button class="text-gray-600 hover:text-red-400 px-2 transition-colors" onclick="deleteHostHistory('${item.roomId}', event)"><i class="fa-solid fa-trash-can"></i></button>
                `;
                list.appendChild(div);
            });
        }

        function saveHostHistory(roomId, hostName, password) {
            if(!roomId) return;
            let history = JSON.parse(localStorage.getItem('jukebox_host_history')) || [];
            history = history.filter(h => h.roomId !== roomId);
            history.unshift({ roomId: roomId, hostName: hostName || roomId, password: password || '', time: Date.now() });
            if(history.length > 10) history = history.slice(0, 10);
            localStorage.setItem('jukebox_host_history', JSON.stringify(history));
        }

        function deleteHostHistory(roomId, event) {
            event.stopPropagation();
            let history = JSON.parse(localStorage.getItem('jukebox_host_history')) || [];
            history = history.filter(h => h.roomId !== roomId);
            localStorage.setItem('jukebox_host_history', JSON.stringify(history));
            renderHostHistory();
            showToast("履歴を削除しました");
        }

        function joinFromHostHistory(roomId, hostName, password) {
            document.getElementById('input-room-id').value = roomId;
            document.getElementById('input-host-name').value = hostName;
            document.getElementById('input-host-password').value = password || '';
            createRoom();
        }

        function initHost() {
            showView('host-view');
            document.getElementById('display-room-id').textContent = currentRoomId;
            generateURLs();

            const url = new URL(window.location);
            url.searchParams.set('setup_host', currentRoomId);
            history.replaceState(null, '', url);

            peer = new Peer(`jukebox-${currentRoomId}`);

            peer.on('open', (id) => {
                document.getElementById('status-dot').classList.replace('bg-yellow-500', 'bg-green-500');
                document.getElementById('status-dot').classList.replace('shadow-[0_0_5px_rgba(234,179,8,0.8)]', 'shadow-[0_0_5px_rgba(34,197,94,0.8)]');
                document.getElementById('status-text').textContent = "ONLINE / WAITING";
                document.getElementById('error-text').classList.add('hidden');
                loadHostState(); 
                loadYouTubeAPI(); 
                
                setInterval(() => {
                    if (player && typeof player.getCurrentTime === 'function' && typeof player.getPlayerState === 'function') {
                        let actualVideoId = currentSong ? currentSong.videoId : null;
                        try {
                            const vData = player.getVideoData();
                            if(vData && vData.video_id) actualVideoId = vData.video_id;
                        } catch(e) {}

                        const syncData = {
                            type: 'sync_playback',
                            videoId: actualVideoId,
                            time: player.getCurrentTime(),
                            status: player.getPlayerState()
                        };
                        Object.values(connectedListeners).forEach(p => {
                            if(p.conn.open) p.conn.send(syncData);
                        });
                    }
                }, 1000);

                setInterval(() => {
                    const now = Date.now();
                    Object.values(connectedListeners).forEach(p => {
                        if (p.conn.open) {
                            if (!p.lastPongReceived) p.lastPongReceived = now;
                            if (now - p.lastPongReceived > 30000) {
                                p.conn.close();
                                delete connectedListeners[p.id];
                                updateParticipantsUI();
                                broadcastState();
                            } else {
                                p.conn.send({ type: 'ping' });
                            }
                        } else {
                            delete connectedListeners[p.id];
                            updateParticipantsUI();
                            broadcastState();
                        }
                    });
                }, 10000);
            });

            peer.on('error', (err) => {
                document.getElementById('status-dot').classList.replace('bg-green-500', 'bg-red-500');
                document.getElementById('status-dot').classList.replace('shadow-[0_0_5px_rgba(34,197,94,0.8)]', 'shadow-[0_0_5px_rgba(239,68,68,0.8)]');
                document.getElementById('status-text').textContent = "ERROR";
                const errTxt = document.getElementById('error-text');
                errTxt.textContent = err.type;
                errTxt.classList.remove('hidden');
            });

            peer.on('connection', (conn) => {
                if(bannedUsers[conn.peer]) {
                    conn.on('open', () => { conn.send({type: 'banned'}); conn.close(); });
                    return;
                }
                
                conn.isAuthenticated = false;

                connectedListeners[conn.peer] = {
                    id: conn.peer, conn: conn, name: "名無し", isMuted: false, cameraStatus: 'none', isRemote: false, isObs: false, call: null, hasAnnounced: false, lastPongReceived: Date.now(), isCam: conn.peer.startsWith('cam-')
                };
                updateParticipantsUI();

                conn.on('open', () => { 
                    conn.send({
                        type: 'state',
                        status: player ? (player.getPlayerState && player.getPlayerState() === 1 ? 'playing' : 'paused') : 'paused',
                        videoId: currentSong ? currentSong.videoId : null,
                        hostName: hostName,
                        requirePassword: !!hostPassword 
                    });
                    broadcastState(); 
                });
                
                conn.on('data', (data) => { 
                    if (hostPassword) {
                        if (data.type === 'auth_request') {
                            if (data.password === hostPassword) {
                                conn.isAuthenticated = true;
                                conn.send({ type: 'auth_response', success: true });
                                broadcastState();
                            } else {
                                conn.send({ type: 'auth_response', success: false });
                            }
                            return;
                        }

                        if (data.uuid) {
                            const isBannedUUID = Object.values(bannedUsers).some(u => u.uuid === data.uuid);
                            if (isBannedUUID) {
                                conn.send({type: 'banned'});
                                conn.close();
                                return;
                            }
                        }

                        const isRemoteOrCam = data.isRemote || conn.peer.startsWith('cam-');
                        if (isRemoteOrCam && !conn.isAuthenticated) {
                            conn.send({ type: 'auth_required' }); 
                            return;
                        }
                    } else {
                        conn.isAuthenticated = true;
                    }

                    if (data.type === 'pong') {
                        if (connectedListeners[conn.peer]) {
                            connectedListeners[conn.peer].lastPongReceived = Date.now();
                        }
                        return;
                    }
                    
                    handleHostData(data, conn); 
                });
                
                conn.on('close', () => {
                    if(connectedListeners[conn.peer]) {
                        delete connectedListeners[conn.peer];
                        updateParticipantsUI();
                    }
                });
            });

            peer.on('call', (call) => {
                if(call.peer.startsWith('cam-')) {
                    hostMediaConn = call;
                    call.answer();
                    call.on('stream', (stream) => {
                        // Multi-view: Preview incoming stream
                        const previewVid = document.getElementById('host-stream-preview');
                        if (previewVid) {
                            previewVid.srcObject = stream;
                            previewVid.classList.remove('hidden');
                            document.getElementById('host-stream-offline').classList.add('hidden');
                            // Use mixer state to set initial mute
                            previewVid.muted = document.getElementById('icon-host-stream-mute').classList.contains('fa-volume-xmark');
                            previewVid.play().catch(e=>{});
                        }
                        
                        document.getElementById('dummy-audio').play().catch(e=>{});
                        broadcastStreamToListeners(stream);
                    });
                    call.on('close', () => {
                        stopBroadcastStream();
                        const previewVid = document.getElementById('host-stream-preview');
                        if(previewVid) {
                            previewVid.srcObject = null;
                            previewVid.classList.add('hidden');
                            document.getElementById('host-stream-offline').classList.remove('hidden');
                        }
                    });
                }
            });
        }

        async function fetchYouTubeTitle(videoId) {
            try {
                const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
                if(res.ok) {
                    const data = await res.json();
                    return data.title || "不明なタイトル";
                }
            } catch(e) {}
            return "不明なタイトル";
        }

        function handleHostData(data, conn) {
            const peerId = conn.peer;
            const listener = connectedListeners[peerId];

            if(bannedUsers[peerId]) return; 

            if(data.type === 'update_profile') {
                if(listener) {
                    let isReconnected = false;
                    let restoredCameraStatus = 'none';
                    let restoredIsMuted = false;

                    if (data.uuid) {
                        Object.values(connectedListeners).forEach(oldP => {
                            if (oldP.uuid === data.uuid && oldP.id !== peerId) {
                                isReconnected = true;
                                restoredCameraStatus = oldP.cameraStatus;
                                restoredIsMuted = oldP.isMuted;
                                oldP.conn.close();
                                delete connectedListeners[oldP.id];
                            }
                        });
                    }

                    const isNew = (listener.name === "名無し" || !listener.hasAnnounced) && data.name !== "名無し" && !data.isObs && !data.isRemote && !isReconnected && !listener.isCam;
                    listener.name = data.name;
                    listener.isRemote = data.isRemote || false;
                    listener.isObs = data.isObs || false;
                    listener.uuid = data.uuid; 
                    listener.lastPongReceived = Date.now();
                    
                    if (isReconnected) {
                        listener.cameraStatus = restoredCameraStatus;
                        listener.isMuted = restoredIsMuted;
                    }

                    if (listener.uuid && approvedUsers[listener.uuid]) {
                        listener.cameraStatus = 'approved';
                    }

                    if (listener.isObs || listener.isRemote) {
                        listener.cameraStatus = 'approved';
                        if (currentStreamToListeners && !listener.call) {
                            sendStreamToPeer(listener.id);
                        }
                    } else if (listener.cameraStatus === 'approved') {
                        if (currentStreamToListeners && !listener.call) {
                            sendStreamToPeer(listener.id);
                        }
                    }

                    if (isNew) {
                        listener.hasAnnounced = true;
                        showHostNews(`<i class="fa-solid fa-door-open text-gray-500"></i> <span class="text-white">${data.name}</span> <span class="text-gray-400">JOINED</span>`);
                        Object.values(connectedListeners).forEach(p => {
                            if (p.isRemote && p.conn.open) p.conn.send({type: 'remote_alert', msg: `<i class="fa-solid fa-door-open"></i> <b>${data.name}</b> が入室しました`});
                        });
                    } else if (isReconnected) {
                        listener.hasAnnounced = true;
                    }

                    updateParticipantsUI();
                }
            }
            else if(data.type === 'request') {
                if(listener && listener.isMuted) {
                    conn.send({type: 'error', msg: '現在リクエストが制限されています'});
                    return;
                }
                const song = {
                    id: generateId(), videoId: data.videoId, title: "取得中...", requester: data.requester, requesterReal: data.requesterReal, isAnon: data.isAnon, isRemote: data.isRemote || false
                };
                queue.push(song);
                showToast(`REQ: ${song.requester}`);
                showHostNews(`<i class="fa-solid fa-music text-indigo-400"></i> <span class="text-white">REQ:</span> ${data.requesterReal}`);
                
                Object.values(connectedListeners).forEach(p => {
                    if (p.isRemote && p.conn.open) p.conn.send({type: 'remote_alert', msg: `<i class="fa-solid fa-music"></i> リクエスト追加: <b>${data.requesterReal}</b>`});
                });

                saveHostState();
                updateUI();
                
                fetchYouTubeTitle(song.videoId).then(title => {
                    const qItem = queue.find(q => q.id === song.id);
                    if(qItem) { qItem.title = title; saveHostState(); updateUI(); }
                });

                if(!currentSong || currentSong.isBGM) {
                    if(player && typeof player.getPlayerState === 'function') playNext();
                }
            }
            else if(data.type === 'cancel') {
                queue = queue.filter(q => q.id !== data.id);
                saveHostState();
                updateUI();
            }
            else if(data.type === 'remote_cmd') {
                if(data.cmd === 'toggle') togglePlayHost();
                else if(data.cmd === 'skip') playNext(true); 
                else if(data.cmd === 'manage') {
                    if (data.action === 'cancel_req') removeQueue(data.targetId);
                    else if (data.action === 'toggle_cam_approval') {
                        const el = document.getElementById('setting-cam-approval');
                        if (el) el.checked = data.targetId;
                        toggleCamApproval();
                    }
                    else manageUser(data.targetId, data.action);
                }
            }
            else if(data.type === 'update_theme') {
                hostTheme = data.theme;
                const themeInput = document.getElementById('setting-theme');
                if(themeInput) themeInput.value = hostTheme;
                saveHostState();
                broadcastState();
                showToast("THEME UPDATED");
            }
            else if(data.type === 'request_camera') {
                if(listener) {
                    if(cameraApprovalMode && !listener.isRemote && !listener.isObs) {
                        listener.cameraStatus = 'requested';
                        updateParticipantsUI();
                        showHostNews(`<i class="fa-solid fa-bell text-yellow-400"></i> ${listener.name} がStream視聴承認待ちです`);
                        Object.values(connectedListeners).forEach(p => {
                            if(p.isRemote && p.conn.open) p.conn.send({type: 'camera_request_alert', id: listener.id, name: listener.name});
                        });
                    } else {
                        listener.cameraStatus = 'approved';
                        if(currentStreamToListeners && !listener.call) sendStreamToPeer(peerId);
                    }
                }
            }
            else if(data.type === 'camera_stop') {
                if(hostMediaConn) hostMediaConn.close();
                stopBroadcastStream();
            }
            else if(data.type === 'chat') {
                const newChat = {
                    id: generateId(), text: data.text, sender: data.sender, senderReal: data.senderReal, isAnon: data.isAnon, isRemote: data.isRemote, time: Date.now()
                };
                
                if(!chatHistory.some(c => c.id === newChat.id)) {
                    chatHistory.push(newChat);
                    if(chatHistory.length > 100) chatHistory.shift();
                    saveHostState();
                    updateUI(); 
                    showHostNews(`<i class="fa-solid fa-comment-dots text-gray-500"></i> <span class="text-indigo-300">${newChat.senderReal}</span>: ${newChat.text}`);
                    
                    Object.values(connectedListeners).forEach(p => {
                        if(p.conn.open) p.conn.send({type: 'new_chat', chat: newChat});
                    });
                    triggerTTS(newChat);
                }
            }
            else if(data.type === 'delete_chat') {
                deleteChat(data.id);
            }
        }

        function sendHostRequest(mode = 'pc') {
            const inputId = mode === 'mobile' ? 'host-request-url-mobile' : 'host-request-url-pc';
            const url = document.getElementById(inputId).value;
            if(!url) return;
            const vid = extractVideoId(url);
            if(vid) {
                const song = {
                    id: generateId(), videoId: vid, title: "取得中...", requester: "👑 " + hostName, requesterReal: hostName, isAnon: false, isRemote: true
                };
                queue.push(song);
                showToast(`リクエストを追加しました`);
                saveHostState();
                updateUI();
                
                fetchYouTubeTitle(song.videoId).then(title => {
                    const qItem = queue.find(q => q.id === song.id);
                    if(qItem) { qItem.title = title; saveHostState(); updateUI(); }
                });
                
                if(!currentSong || currentSong.isBGM) {
                    if(player && typeof player.getPlayerState === 'function') playNext();
                }
                document.getElementById(inputId).value = '';
            } else {
                showToast("無効なYouTube URLです", "error");
            }
        }

        function toggleCamApproval() {
            cameraApprovalMode = document.getElementById('setting-cam-approval').checked;
            if(!cameraApprovalMode) {
                Object.values(connectedListeners).forEach(p => {
                    if(!p.isRemote && !p.isObs) {
                        p.cameraStatus = 'approved';
                        if(currentStreamToListeners && !p.call) sendStreamToPeer(p.id);
                    }
                });
            } else {
                Object.values(connectedListeners).forEach(p => {
                    if(!p.isObs && !p.isRemote && p.cameraStatus !== 'approved') {
                        p.cameraStatus = 'none';
                    }
                });
            }
            broadcastState();
            updateParticipantsUI();
        }

        function manageUser(peerId, action) {
            const p = connectedListeners[peerId];
            if(action === 'unban') {
                delete bannedUsers[peerId];
                saveHostState();
                updateParticipantsUI();
                showToast("UNBANNED");
                return;
            }

            if(!p) return;
            if(action === 'approve_cam') {
                p.cameraStatus = 'approved';
                if(p.uuid) {
                    approvedUsers[p.uuid] = true;
                    saveHostState();
                }
                if(currentStreamToListeners && !p.call) sendStreamToPeer(peerId);
                showToast(`${p.name}: CAM APPROVED`);
            } else if(action === 'reject_cam') {
                p.cameraStatus = 'none';
                if(p.uuid) {
                    delete approvedUsers[p.uuid];
                    saveHostState();
                }
                showToast(`${p.name}: CAM REJECTED`);
            } else if(action === 'mute') {
                p.isMuted = !p.isMuted;
                showToast(`${p.name}: MUTE ${p.isMuted ? 'ON' : 'OFF'}`);
            } else if(action === 'ban') {
                bannedUsers[peerId] = { name: p.name, time: Date.now(), uuid: p.uuid }; 
                if(p.uuid) delete approvedUsers[p.uuid];
                saveHostState();
                if(p.call) p.call.close();
                p.conn.send({type: 'banned'});
                p.conn.close();
                delete connectedListeners[peerId];
                showToast(`BANNED`, 'error');
            }
            updateParticipantsUI();
            broadcastState(); 
        }

        function updateParticipantsUI() {
            const hList = document.getElementById('host-participant-list');
            if(hList) renderParticipantList(hList);
            const countEl = document.getElementById('host-participant-count');
            
            let validParticipantCount = 0;
            Object.values(connectedListeners).forEach(p => { if(!p.isObs && !p.isCam) validParticipantCount++; });
            if (countEl) countEl.textContent = `(${validParticipantCount})`;
        }

        function renderParticipantList(container) {
            if(!container) return;
            container.innerHTML = '';
            const list = Object.values(connectedListeners);

            list.forEach(p => {
                if(p.isObs || p.isCam) return; 
                const div = document.createElement('div');
                div.className = "flex items-center justify-between bg-[#18181b] border border-gray-800 p-2 rounded-sm text-[10px] mb-1";
                
                let nameLabel = p.name;
                if(p.isRemote) nameLabel += ' <span class="text-[9px] text-yellow-500 ml-1 font-bold">ADMIN</span>';
                if(p.isMuted) nameLabel += ' <span class="text-[9px] text-red-500 ml-1 font-bold">MUTED</span>';

                let controls = '';
                if(!p.isRemote) {
                    if(cameraApprovalMode) {
                        if(p.cameraStatus === 'requested') {
                            controls += `<button onclick="manageUser('${p.id}', 'approve_cam')" class="bg-yellow-600 hover:bg-yellow-500 text-white px-2 py-1 rounded-sm mr-1"><i class="fa-solid fa-check"></i></button>`;
                            controls += `<button onclick="manageUser('${p.id}', 'reject_cam')" class="bg-gray-700 hover:bg-gray-600 border border-gray-600 text-white px-2 py-1 rounded-sm mr-2"><i class="fa-solid fa-xmark"></i></button>`;
                        } else if(p.cameraStatus === 'approved') {
                            controls += `<span class="text-[9px] text-green-500 mr-2 font-bold tracking-widest">CAM:OK</span>`;
                        }
                    }
                    controls += `<button onclick="manageUser('${p.id}', 'mute')" class="${p.isMuted ? 'bg-gray-700 text-gray-400' : 'bg-orange-600 text-white'} px-2 py-1 rounded-sm mr-1 transition-colors" title="リクエスト禁止"><i class="fa-solid fa-volume-xmark"></i></button>`;
                    controls += `<button onclick="manageUser('${p.id}', 'ban')" class="bg-red-700 hover:bg-red-600 text-white px-2 py-1 rounded-sm transition-colors" title="BAN"><i class="fa-solid fa-ban"></i></button>`;
                }

                div.innerHTML = `<div class="truncate flex-1 font-bold text-gray-300">${nameLabel}</div><div class="flex-shrink-0 flex items-center">${controls}</div>`;
                container.appendChild(div);
            });

            if(Object.keys(bannedUsers).length > 0) {
                const banHeader = document.createElement('div');
                banHeader.className = "text-[9px] font-black text-red-500 mt-3 mb-1 border-b border-gray-800 pb-1 tracking-widest";
                banHeader.innerHTML = `BANNED USERS`;
                container.appendChild(banHeader);

                Object.entries(bannedUsers).forEach(([id, info]) => {
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between bg-red-950/20 border border-red-900/30 p-2 rounded-sm text-[10px] mb-1";
                    div.innerHTML = `
                        <div class="truncate flex-1"><span class="text-gray-500 line-through">${info.name}</span></div>
                        <button onclick="manageUser('${id}', 'unban')" class="text-[9px] bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 px-2 py-1 rounded-sm font-bold">解除</button>
                    `;
                    container.appendChild(div);
                });
            }
        }

        function updateHostSettings() {
            hostName = document.getElementById('setting-host-name').value || "配信太郎";
            hostTheme = document.getElementById('setting-theme').value;
            durationLimit = parseInt(document.getElementById('setting-duration').value) * 60;
            if(isNaN(durationLimit)) durationLimit = 0;
            saveHostState();
            broadcastState();
        }

        function broadcastState() {
            const safeParticipants = Object.values(connectedListeners).map(p => ({
                id: p.id, name: p.name, isMuted: p.isMuted, cameraStatus: p.cameraStatus, isRemote: p.isRemote, isObs: p.isObs, isCam: p.isCam
            }));

            let stateCurrentSong = currentSong ? { ...currentSong } : null;
            if (stateCurrentSong && player && typeof player.getVideoData === 'function') {
                try {
                    const vData = player.getVideoData();
                    if(vData && vData.video_id) {
                        stateCurrentSong.videoId = vData.video_id;
                    }
                } catch(e) {}
            }

            const state = {
                type: 'state', queue: queue, historyQueue: historyQueue, chatHistory: chatHistory, currentSong: stateCurrentSong,
                isPlaying: player && typeof player.getPlayerState === 'function' ? (player.getPlayerState() === 1) : false,
                hostTheme: hostTheme, isLive: !!currentStreamToListeners, cameraApprovalMode: cameraApprovalMode,
                participants: safeParticipants, bannedUsers: bannedUsers
            };
            Object.values(connectedListeners).forEach(p => { if(p.conn.open) p.conn.send(state); });
        }

        function loadYouTubeAPI() {
            if (window.YT && window.YT.Player) {
                if (document.getElementById('youtube-player')) {
                    initPlayer();
                }
            } else if (!document.getElementById('youtube-api-script')) {
                const tag = document.createElement('script');
                tag.id = 'youtube-api-script';
                tag.src = 'https://www.youtube.com/iframe_api';
                const firstScriptTag = document.getElementsByTagName('script')[0];
                firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
            }
        }
        
        window.onYouTubeIframeAPIReady = function() { 
            if (document.getElementById('youtube-player')) {
                initPlayer(); 
            }
        };

        function initPlayer() {
            if(player && typeof player.playVideo === 'function') return;
            if(!document.getElementById('youtube-player')) return; 
            player = new YT.Player('youtube-player', {
                height: '100%', width: '100%',
                playerVars: { autoplay: 1, controls: 1, rel: 0 },
                events: { 
                    'onReady': (event) => {
                        const vol = document.getElementById('host-jukebox-vol').value;
                        event.target.setVolume(vol);
                        onPlayerReady(event);
                    }, 
                    'onStateChange': onPlayerStateChange 
                }
            });
        }

        function onPlayerReady(event) {
            if(currentSong) {
                if (currentSong.listId) player.loadPlaylist({list: currentSong.listId, index: currentSong.playlistIndex || 0, startSeconds: currentSong.startSeconds || 0});
                else player.loadVideoById({videoId: currentSong.videoId, startSeconds: currentSong.startSeconds || 0});
            } else if (queue.length > 0 || bgmQueue.length > 0) playNext();
        }

        let durationCheckTimeout = null;

        function onPlayerStateChange(event) {
            updateUI(); 
            if (event.data === YT.PlayerState.PLAYING) {
                
                // ミキサーの音量を強制反映 (PCでの自動再生時リセット対策)
                const vol = document.getElementById('host-jukebox-vol').value;
                player.setVolume(vol);
                if (document.getElementById('icon-host-jukebox-mute').classList.contains('fa-volume-high')) {
                    player.unMute();
                } else {
                    player.mute();
                }

                if (currentSong && currentSong.isBGM && currentSong.listId && !currentSong._settingsApplied) {
                    currentSong._settingsApplied = true;
                    if (typeof player.setShuffle === 'function') {
                        player.setShuffle(document.getElementById('bgm-shuffle').checked);
                    }
                    if (typeof player.setLoop === 'function') {
                        player.setLoop(document.getElementById('bgm-loop').checked);
                    }
                }

                if(currentSong) {
                    try {
                        let videoData = player.getVideoData();
                        if(videoData && videoData.title && currentSong.title === "取得中...") {
                            currentSong.title = videoData.title;
                            updateUI();
                        }
                    } catch(e) {}
                }
                
                if(currentSong && !currentSong.isBGM && durationLimit > 0) {
                    if(durationCheckTimeout) clearTimeout(durationCheckTimeout);
                    durationCheckTimeout = setTimeout(() => {
                        const dur = player.getDuration();
                        if(dur > durationLimit) {
                            showToast(`曲が長すぎるためスキップしました(${Math.floor(dur/60)}分)`, "error");
                            playNext(true);
                        }
                    }, 1000); 
                }
            } 
            else if (event.data === YT.PlayerState.ENDED) {
                if (currentSong && currentSong.isBGM && document.getElementById('bgm-loop-one') && document.getElementById('bgm-loop-one').checked) {
                    player.seekTo(0);
                    player.playVideo();
                    return;
                }
                playNext();
            }
        }

        function togglePlayHost() {
            if(!player || !currentSong || typeof player.getPlayerState !== 'function') return;
            if(player.getPlayerState() === 1) player.pauseVideo();
            else player.playVideo();
        }

        function playNext(forceSkip = false) {
            if (!player || typeof player.loadVideoById !== 'function') return;

            if (currentSong && !currentSong.isBGM) {
                historyQueue.unshift(currentSong);
                if (historyQueue.length > 20) historyQueue.pop();
            }

            if (currentSong && currentSong.isBGM && queue.length > 0 && !forceSkip) {
                bgmResumeData = {
                    videoId: currentSong.videoId, listId: currentSong.listId, title: currentSong.title,
                    time: player.getCurrentTime(), playlistIndex: player.getPlaylistIndex ? player.getPlaylistIndex() : 0
                };
            }

            if (queue.length > 0) {
                currentSong = queue.shift();
                player.loadVideoById({videoId: currentSong.videoId});
            } 
            else if (bgmResumeData) {
                currentSong = {
                    id: 'bgm-resumed', videoId: bgmResumeData.videoId, listId: bgmResumeData.listId,
                    title: bgmResumeData.title, requester: 'BGM RESUMED', isBGM: true,
                    startSeconds: bgmResumeData.time, playlistIndex: bgmResumeData.playlistIndex
                };
                if (currentSong.listId) player.loadPlaylist({list: currentSong.listId, index: bgmResumeData.playlistIndex, startSeconds: bgmResumeData.time});
                else player.loadVideoById({videoId: currentSong.videoId, startSeconds: bgmResumeData.time});
                bgmResumeData = null; 
            }
            else if (bgmQueue.length > 0) {
                let bgm;
                let shuffleOn = document.getElementById('bgm-shuffle') && document.getElementById('bgm-shuffle').checked;
                let loopOn = document.getElementById('bgm-loop') && document.getElementById('bgm-loop').checked;

                if (shuffleOn && bgmQueue.length > 1 && !bgmQueue[0].isPlaylist) {
                    let randomIndex = Math.floor(Math.random() * bgmQueue.length);
                    bgm = bgmQueue.splice(randomIndex, 1)[0];
                } else {
                    bgm = bgmQueue.shift();
                }

                if (loopOn) {
                    bgmQueue.push(bgm); 
                }
                
                if(bgm.isPlaylist) {
                    currentSong = { id: 'bgm-pl', videoId: '', listId: bgm.listId, title: '📁 プレイリスト', requester: 'BGM', isBGM: true };
                    player.loadPlaylist({list: bgm.listId});
                } else {
                    currentSong = { id: 'bgm-' + generateId(), videoId: bgm.videoId, listId: null, title: bgm.title || "取得中...", requester: 'BGM', isBGM: true };
                    player.loadVideoById({videoId: currentSong.videoId});
                }
            } else {
                currentSong = null;
                player.stopVideo();
            }
            saveHostState();
            updateUI();
        }

        function extractVideoId(url) {
            const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=))([^"&?\/\s]{11})/);
            return match ? match[1] : null;
        }

        function extractPlaylistId(url) {
            const match = url.match(/[?&]list=([^#\&\?]+)/);
            return match ? match[1] : null;
        }

        function addBGM() {
            const url = document.getElementById('input-bgm-url').value;
            if(!url) return;

            const listId = extractPlaylistId(url);
            if(listId) {
                bgmQueue.push({ isPlaylist: true, listId: listId, rawUrl: url, title: "📁 プレイリスト" });
                showToast("プレイリストを追加しました");
                updateAndSaveBGM();
            } else {
                const vid = extractVideoId(url);
                if(vid) {
                    const bgmItem = { isPlaylist: false, videoId: vid, rawUrl: url, title: "取得中..." };
                    bgmQueue.push(bgmItem);
                    showToast("BGMを追加しました");
                    updateAndSaveBGM();
                    
                    fetchYouTubeTitle(vid).then(title => {
                        const bItem = bgmQueue.find(b => b.videoId === vid);
                        if(bItem) { bItem.title = title; updateAndSaveBGM(); }
                    });
                } else showToast("無効なURLです", "error");
            }
            document.getElementById('input-bgm-url').value = '';
        }

        function updateAndSaveBGM() {
            saveHostState();
            updateUI();
            if(!currentSong && player && typeof player.getPlayerState === 'function') playNext();
        }

        function updateBGMPlaybackSettings() {
            saveHostState();
            if (player && typeof player.setShuffle === 'function' && currentSong && currentSong.isBGM && currentSong.listId) {
                player.setShuffle(document.getElementById('bgm-shuffle').checked);
                player.setLoop(document.getElementById('bgm-loop').checked);
            }
        }

        function toggleLightMode() {
            isLightMode = !isLightMode;
            const container = document.getElementById('youtube-player-container');
            const btn = document.getElementById('btn-light-mode');
            if(isLightMode) {
                container.classList.add('youtube-hidden');
                btn.innerHTML = '<i class="fa-solid fa-ban text-red-500"></i> 映像OFF';
            } else {
                container.classList.remove('youtube-hidden');
                btn.innerHTML = '<i class="fa-solid fa-video"></i> 映像ON';
            }
        }

        function updateUI() {
            if(currentSong) {
                document.querySelectorAll('.host-now-playing-text').forEach(el => el.textContent = currentSong.title);
                document.querySelectorAll('.host-now-requester-text').forEach(el => {
                    el.innerHTML = `<i class="fa-solid fa-user text-gray-600 text-[10px]"></i> ${currentSong.requester || ""}`;
                });
                document.querySelectorAll('.marquee-content').forEach(el => { el.style.animation = 'none'; el.offsetHeight; el.style.animation = null; });
            } else {
                document.querySelectorAll('.host-now-playing-text').forEach(el => el.textContent = "STOPPED");
                document.querySelectorAll('.host-now-requester-text').forEach(el => el.textContent = "---");
            }

            document.querySelectorAll('.btn-host-play').forEach(btn => {
                if (player && typeof player.getPlayerState === 'function') {
                    const isPlaying = player.getPlayerState() === 1;
                    btn.innerHTML = isPlaying 
                        ? `<i class="fa-solid fa-pause text-sm"></i>` 
                        : `<i class="fa-solid fa-play text-sm ml-0.5"></i>`;
                }
            });

            const qList = document.getElementById('host-queue-list');
            const qBadge = document.getElementById('queue-badge');
            if(qList) {
                qList.innerHTML = '';
                if(qBadge) qBadge.textContent = queue.length;
                
                queue.forEach((q, idx) => {
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between bg-[#18181b] p-2 rounded-sm border border-gray-800 text-[10px] mb-1.5 shadow-sm";
                    div.innerHTML = `
                        <div class="flex items-center gap-2 overflow-hidden">
                            <span class="text-gray-600 font-black w-4 text-center">${idx+1}</span>
                            <div class="truncate">
                                <p class="text-gray-300 truncate font-bold">${q.title}</p>
                                <p class="text-[9px] text-gray-500 truncate mt-0.5"><i class="fa-solid fa-user"></i> ${q.requesterReal || q.requester} ${q.isRemote ? '<span class="text-yellow-600 ml-1 font-bold">ADMIN</span>' : ''}</p>
                            </div>
                        </div>
                        <button onclick="removeQueue('${q.id}')" class="text-gray-600 hover:text-red-500 px-2 flex-shrink-0 transition-colors"><i class="fa-solid fa-xmark"></i></button>
                    `;
                    qList.appendChild(div);
                });
            }

            const hostHist = document.getElementById('host-history-list');
            if(hostHist) {
                hostHist.innerHTML = '';
                historyQueue.forEach((q, idx) => {
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between bg-[#18181b] border border-gray-800 p-2 rounded-sm text-[10px] mb-1.5";
                    div.innerHTML = `
                        <div class="flex items-center gap-2 overflow-hidden flex-1">
                            <span class="text-gray-700 font-black w-4 text-center">${idx+1}</span>
                            <div class="truncate">
                                <p class="text-gray-400 truncate font-medium">${q.title}</p>
                                <p class="text-[9px] text-gray-600 truncate"><i class="fa-solid fa-user"></i> ${q.requesterReal}</p>
                            </div>
                        </div>
                        <button onclick="reRequestHost('${q.videoId}', '${q.requesterReal}')" class="text-[9px] bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 px-2 py-1 rounded-sm flex-shrink-0 transition-colors font-bold">RE-REQ</button>
                    `;
                    hostHist.appendChild(div);
                });
            }

            const bList = document.getElementById('host-bgm-list');
            if(bList) {
                bList.innerHTML = '';
                bgmQueue.forEach((b, idx) => {
                    const div = document.createElement('div');
                    div.className = "flex justify-between bg-[#0e0e10] border border-gray-800 p-2 rounded-sm items-center mb-1";
                    div.innerHTML = `
                        <span class="text-gray-400 truncate text-[10px] flex-1 font-medium">${b.title || '取得中...'}</span>
                        <button onclick="removeBGM(${idx})" class="text-gray-600 hover:text-red-500 px-2 transition-colors"><i class="fa-solid fa-xmark"></i></button>
                    `;
                    bList.appendChild(div);
                });
            }

            renderChatList('host-chat-list', chatHistory);
            broadcastState();
        }

        function reRequestHost(videoId, reqName) {
            queue.push({ id: generateId(), videoId: videoId, title: "取得中...", requester: reqName, requesterReal: reqName, isAnon: false });
            showToast("再リクエストしました");
            updateUI();
            
            fetchYouTubeTitle(videoId).then(title => {
                const qItem = queue[queue.length - 1];
                if(qItem && qItem.videoId === videoId) { qItem.title = title; updateUI(); }
            });
            if(!currentSong || currentSong.isBGM) playNext();
        }

        function removeQueue(id) { queue = queue.filter(q => q.id !== id); saveHostState(); updateUI(); }
        function removeBGM(idx) { bgmQueue.splice(idx, 1); saveHostState(); updateUI(); }

        function saveHostState() {
            const bgmSettings = {
                shuffle: document.getElementById('bgm-shuffle') ? document.getElementById('bgm-shuffle').checked : false,
                loop: document.getElementById('bgm-loop') ? document.getElementById('bgm-loop').checked : true,
                loopOne: document.getElementById('bgm-loop-one') ? document.getElementById('bgm-loop-one').checked : false
            };
            const data = { queue, bgmQueue, historyQueue, chatHistory, currentSong, bgmResumeData, hostName, hostTheme, durationLimit, cameraApprovalMode, bannedUsers, bgmSettings, approvedUsers };
            localStorage.setItem('jukebox_state_' + currentRoomId, JSON.stringify(data));
        }

        function loadHostState() {
            try {
                const saved = localStorage.getItem('jukebox_state_' + currentRoomId);
                if(saved) {
                    const data = JSON.parse(saved);
                    queue = Array.isArray(data.queue) ? data.queue : [];
                    bgmQueue = Array.isArray(data.bgmQueue) ? data.bgmQueue : [];
                    historyQueue = Array.isArray(data.historyQueue) ? data.historyQueue : [];
                    chatHistory = Array.isArray(data.chatHistory) ? data.chatHistory : [];
                    currentSong = data.currentSong || null;
                    bgmResumeData = data.bgmResumeData || null;
                    cameraApprovalMode = !!data.cameraApprovalMode;
                    bannedUsers = data.bannedUsers || {};
                    approvedUsers = data.approvedUsers || {};
                    
                    const camAppEl = document.getElementById('setting-cam-approval');
                    if(camAppEl) camAppEl.checked = cameraApprovalMode;
                    
                    if(data.hostName) { hostName = data.hostName; document.getElementById('setting-host-name').value = hostName; }
                    if(data.hostTheme) { hostTheme = data.hostTheme; document.getElementById('setting-theme').value = hostTheme; }
                    if(data.durationLimit !== undefined) { durationLimit = data.durationLimit; document.getElementById('setting-duration').value = durationLimit / 60; }
                    
                    if(data.bgmSettings) {
                        if(document.getElementById('bgm-shuffle')) document.getElementById('bgm-shuffle').checked = data.bgmSettings.shuffle;
                        if(document.getElementById('bgm-loop')) document.getElementById('bgm-loop').checked = data.bgmSettings.loop;
                        if(document.getElementById('bgm-loop-one')) document.getElementById('bgm-loop-one').checked = data.bgmSettings.loopOne;
                    }

                    updateUI();
                }
            } catch(e) { console.warn("Failed to load host state", e); }
        }

        function saveToMyList() {
            const url = document.getElementById('input-bgm-url').value;
            if(!url) return showToast("URLを入力してください", "error");
            const name = prompt("このURLをマイリストに保存します。\n名前を付けてください:", "お気に入りBGM");
            if(name) {
                myList.push({ name: name, url: url });
                try {
                    localStorage.setItem('jukebox_mylist', JSON.stringify(myList));
                    updateMyListSelect();
                    showToast("マイリストに保存しました");
                } catch(e) { showToast("保存に失敗しました", "error"); }
            }
        }

        function updateMyListSelect() {
            const sel = document.getElementById('select-mylist');
            if(!sel) return;
            sel.innerHTML = '<option value="">-- SELECT --</option>';
            myList.forEach((item, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = item.name;
                sel.appendChild(opt);
            });
        }

        function loadFromMyList() {
            const sel = document.getElementById('select-mylist');
            if(sel.value === "") return;
            document.getElementById('input-bgm-url').value = myList[sel.value].url;
            addBGM();
            sel.value = ""; 
        }

        function applyBitrate(call, bitrateKbps) {
            if(!call || !call.peerConnection) return;
            const senders = call.peerConnection.getSenders();
            const videoSender = senders.find(s => s.track && s.track.kind === 'video');
            if (videoSender) {
                const params = videoSender.getParameters();
                if (!params.encodings) params.encodings = [{}];
                params.encodings[0].maxBitrate = bitrateKbps * 1000;
                videoSender.setParameters(params).catch(e => console.log("Bitrate error:", e));
            }
        }

        function sendStreamToPeer(peerId) {
            if(!currentStreamToListeners) return;
            const listener = connectedListeners[peerId];
            if(listener && listener.conn.open) {
                const call = peer.call(peerId, currentStreamToListeners);
                listener.call = call;
                setTimeout(() => applyBitrate(call, 2500), 1000); 
            }
        }

        function broadcastStreamToListeners(stream) {
            currentStreamToListeners = stream;
            Object.values(connectedListeners).forEach(listener => {
                if(!cameraApprovalMode || listener.cameraStatus === 'approved' || listener.isObs || listener.isRemote) {
                    sendStreamToPeer(listener.id);
                }
            });
            showToast("カメラ中継を開始しました", "info");
            broadcastState();
        }

        function stopBroadcastStream() {
            currentStreamToListeners = null;
            Object.values(connectedListeners).forEach(listener => {
                if(listener.call) { listener.call.close(); listener.call = null; }
            });
            showToast("カメラ中継が停止しました", "info");
            broadcastState(); 
        }

        function sendChatRequest() {
            const inputId = 'host-chat-input';
            const text = document.getElementById(inputId).value.trim();
            if(!text) return;

            const sender = `👑 ${hostName}`;
            const senderReal = hostName;
            
            handleHostData({type: 'chat', text: text, sender: sender, senderReal: senderReal, isAnon: false, isRemote: true}, {peer: 'host-self'});
            document.getElementById(inputId).value = '';
        }

        function deleteChat(id) {
            chatHistory = chatHistory.filter(c => c.id !== id);
            saveHostState();
            updateUI();
        }

        function renderChatList(containerId, chats) {
            const container = document.getElementById(containerId);
            if(!container) return;
            
            container.innerHTML = '';
            chats.forEach(c => {
                const div = document.createElement('div');
                div.className = "text-[11px] bg-[#18181b] border border-gray-800 p-2 rounded-sm mb-1 flex justify-between group shadow-sm";
                
                const dispName = c.isAnon ? '184(匿名)' : c.senderReal;
                const badge = c.isRemote ? '<span class="text-yellow-600 mr-1 font-bold">ADMIN</span>' : '';
                
                div.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <span class="text-[9px] text-gray-500 font-bold block truncate mb-0.5">${badge}${dispName}</span>
                        <p class="text-gray-300 break-all">${c.text}</p>
                    </div>
                `;
                const delBtn = document.createElement('button');
                delBtn.className = "text-gray-700 hover:text-red-500 opacity-0 group-hover:opacity-100 px-2 transition-all flex-shrink-0";
                delBtn.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
                delBtn.onclick = () => deleteChat(c.id);
                div.appendChild(delBtn);
                
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function triggerTTS(chatObj) {
            let ttsOn = false;
            const toggle = document.getElementById('host-tts-toggle');
            if(toggle) ttsOn = toggle.checked;
            
            if(!ttsOn) return;
            
            let name = chatObj.isAnon ? '184(匿名)' : chatObj.senderReal;
            const text = `${name}さんから、${chatObj.text}`;
            const ut = new SpeechSynthesisUtterance(text);
            ut.lang = 'ja-JP';
            window.speechSynthesis.speak(ut);
        }
    </script>
</body>
