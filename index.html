<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remote Jukebox - Host</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #111827; color: white; overscroll-behavior-y: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        .marquee-container { overflow: hidden; white-space: nowrap; position: relative; width: 100%; display: flex; }
        .marquee-content { 
            display: inline-block; 
            white-space: nowrap;
            padding-left: 100vw; 
            animation: marquee 15s linear infinite; 
        }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .toast {
            position: fixed; top: 20px; right: 20px; z-index: 9999;
            transform: translateX(150%); transition: transform 0.3s ease-in-out;
        }
        .toast.show { transform: translateX(0); }
        .youtube-hidden { position: absolute; width: 1px; height: 1px; top: -9999px; left: -9999px; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 12px); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center relative m-0 p-0 overflow-hidden">

    <!-- トースト通知 -->
    <div id="toast" class="toast bg-[#18181b] border-l-4 border-indigo-500 text-gray-200 p-3 rounded-sm shadow-xl flex items-center gap-3 text-xs font-bold">
        <span id="toast-msg"></span>
    </div>

    <!-- ================= 1. ルーム作成画面 (初期画面) ================= -->
    <div id="setup-view" class="w-full max-w-md bg-[#18181b] border border-gray-800 p-6 rounded shadow-2xl mt-10">
        <h1 class="text-xl font-bold text-center mb-2 text-white tracking-wider"><i class="fa-solid fa-sliders text-indigo-400"></i> REMOTE JUKEBOX</h1>
        <p class="text-gray-500 text-center text-xs mb-6 font-bold">配信者用管理コンソール</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1">ルームID (半角英数字)</label>
                <input type="text" id="input-room-id" placeholder="例: my-radio-123" class="w-full bg-[#0e0e10] text-white border border-gray-700 rounded-sm p-2 outline-none focus:border-indigo-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1">配信者の名前</label>
                <input type="text" id="input-host-name" placeholder="例: 配信太郎" class="w-full bg-[#0e0e10] text-white border border-gray-700 rounded-sm p-2 outline-none focus:border-indigo-500 text-sm">
            </div>
            <div class="border-t border-gray-800 pt-4 mt-2">
                <label class="block text-xs font-bold text-gray-400 mb-1"><i class="fa-solid fa-lock"></i> 管理パスワード (任意)</label>
                <input type="password" id="input-host-password" placeholder="例: 1234 (空欄ならパス不要)" class="w-full bg-[#0e0e10] text-white border border-gray-700 rounded-sm p-2 outline-none focus:border-indigo-500 text-sm">
            </div>
            <button onclick="createRoom()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-sm transition-colors mt-4 text-sm tracking-wider">
                ルームを作成 / 起動
            </button>
            
            <div class="border-t border-gray-800 pt-4 mt-6">
                <h3 class="text-xs font-bold text-gray-500 mb-3"><i class="fa-regular fa-clock"></i> RECENT ROOMS</h3>
                <div id="setup-history-list" class="flex flex-col gap-1.5 max-h-40 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <!-- ================= 2. 配信者 (Host) 画面 (The Tool UI) ================= -->
    <div id="host-view" class="hidden w-full h-[100dvh] flex-col bg-[#0e0e10] text-sm overflow-hidden">
        
        <!-- Header -->
        <div class="flex-shrink-0 bg-[#18181b] border-b border-gray-800 p-3 flex justify-between items-center z-20 shadow-md">
            <div class="flex-1 max-w-xl flex items-center gap-2">
                <i class="fa-solid fa-bullhorn text-indigo-400"></i>
                <input type="text" id="setting-theme" placeholder="テーマ・気分 (リスナーに表示)" class="flex-1 bg-[#09090b] border border-gray-700 text-white rounded-sm p-1.5 text-xs outline-none focus:border-indigo-500" onchange="updateHostSettings()">
            </div>
            <div id="connection-status" class="flex flex-col items-end gap-0.5 text-[10px] flex-shrink-0 ml-4">
                <div class="flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse shadow-[0_0_5px_rgba(234,179,8,0.8)]" id="status-dot"></span>
                    <span id="status-text" class="text-gray-300 font-bold tracking-widest">BOOTING...</span>
                </div>
                <span id="error-text" class="text-red-400 hidden"></span>
            </div>
        </div>

        <!-- ニュースティッカー (Header下) -->
        <div class="w-full h-0 relative flex justify-center z-50">
            <div id="host-news-ticker" class="absolute top-2 bg-[#18181b] text-indigo-300 font-bold text-xs px-4 py-1.5 rounded-sm border border-indigo-500/30 shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none max-w-md truncate"></div>
        </div>

        <div class="flex-1 flex flex-col lg:flex-row overflow-hidden">
            <!-- ========== LEFT PANEL: PREVIEW & CONTROLS ========== -->
            <div id="host-col-1" class="flex-col w-full lg:w-7/12 border-r border-gray-800 bg-black relative flex">
                
                <!-- NOW PLAYING & Toggles -->
                <div class="flex-shrink-0 bg-[#111827] border-b border-gray-800 p-2 flex justify-between items-center">
                    <div class="flex-1 min-w-0 flex items-center gap-2 mr-4">
                        <span class="text-red-500 font-bold text-[10px] border border-red-500 px-1 rounded-sm">NOW PLAYING</span>
                        <div class="truncate text-gray-200 text-xs font-bold" id="host-now-playing">再生待機中...</div>
                        <div class="truncate text-gray-500 text-[10px]" id="host-now-requester"></div>
                    </div>
                    <button onclick="toggleLightMode()" id="btn-light-mode" class="text-[10px] font-bold bg-gray-800 hover:bg-gray-700 text-white px-3 py-1.5 rounded-sm transition-colors border border-gray-700 flex-shrink-0">
                        <i class="fa-solid fa-video"></i> 映像ON
                    </button>
                </div>

                <!-- MULTI-VIEW MONITORS -->
                <div class="flex-1 flex bg-black min-h-[150px] lg:min-h-[250px] relative">
                    <!-- Jukebox Monitor -->
                    <div class="flex-1 flex flex-col border-r border-gray-800">
                        <div class="bg-[#18181b] text-[9px] text-gray-400 font-bold px-2 py-0.5 border-b border-gray-800 text-center tracking-widest">JUKEBOX (PGM)</div>
                        <div id="youtube-player-container" class="flex-1 relative bg-black shadow-inner">
                            <div id="youtube-player" class="w-full h-full"></div>
                        </div>
                    </div>
                    <!-- Stream Monitor (Hidden on Mobile) -->
                    <div class="hidden lg:flex flex-1 flex-col relative">
                        <div class="bg-[#18181b] text-[9px] text-gray-400 font-bold px-2 py-0.5 border-b border-gray-800 text-center tracking-widest">STREAM (CAM)</div>
                        <div class="flex-1 relative bg-[#09090b] flex items-center justify-center overflow-hidden shadow-inner">
                            <span id="host-stream-offline" class="text-gray-700 font-bold tracking-widest text-xs">NO SIGNAL</span>
                            <video id="host-stream-preview" autoplay playsinline muted class="hidden w-full h-full object-contain absolute inset-0 z-10"></video>
                        </div>
                    </div>
                </div>

                <!-- AUDIO MIXER & CONTROLS -->
                <div class="flex-shrink-0 bg-[#18181b] border-t border-gray-800 p-3 flex flex-col gap-3">
                    
                    <!-- Audio Mixer (Hidden on Mobile) -->
                    <div class="hidden lg:flex gap-6 border-b border-gray-800 pb-3">
                        <div class="flex-1 flex items-center gap-2">
                            <button onclick="toggleHostJukeboxMute()" class="text-gray-300 hover:text-white w-5 text-center"><i id="icon-host-jukebox-mute" class="fa-solid fa-volume-high"></i></button>
                            <span class="text-[9px] text-gray-500 font-bold w-12 tracking-wider">JUKEBOX</span>
                            <input type="range" id="host-jukebox-vol" min="0" max="100" value="100" class="flex-1 h-1.5 bg-gray-700 rounded-sm appearance-none cursor-pointer accent-indigo-500" oninput="changeHostJukeboxVol(this.value)">
                        </div>
                        <div class="flex-1 flex items-center gap-2">
                            <button onclick="toggleHostStreamMute()" class="text-gray-500 hover:text-white w-5 text-center"><i id="icon-host-stream-mute" class="fa-solid fa-volume-xmark"></i></button>
                            <span class="text-[9px] text-gray-500 font-bold w-12 tracking-wider">STREAM</span>
                            <input type="range" id="host-stream-vol" min="0" max="100" value="0" class="flex-1 h-1.5 bg-gray-700 rounded-sm appearance-none cursor-pointer accent-green-500" oninput="changeHostStreamVol(this.value)">
                        </div>
                    </div>
                    
                    <!-- Transport & Request -->
                    <div class="flex gap-2">
                        <button onclick="togglePlayHost()" id="btn-host-play" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-white w-10 h-9 rounded-sm transition-transform active:scale-95 flex items-center justify-center shadow-sm">
                            <i class="fa-solid fa-play text-xs"></i>
                        </button>
                        <button onclick="playNext(true)" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-white w-10 h-9 rounded-sm transition-transform active:scale-95 flex items-center justify-center shadow-sm">
                            <i class="fa-solid fa-forward-step text-xs"></i>
                        </button>
                        <div class="flex-1 flex gap-2">
                            <input type="text" id="host-request-url" placeholder="YouTube URLをリクエスト追加..." class="flex-1 bg-[#09090b] border border-gray-700 text-white rounded-sm px-2 text-xs outline-none focus:border-indigo-500">
                            <button onclick="sendHostRequest()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 rounded-sm text-xs font-bold transition-colors">追加</button>
                        </div>
                    </div>
                </div>

                <!-- Mobile Only: Chat & Participants inside PREVIEW tab -->
                <div id="mobile-chat-participant-container" class="lg:hidden flex-1 flex flex-col min-h-0 bg-[#0e0e10] border-t border-gray-800">
                    <!-- Layout adjusted dynamically via adjustLayoutForMobile() -->
                </div>
            </div>

            <!-- ========== MIDDLE PANEL: QUEUE & HISTORY ========== -->
            <div id="host-col-2" class="hidden lg:flex flex-col w-full lg:w-3/12 border-r border-gray-800 bg-[#111827]">
                <div class="flex-1 flex flex-col h-1/2 border-b border-gray-800">
                    <h3 class="bg-[#18181b] text-[10px] text-gray-400 font-bold px-3 py-1.5 border-b border-gray-800 tracking-widest flex justify-between items-center shadow-sm z-10">
                        <span><i class="fa-solid fa-list-ul"></i> QUEUE</span>
                        <span id="queue-badge" class="bg-indigo-600 text-white px-1.5 py-0.5 rounded-sm text-[9px]">0</span>
                    </h3>
                    <div id="host-queue-list" class="flex-1 overflow-y-auto p-2 space-y-1 bg-[#0e0e10]"></div>
                </div>
                <div class="flex-1 flex flex-col h-1/2">
                    <h3 class="bg-[#18181b] text-[10px] text-gray-400 font-bold px-3 py-1.5 border-b border-gray-800 tracking-widest shadow-sm z-10"><i class="fa-regular fa-clock"></i> HISTORY</h3>
                    <div id="host-history-list" class="flex-1 overflow-y-auto p-2 space-y-1 bg-[#0e0e10]"></div>
                </div>
            </div>

            <!-- ========== RIGHT PANEL: CHAT, USERS, BGM, SETTINGS ========== -->
            <div id="host-col-3" class="hidden lg:flex flex-col w-full lg:w-2/12 bg-[#0e0e10]">
                
                <!-- Chat (PC Only - Top Half) -->
                <div id="host-col-3-top" class="hidden lg:flex flex-col h-[40%] border-b border-gray-800">
                    <div id="chat-container" class="flex-1 flex flex-col bg-[#111827]">
                        <div class="flex justify-between items-center bg-[#18181b] px-2 py-1.5 border-b border-gray-800 shadow-sm z-10">
                            <span class="text-[10px] font-bold text-gray-400 tracking-widest">CHAT</span>
                            <label class="flex items-center gap-1 text-[9px] font-bold text-gray-500 cursor-pointer hover:text-gray-300">
                                <input type="checkbox" id="host-tts-toggle" class="rounded-sm bg-gray-800 border-gray-600 text-indigo-500 focus:ring-indigo-500">
                                <span>TTS 読上</span>
                            </label>
                        </div>
                        <div id="host-chat-list" class="flex-1 overflow-y-auto p-2 space-y-1 bg-[#0e0e10]"></div>
                        <div class="p-2 bg-[#18181b] border-t border-gray-800 flex gap-1.5 shrink-0">
                            <input type="text" id="host-chat-input" onkeypress="if(event.key === 'Enter') sendChatRequest()" placeholder="チャット..." class="flex-1 bg-[#09090b] border border-gray-700 rounded-sm px-2 py-1 text-xs text-white outline-none focus:border-indigo-500">
                            <button onclick="sendChatRequest()" class="bg-gray-700 hover:bg-gray-600 text-white px-2.5 rounded-sm text-xs font-bold transition-colors border border-gray-600"><i class="fa-solid fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>

                <!-- Tabs (Bottom Half on PC, Full on Mobile) -->
                <div class="flex bg-[#18181b] border-b border-gray-800 shrink-0">
                    <button onclick="switchHostSettingsTab('bgm')" id="tab-btn-bgm" class="flex-1 py-2 text-[10px] font-bold text-indigo-400 border-b-2 border-indigo-500 transition-colors">BGM</button>
                    <button onclick="switchHostSettingsTab('settings')" id="tab-btn-settings" class="flex-1 py-2 text-[10px] font-bold text-gray-500 border-b-2 border-transparent transition-colors">SETTINGS</button>
                </div>

                <!-- Tab Contents -->
                <div class="flex-1 relative overflow-hidden">
                    
                    <!-- Participants (Moved dynamically to Mobile PREVIEW Tab, or PC's Settings Tab bottom? No, PC has it below) -->
                    <div id="participant-container" class="hidden lg:flex flex-col bg-[#111827] border-b border-gray-800 h-[35%] shrink-0">
                        <div class="flex justify-between items-center bg-[#18181b] px-2 py-1.5 border-b border-gray-800 shadow-sm z-10">
                            <span class="text-[10px] font-bold text-gray-400 tracking-widest" id="host-participant-count">USERS (0)</span>
                            <label class="flex items-center gap-1 text-[9px] font-bold text-red-500 cursor-pointer hover:text-red-400">
                                <input type="checkbox" id="setting-cam-approval" onchange="toggleCamApproval()" class="rounded-sm bg-gray-800 border-gray-600 text-red-500 focus:ring-red-500">
                                <span>視聴承認制</span>
                            </label>
                        </div>
                        <div id="host-participant-list" class="flex-1 overflow-y-auto p-2 space-y-1 bg-[#0e0e10]"></div>
                    </div>

                    <div class="flex-1 relative min-h-0">
                        <!-- BGM Tab -->
                        <div id="tab-content-bgm" class="absolute inset-0 flex flex-col bg-[#111827] p-3 space-y-3 overflow-y-auto">
                            <div>
                                <div class="flex gap-1 mb-1">
                                    <input type="text" id="input-bgm-url" placeholder="URL / プレイリスト" class="flex-1 bg-[#09090b] border border-gray-700 rounded-sm px-2 py-1.5 text-xs text-white outline-none focus:border-indigo-500">
                                    <button onclick="addBGM()" class="bg-gray-700 hover:bg-gray-600 text-white px-2.5 rounded-sm text-xs font-bold border border-gray-600">追加</button>
                                </div>
                                <div class="flex gap-1 mt-1">
                                    <select id="select-mylist" onchange="loadFromMyList()" class="flex-1 bg-[#09090b] border border-gray-700 rounded-sm px-2 py-1 text-[10px] text-gray-300 outline-none">
                                        <option value="">★ マイリストから追加</option>
                                    </select>
                                    <button onclick="saveToMyList()" title="マイリストに保存" class="bg-yellow-700/50 hover:bg-yellow-600/50 text-yellow-500 border border-yellow-700/50 px-2.5 rounded-sm text-xs"><i class="fa-solid fa-star"></i></button>
                                </div>
                            </div>
                            <div class="flex gap-2 text-[10px] font-bold text-gray-400 bg-[#18181b] p-2 rounded-sm border border-gray-800 justify-around shadow-sm">
                                <label class="flex items-center gap-1 cursor-pointer hover:text-white">
                                    <input type="checkbox" id="bgm-shuffle" onchange="updateBGMPlaybackSettings()" class="rounded-sm bg-gray-800 border-gray-600 text-indigo-500 focus:ring-indigo-500">
                                    <i class="fa-solid fa-shuffle"></i> SHUF
                                </label>
                                <label class="flex items-center gap-1 cursor-pointer hover:text-white">
                                    <input type="checkbox" id="bgm-loop" checked onchange="updateBGMPlaybackSettings()" class="rounded-sm bg-gray-800 border-gray-600 text-indigo-500 focus:ring-indigo-500">
                                    <i class="fa-solid fa-repeat"></i> LOOP
                                </label>
                                <label class="flex items-center gap-1 cursor-pointer hover:text-white">
                                    <input type="checkbox" id="bgm-loop-one" onchange="updateBGMPlaybackSettings()" class="rounded-sm bg-gray-800 border-gray-600 text-indigo-500 focus:ring-indigo-500">
                                    <i class="fa-solid fa-rotate-right"></i> ONE
                                </label>
                            </div>
                            <div id="host-bgm-list" class="flex-1 space-y-1"></div>
                        </div>

                        <!-- SETTINGS Tab -->
                        <div id="tab-content-settings" class="hidden absolute inset-0 flex flex-col bg-[#111827] p-3 space-y-4 overflow-y-auto">
                            <div class="space-y-2">
                                <h4 class="text-[10px] font-bold text-gray-500 border-b border-gray-800 pb-1 tracking-widest">HOST INFO</h4>
                                <div>
                                    <label class="block text-[10px] font-bold text-gray-400 mb-0.5">配信者の名前</label>
                                    <input type="text" id="setting-host-name" class="w-full bg-[#09090b] border border-gray-700 rounded-sm px-2 py-1 text-xs text-white outline-none focus:border-indigo-500" onchange="updateHostSettings()">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-gray-400 mb-0.5">動画尺制限 (分) ※0で無制限</label>
                                    <input type="number" id="setting-duration" value="10" class="w-full bg-[#09090b] border border-gray-700 rounded-sm px-2 py-1 text-xs text-white outline-none focus:border-indigo-500" onchange="updateHostSettings()">
                                </div>
                            </div>

                            <div class="space-y-2">
                                <h4 class="text-[10px] font-bold text-gray-500 border-b border-gray-800 pb-1 tracking-widest">INVITE URLs</h4>
                                <div>
                                    <label class="block text-[10px] font-bold text-gray-400 mb-0.5"><i class="fa-solid fa-headphones"></i> Listener (リスナー用)</label>
                                    <div class="flex gap-1"><input type="text" id="url-listener" readonly class="flex-1 bg-[#09090b] border border-gray-800 rounded-sm px-1.5 py-1 text-[10px] text-gray-500 outline-none"><button onclick="copyURL('url-listener')" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 px-2 rounded-sm text-[10px] font-bold">COPY</button></div>
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-yellow-500 mb-0.5"><i class="fa-solid fa-crown"></i> Controller (リモコン用)</label>
                                    <div class="flex gap-1"><input type="text" id="url-remote" readonly class="flex-1 bg-[#09090b] border border-gray-800 rounded-sm px-1.5 py-1 text-[10px] text-gray-500 outline-none"><button onclick="copyURL('url-remote')" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 px-2 rounded-sm text-[10px] font-bold">COPY</button></div>
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-green-500 mb-0.5"><i class="fa-solid fa-camera"></i> Camera (カメラポータル)</label>
                                    <div class="flex gap-1"><input type="text" id="url-camera" readonly class="flex-1 bg-[#09090b] border border-gray-800 rounded-sm px-1.5 py-1 text-[10px] text-gray-500 outline-none"><button onclick="copyURL('url-camera')" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 px-2 rounded-sm text-[10px] font-bold">COPY</button></div>
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-blue-400 mb-0.5"><i class="fa-solid fa-tv"></i> OBS (映像+音声)</label>
                                    <div class="flex gap-1"><input type="text" id="url-obs-cam" readonly class="flex-1 bg-[#09090b] border border-gray-800 rounded-sm px-1.5 py-1 text-[10px] text-gray-500 outline-none"><button onclick="copyURL('url-obs-cam')" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 px-2 rounded-sm text-[10px] font-bold">COPY</button></div>
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-gray-500 mb-0.5"><i class="fa-solid fa-tv"></i> OBS (オーバーレイのみ)</label>
                                    <div class="flex gap-1"><input type="text" id="url-obs" readonly class="flex-1 bg-[#09090b] border border-gray-800 rounded-sm px-1.5 py-1 text-[10px] text-gray-500 outline-none"><button onclick="copyURL('url-obs')" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 px-2 rounded-sm text-[10px] font-bold">COPY</button></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- MOBILE TAB BAR -->
        <div class="lg:hidden flex-shrink-0 bg-[#18181b] border-t border-gray-800 flex shadow-[0_-5px_10px_rgba(0,0,0,0.5)] z-30 pb-safe">
            <button onclick="switchHostMobileTab('col1')" id="mobile-tab-col1" class="flex-1 py-2.5 text-[10px] font-bold text-indigo-400 border-t-2 border-indigo-500 flex flex-col items-center gap-1 transition-colors"><i class="fa-solid fa-video text-base"></i>PREVIEW</button>
            <button onclick="switchHostMobileTab('col2')" id="mobile-tab-col2" class="flex-1 py-2.5 text-[10px] font-bold text-gray-500 border-t-2 border-transparent flex flex-col items-center gap-1 transition-colors"><i class="fa-solid fa-list-ul text-base"></i>QUEUE</button>
            <button onclick="switchHostMobileTab('col3')" id="mobile-tab-col3" class="flex-1 py-2.5 text-[10px] font-bold text-gray-500 border-t-2 border-transparent flex flex-col items-center gap-1 transition-colors"><i class="fa-solid fa-gear text-base"></i>SETTINGS</button>
        </div>
    </div>

    <!-- カメラ中継用のダミー要素 -->
    <audio id="dummy-audio" src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA" loop playsinline></audio>

    <script>
        let peer = null;
        let currentRoomId = null;
        let isHost = true;
        
        let hostPassword = ''; 
        let queue = [];
        let bgmQueue = [];
        let historyQueue = [];
        let chatHistory = []; 
        let currentSong = null;
        let player = null;
        let isLightMode = false;
        let hostName = "配信太郎";
        let hostTheme = "";
        let durationLimit = 10 * 60;
        let bgmResumeData = null;

        let bannedUsers = {};

        // スマホ用: DOMの動的配置変更処理
        function adjustLayoutForMobile() {
            const isMobile = window.innerWidth < 1024;
            const chatContainer = document.getElementById('chat-container');
            const participantContainer = document.getElementById('participant-container');
            const mobileContainer = document.getElementById('mobile-chat-participant-container');
            const col3Top = document.getElementById('host-col-3-top');
            
            if (isMobile) {
                if (chatContainer && chatContainer.parentNode !== mobileContainer) {
                    mobileContainer.appendChild(chatContainer);
                    chatContainer.classList.remove('h-full');
                    chatContainer.style.height = '280px';
                }
                if (participantContainer && participantContainer.parentNode !== mobileContainer) {
                    mobileContainer.appendChild(participantContainer);
                    participantContainer.classList.remove('hidden', 'lg:flex');
                    participantContainer.classList.add('flex');
                    participantContainer.style.height = '250px';
                }
            } else {
                if (chatContainer && chatContainer.parentNode !== col3Top) {
                    if(col3Top) {
                        col3Top.appendChild(chatContainer);
                        chatContainer.classList.add('h-full');
                        chatContainer.style.height = '100%';
                    }
                }
                const col3TabArea = document.querySelector('#host-col-3 > .flex-1');
                if (participantContainer && col3TabArea && participantContainer.parentNode !== col3TabArea) {
                    col3TabArea.insertBefore(participantContainer, col3TabArea.firstChild);
                    participantContainer.classList.add('hidden', 'lg:flex');
                    participantContainer.classList.remove('flex');
                    participantContainer.style.height = '35%';
                }
            }
        }
        window.addEventListener('resize', adjustLayoutForMobile);

        function switchHostMobileTab(tabName) {
            ['col1', 'col2', 'col3'].forEach(name => {
                const btn = document.getElementById('mobile-tab-' + name);
                if(btn) {
                    if(name === tabName) {
                        btn.classList.add('text-indigo-400', 'border-indigo-500');
                        btn.classList.remove('text-gray-500', 'border-transparent');
                    } else {
                        btn.classList.remove('text-indigo-400', 'border-indigo-500');
                        btn.classList.add('text-gray-500', 'border-transparent');
                    }
                }
            });

            const col1 = document.getElementById('host-col-1');
            const col2 = document.getElementById('host-col-2');
            const col3 = document.getElementById('host-col-3');
            
            if(window.innerWidth < 1024) {
                if(tabName === 'col1') {
                    col1.classList.remove('hidden'); col1.classList.add('flex');
                    col2.classList.add('hidden'); col2.classList.remove('flex');
                    col3.classList.add('hidden'); col3.classList.remove('flex');
                } else if(tabName === 'col2') {
                    col1.classList.add('hidden'); col1.classList.remove('flex');
                    col2.classList.remove('hidden'); col2.classList.add('flex');
                    col3.classList.add('hidden'); col3.classList.remove('flex');
                } else {
                    col1.classList.add('hidden'); col1.classList.remove('flex');
                    col2.classList.add('hidden'); col2.classList.remove('flex');
                    col3.classList.remove('hidden'); col3.classList.add('flex');
                    
                    if (document.getElementById('tab-btn-bgm').classList.contains('border-transparent') && document.getElementById('tab-btn-settings').classList.contains('border-transparent')) {
                        switchHostSettingsTab('bgm');
                    }
                }
            }
        }

        window.addEventListener('resize', () => {
            if(window.innerWidth >= 1024) {
                const col1 = document.getElementById('host-col-1');
                const col2 = document.getElementById('host-col-2');
                const col3 = document.getElementById('host-col-3');
                if(col1) { col1.classList.remove('hidden'); col1.classList.add('flex'); }
                if(col2) { col2.classList.remove('hidden'); col2.classList.add('flex'); }
                if(col3) { col3.classList.remove('hidden'); col3.classList.add('flex'); }
            }
        });

        function switchHostSettingsTab(tabName) {
            ['bgm', 'settings'].forEach(name => {
                const btn = document.getElementById('tab-btn-' + name);
                const content = document.getElementById('tab-content-' + name);
                if(btn) {
                    if(name === tabName) {
                        btn.classList.add('text-indigo-400', 'border-indigo-500');
                        btn.classList.remove('text-gray-500', 'border-transparent');
                        if(content) content.classList.remove('hidden');
                    } else {
                        btn.classList.remove('text-indigo-400', 'border-indigo-500');
                        btn.classList.add('text-gray-500', 'border-transparent');
                        if(content) content.classList.add('hidden');
                    }
                }
            });
        }

        // オーディオミキサー制御
        function toggleHostJukeboxMute() {
            const icon = document.getElementById('icon-host-jukebox-mute');
            if(!icon) return;
            const isCurrentlyMuted = icon.classList.contains('fa-volume-xmark');

            if(isCurrentlyMuted) {
                icon.classList.replace('fa-volume-xmark', 'fa-volume-high');
                icon.parentElement.classList.replace('text-gray-500', 'text-gray-300');
                if(player && typeof player.unMute === 'function') {
                    player.unMute();
                    const vol = document.getElementById('host-jukebox-vol').value;
                    player.setVolume(vol);
                }
            } else {
                icon.classList.replace('fa-volume-high', 'fa-volume-xmark');
                icon.parentElement.classList.replace('text-gray-300', 'text-gray-500');
                if(player && typeof player.mute === 'function') {
                    player.mute();
                }
            }
            saveHostState();
        }
        function changeHostJukeboxVol(val) {
            if(player && typeof player.setVolume === 'function') {
                player.setVolume(val);
            }
            if(val > 0) {
                const icon = document.getElementById('icon-host-jukebox-mute');
                if (icon && icon.classList.contains('fa-volume-xmark')) {
                    icon.classList.replace('fa-volume-xmark', 'fa-volume-high');
                    icon.parentElement.classList.replace('text-gray-500', 'text-gray-300');
                    if(player && typeof player.unMute === 'function') {
                        player.unMute();
                    }
                }
            }
            saveHostState();
        }

        function toggleHostStreamMute() {
            const vid = document.getElementById('host-stream-preview');
            const icon = document.getElementById('icon-host-stream-mute');
            if(!icon) return;
            const isCurrentlyMuted = icon.classList.contains('fa-volume-xmark');
            
            if(isCurrentlyMuted) {
                icon.classList.replace('fa-volume-xmark', 'fa-volume-high');
                icon.parentElement.classList.replace('text-gray-500', 'text-gray-300');
                if (vid) {
                    vid.muted = false;
                    vid.play().catch(e=>{});
                }
            } else {
                icon.classList.replace('fa-volume-high', 'fa-volume-xmark');
                icon.parentElement.classList.replace('text-gray-300', 'text-gray-500');
                if (vid) {
                    vid.muted = true;
                }
            }
            saveHostState();
        }
        function changeHostStreamVol(val) {
            const vid = document.getElementById('host-stream-preview');
            if (vid) {
                vid.volume = val / 100;
            }
            if(val > 0) {
                const icon = document.getElementById('icon-host-stream-mute');
                if (icon && icon.classList.contains('fa-volume-xmark')) {
                    icon.classList.replace('fa-volume-xmark', 'fa-volume-high');
                    icon.parentElement.classList.replace('text-gray-500', 'text-gray-300');
                    if (vid) {
                        vid.muted = false;
                        vid.play().catch(e=>{});
                    }
                }
            }
            saveHostState();
        }

        window.onload = () => {
            adjustLayoutForMobile(); 
            
            const unlockTTS = () => { window.speechSynthesis.speak(new SpeechSynthesisUtterance('')); };
            const hTts = document.getElementById('host-tts-toggle');
            if(hTts) hTts.addEventListener('change', unlockTTS);

            try {
                const rawData = localStorage.getItem('jukebox_mylist');
                if (rawData) {
                    const parsed = JSON.parse(rawData);
                    if (Array.isArray(parsed)) myList = parsed;
                }
            } catch(e) { myList = []; }

            const params = new URLSearchParams(window.location.search);
            try {
                if(params.has('setup_host')) {
                    currentRoomId = params.get('setup_host');
                    const history = JSON.parse(localStorage.getItem('jukebox_host_history')) || [];
                    const item = history.find(h => h.roomId === currentRoomId);
                    if(item) {
                        document.getElementById('input-room-id').value = item.roomId;
                        document.getElementById('input-host-name').value = item.hostName;
                        document.getElementById('input-host-password').value = item.password || '';
                        createRoom();
                    } else {
                        showView('setup-view');
                        renderHostHistory();
                    }
                } else {
                    showView('setup-view');
                    renderHostHistory();
                }
            } catch(e) {
                console.error("Initialization error:", e);
                showView('setup-view');
                renderHostHistory();
            }
        };

        function showView(viewId) {
            ['setup-view', 'host-view'].forEach(id => {
                const el = document.getElementById(id);
                if(el) { el.classList.add('hidden'); el.classList.remove('flex'); }
            });
            const v = document.getElementById(viewId);
            if(v) {
                v.classList.remove('hidden');
                if(viewId === 'host-view') v.classList.add('flex');
            }
        }

        function showToast(msg, type="info") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerHTML = msg;
            toast.className = `toast bg-[#18181b] border-l-4 border-indigo-500 text-gray-200 p-3 rounded-sm shadow-xl flex items-center gap-3 text-xs font-bold`;
            if (type === 'error') toast.classList.replace('border-indigo-500', 'border-red-500');
            else toast.classList.replace('border-red-500', 'border-indigo-500');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        let hostNewsTimeout = null;
        function showHostNews(msg) {
            const ticker = document.getElementById('host-news-ticker');
            if(ticker) {
                ticker.innerHTML = msg;
                ticker.style.opacity = '1';
                if(hostNewsTimeout) clearTimeout(hostNewsTimeout);
                hostNewsTimeout = setTimeout(() => {
                    ticker.style.opacity = '0';
                }, 5000);
            }
        }

        function generateId() { return Math.random().toString(36).substring(2, 9); }

        function generateHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash = hash & hash; 
            }
            return Math.abs(hash).toString(36);
        }

        function createRoom() {
            try {
                const idInput = document.getElementById('input-room-id').value.trim();
                const nameInput = document.getElementById('input-host-name').value.trim();
                const passInput = document.getElementById('input-host-password').value.trim(); 
                if(!idInput) { showToast("ルームIDを入力してください", "error"); return; }
                
                let baseId = idInput.replace(/[^a-zA-Z0-9-]/g, '');
                if(!baseId) { showToast("ルームIDは半角英数字で入力してください", "error"); return; }
                
                hostName = nameInput || "配信太郎";
                hostPassword = passInput; 
                
                if (hostPassword) {
                    currentRoomId = baseId + '-' + generateHash(hostPassword);
                } else {
                    currentRoomId = baseId;
                }
                
                const settingNameEl = document.getElementById('setting-host-name');
                if(settingNameEl) settingNameEl.value = hostName;
                
                generateURLs();
                updateMyListSelect();
                saveHostHistory(baseId, hostName, hostPassword); 
                initHost();
            } catch (err) {
                showToast("エラーが発生しました: " + err.message, "error");
            }
        }

        function generateURLs() {
            const base = window.location.href.split('?')[0].split('#')[0];
            const baseUrlPath = base.substring(0, base.lastIndexOf('/') + 1);

            const elListener = document.getElementById('url-listener');
            if(elListener) elListener.value = `${baseUrlPath}listener.html?host=${currentRoomId}`;

            const elRemote = document.getElementById('url-remote');
            if(elRemote) elRemote.value = `${baseUrlPath}controller.html`;

            const elCamera = document.getElementById('url-camera');
            if(elCamera) elCamera.value = `${baseUrlPath}camera.html`;

            const elObsCam = document.getElementById('url-obs-cam');
            if(elObsCam) elObsCam.value = `${baseUrlPath}OBS.html?obs_cam=${currentRoomId}`;

            const elObs = document.getElementById('url-obs');
            if(elObs) elObs.value = `${baseUrlPath}OBS.html?obs=${currentRoomId}`;
        }

        function copyURL(inputId) {
            const el = document.getElementById(inputId);
            if(el) {
                el.select();
                document.execCommand("copy");
                showToast("URLをコピーしました！");
            }
        }

        function renderHostHistory() {
            const list = document.getElementById('setup-history-list');
            if(!list) return;
            const history = JSON.parse(localStorage.getItem('jukebox_host_history')) || [];
            
            if(history.length === 0) {
                list.innerHTML = '<p class="text-gray-600 text-center text-xs py-4 font-bold">過去の作成履歴はありません</p>';
                return;
            }

            list.innerHTML = '';
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'bg-[#0e0e10] p-2.5 rounded-sm flex justify-between items-center cursor-pointer hover:bg-gray-800 transition border border-gray-800 hover:border-indigo-500/50 mb-1.5 shadow-inner group';
                div.innerHTML = `
                    <div class="flex-1 min-w-0" onclick="joinFromHostHistory('${item.roomId}', '${item.hostName}', '${item.password || ''}')">
                        <div class="font-bold text-gray-200 text-xs truncate group-hover:text-indigo-400 transition-colors">${item.hostName} の部屋</div>
                        <div class="text-[9px] text-gray-500 font-mono mt-0.5 tracking-wider">ID: ${item.roomId}</div>
                    </div>
                    <button class="text-gray-600 hover:text-red-400 px-2 transition-colors" onclick="deleteHostHistory('${item.roomId}', event)"><i class="fa-solid fa-trash-can"></i></button>
                `;
                list.appendChild(div);
            });
        }

        function initHost() {
            showView('host-view');
            generateURLs();

            const url = new URL(window.location);
            url.searchParams.set('setup_host', currentRoomId);
            history.replaceState(null, '', url);

            peer = new Peer(`jukebox-${currentRoomId}`);

            peer.on('open', (id) => {
                const statusDot = document.getElementById('status-dot');
                if (statusDot) {
                    statusDot.classList.replace('bg-yellow-500', 'bg-green-500');
                    statusDot.classList.replace('shadow-[0_0_5px_rgba(234,179,8,0.8)]', 'shadow-[0_0_5px_rgba(34,197,94,0.8)]');
                }
                const statusText = document.getElementById('status-text');
                if (statusText) statusText.textContent = "ONLINE / WAITING";
                const errorText = document.getElementById('error-text');
                if (errorText) errorText.classList.add('hidden');
                
                loadHostState(); 
                loadYouTubeAPI(); 
                
                setInterval(() => {
                    if (player && typeof player.getCurrentTime === 'function' && typeof player.getPlayerState === 'function') {
                        let actualVideoId = currentSong ? currentSong.videoId : null;
                        try {
                            const vData = player.getVideoData();
                            if(vData && vData.video_id) actualVideoId = vData.video_id;
                        } catch(e) {}

                        const syncData = {
                            type: 'sync_playback',
                            videoId: actualVideoId,
                            time: player.getCurrentTime(),
                            status: player.getPlayerState()
                        };
                        Object.values(connectedListeners).forEach(p => {
                            if(p.conn.open) p.conn.send(syncData);
                        });
                    }
                }, 1000);

                setInterval(() => {
                    const now = Date.now();
                    Object.values(connectedListeners).forEach(p => {
                        if (p.conn.open) {
                            if (!p.lastPongReceived) p.lastPongReceived = now;
                            if (now - p.lastPongReceived > 30000) {
                                p.conn.close();
                                delete connectedListeners[p.id];
                                updateParticipantsUI();
                                broadcastState();
                            } else {
                                p.conn.send({ type: 'ping' });
                            }
                        } else {
                            delete connectedListeners[p.id];
                            updateParticipantsUI();
                            broadcastState();
                        }
                    });
                }, 10000);
            });

            peer.on('error', (err) => {
                const statusDot = document.getElementById('status-dot');
                if (statusDot) {
                    statusDot.classList.replace('bg-green-500', 'bg-red-500');
                    statusDot.classList.replace('shadow-[0_0_5px_rgba(34,197,94,0.8)]', 'shadow-[0_0_5px_rgba(239,68,68,0.8)]');
                }
                const statusText = document.getElementById('status-text');
                if (statusText) statusText.textContent = "ERROR";
                const errTxt = document.getElementById('error-text');
                if (errTxt) {
                    errTxt.textContent = err.type;
                    errTxt.classList.remove('hidden');
                }
            });

            peer.on('connection', (conn) => {
                if(bannedUsers[conn.peer]) {
                    conn.on('open', () => { conn.send({type: 'banned'}); conn.close(); });
                    return;
                }
                
                conn.isAuthenticated = false;

                connectedListeners[conn.peer] = {
                    id: conn.peer, conn: conn, name: "名無し", isMuted: false, cameraStatus: 'none', isRemote: false, isObs: false, call: null, hasAnnounced: false, lastPongReceived: Date.now(), isCam: conn.peer.startsWith('cam-')
                };
                updateParticipantsUI();

                conn.on('open', () => { 
                    conn.send({
                        type: 'state',
                        status: player ? (player.getPlayerState && player.getPlayerState() === 1 ? 'playing' : 'paused') : 'paused',
                        videoId: currentSong ? currentSong.videoId : null,
                        hostName: hostName,
                        requirePassword: !!hostPassword 
                    });
                    broadcastState(); 
                });
                
                conn.on('data', (data) => { 
                    if (hostPassword) {
                        if (data.type === 'auth_request') {
                            if (data.password === hostPassword) {
                                conn.isAuthenticated = true;
                                conn.send({ type: 'auth_response', success: true });
                                broadcastState();
                            } else {
                                conn.send({ type: 'auth_response', success: false });
                            }
                            return;
                        }

                        if (data.uuid) {
                            const isBannedUUID = Object.values(bannedUsers).some(u => u.uuid === data.uuid);
                            if (isBannedUUID) {
                                conn.send({type: 'banned'});
                                conn.close();
                                return;
                            }
                        }

                        const isRemoteOrCam = data.isRemote || conn.peer.startsWith('cam-');
                        if (isRemoteOrCam && !conn.isAuthenticated) {
                            conn.send({ type: 'auth_required' }); 
                            return;
                        }
                    } else {
                        conn.isAuthenticated = true;
                    }

                    if (data.type === 'pong') {
                        if (connectedListeners[conn.peer]) {
                            connectedListeners[conn.peer].lastPongReceived = Date.now();
                        }
                        return;
                    }
                    
                    handleHostData(data, conn); 
                });
                
                conn.on('close', () => {
                    if(connectedListeners[conn.peer]) {
                        delete connectedListeners[conn.peer];
                        updateParticipantsUI();
                    }
                });
            });

            peer.on('call', (call) => {
                if(call.peer.startsWith('cam-')) {
                    hostMediaConn = call;
                    call.answer();
                    call.on('stream', (stream) => {
                        const previewVid = document.getElementById('host-stream-preview');
                        if (previewVid) {
                            previewVid.srcObject = stream;
                            previewVid.classList.remove('hidden');
                            const streamOffline = document.getElementById('host-stream-offline');
                            if (streamOffline) streamOffline.classList.add('hidden');
                            
                            const muteIcon = document.getElementById('icon-host-stream-mute');
                            if(muteIcon) previewVid.muted = muteIcon.classList.contains('fa-volume-xmark');
                            const streamVol = document.getElementById('host-stream-vol');
                            if(streamVol) previewVid.volume = streamVol.value / 100;
                            
                            previewVid.play().catch(e=>{});
                        }
                        
                        const relayVid = document.getElementById('host-relay-video');
                        if (relayVid) { relayVid.srcObject = stream; relayVid.play().catch(e=>{}); }
                        const dummyAudio = document.getElementById('dummy-audio');
                        if(dummyAudio) dummyAudio.play().catch(e=>{});
                        
                        broadcastStreamToListeners(stream);
                    });
                    call.on('close', () => {
                        stopBroadcastStream();
                        const previewVid = document.getElementById('host-stream-preview');
                        if(previewVid) {
                            previewVid.srcObject = null;
                            previewVid.classList.add('hidden');
                            const streamOffline = document.getElementById('host-stream-offline');
                            if (streamOffline) streamOffline.classList.remove('hidden');
                        }
                    });
                }
            });
        }

        async function fetchYouTubeTitle(videoId) {
            try {
                const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
                if(res.ok) {
                    const data = await res.json();
                    return data.title || "不明なタイトル";
                }
            } catch(e) {}
            return "不明なタイトル";
        }

        function handleHostData(data, conn) {
            const peerId = conn.peer;
            const listener = connectedListeners[peerId];

            if(bannedUsers[peerId]) return; 

            if(data.type === 'update_profile') {
                if(listener) {
                    let isReconnected = false;
                    let restoredCameraStatus = 'none';
                    let restoredIsMuted = false;

                    if (data.uuid) {
                        Object.values(connectedListeners).forEach(oldP => {
                            if (oldP.uuid === data.uuid && oldP.id !== peerId) {
                                isReconnected = true;
                                restoredCameraStatus = oldP.cameraStatus;
                                restoredIsMuted = oldP.isMuted;
                                oldP.conn.close();
                                delete connectedListeners[oldP.id];
                            }
                        });
                    }

                    const isNew = (listener.name === "名無し" || !listener.hasAnnounced) && data.name !== "名無し" && !data.isObs && !data.isRemote && !isReconnected && !listener.isCam;
                    listener.name = data.name;
                    listener.isRemote = data.isRemote || false;
                    listener.isObs = data.isObs || false;
                    listener.uuid = data.uuid; 
                    listener.lastPongReceived = Date.now();
                    
                    if (isReconnected) {
                        listener.cameraStatus = restoredCameraStatus;
                        listener.isMuted = restoredIsMuted;
                    }

                    if (listener.uuid && approvedUsers[listener.uuid]) {
                        listener.cameraStatus = 'approved';
                    }

                    if (listener.isObs || listener.isRemote) {
                        listener.cameraStatus = 'approved';
                        if (currentStreamToListeners && !listener.call) {
                            sendStreamToPeer(listener.id);
                        }
                    } else if (listener.cameraStatus === 'approved') {
                        if (currentStreamToListeners && !listener.call) {
                            sendStreamToPeer(listener.id);
                        }
                    }

                    if (isNew) {
                        listener.hasAnnounced = true;
                        showHostNews(`<i class="fa-solid fa-door-open text-gray-500"></i> <span class="text-white">${data.name}</span> <span class="text-gray-400">JOINED</span>`);
                        Object.values(connectedListeners).forEach(p => {
                            if (p.isRemote && p.conn.open) p.conn.send({type: 'remote_alert', msg: `<i class="fa-solid fa-door-open"></i> <b>${data.name}</b> が入室しました`});
                        });
                    } else if (isReconnected) {
                        listener.hasAnnounced = true;
                    }

                    updateParticipantsUI();
                }
            }
            else if(data.type === 'request') {
                if(listener && listener.isMuted) {
                    conn.send({type: 'error', msg: '現在リクエストが制限されています'});
                    return;
                }
                const song = {
                    id: generateId(), videoId: data.videoId, title: "取得中...", requester: data.requester, requesterReal: data.requesterReal, isAnon: data.isAnon, isRemote: data.isRemote || false
                };
                queue.push(song);
                showToast(`REQ: ${song.requester}`);
                showHostNews(`<i class="fa-solid fa-music text-indigo-400"></i> <span class="text-white">REQ:</span> ${data.requesterReal}`);
                
                Object.values(connectedListeners).forEach(p => {
                    if (p.isRemote && p.conn.open) p.conn.send({type: 'remote_alert', msg: `<i class="fa-solid fa-music"></i> リクエスト追加: <b>${data.requesterReal}</b>`});
                });

                saveHostState();
                updateUI();
                
                fetchYouTubeTitle(song.videoId).then(title => {
                    const qItem = queue.find(q => q.id === song.id);
                    if(qItem) { qItem.title = title; saveHostState(); updateUI(); }
                });

                if(!currentSong || currentSong.isBGM) {
                    if(player && typeof player.getPlayerState === 'function') playNext();
                }
            }
            else if(data.type === 'cancel') {
                queue = queue.filter(q => q.id !== data.id);
                saveHostState();
                updateUI();
            }
            else if(data.type === 'remote_cmd') {
                if(data.cmd === 'toggle') togglePlayHost();
                else if(data.cmd === 'skip') playNext(true); 
                else if(data.cmd === 'manage') {
                    if (data.action === 'cancel_req') removeQueue(data.targetId);
                    else if (data.action === 'toggle_cam_approval') {
                        const el = document.getElementById('setting-cam-approval');
                        if (el) el.checked = data.targetId;
                        toggleCamApproval();
                    }
                    else manageUser(data.targetId, data.action);
                }
            }
            else if(data.type === 'update_theme') {
                hostTheme = data.theme;
                const themeInput = document.getElementById('setting-theme');
                if(themeInput) themeInput.value = hostTheme;
                saveHostState();
                broadcastState();
                showToast("THEME UPDATED");
            }
            else if(data.type === 'request_camera') {
                if(listener) {
                    if(cameraApprovalMode && !listener.isRemote && !listener.isObs) {
                        listener.cameraStatus = 'requested';
                        updateParticipantsUI();
                        showHostNews(`<i class="fa-solid fa-bell text-yellow-400"></i> ${listener.name} がStream視聴承認待ちです`);
                        Object.values(connectedListeners).forEach(p => {
                            if(p.isRemote && p.conn.open) p.conn.send({type: 'camera_request_alert', id: listener.id, name: listener.name});
                        });
                    } else {
                        listener.cameraStatus = 'approved';
                        if(currentStreamToListeners && !listener.call) sendStreamToPeer(peerId);
                    }
                }
            }
            else if(data.type === 'camera_stop') {
                if(hostMediaConn) hostMediaConn.close();
                stopBroadcastStream();
            }
            else if(data.type === 'chat') {
                const newChat = {
                    id: generateId(), text: data.text, sender: data.sender, senderReal: data.senderReal, isAnon: data.isAnon, isRemote: data.isRemote, time: Date.now()
                };
                
                if(!chatHistory.some(c => c.id === newChat.id)) {
                    chatHistory.push(newChat);
                    if(chatHistory.length > 100) chatHistory.shift();
                    saveHostState();
                    updateUI(); 
                    showHostNews(`<i class="fa-solid fa-comment-dots text-gray-500"></i> <span class="text-indigo-300">${newChat.senderReal}</span>: ${newChat.text}`);
                    
                    Object.values(connectedListeners).forEach(p => {
                        if(p.conn.open) p.conn.send({type: 'new_chat', chat: newChat});
                    });
                    triggerTTS(newChat);
                }
            }
            else if(data.type === 'delete_chat') {
                deleteChat(data.id);
            }
        }

            const vid = extractVideoId(url);

                };

                updateUI();
                
                fetchYouTubeTitle(song.videoId).then(title => {
                    const qItem = queue.find(q => q.id === song.id);
                    if(qItem) { qItem.title = title; saveHostState(); updateUI(); }

        function toggleCamApproval() {
            const approvalEl = document.getElementById('setting-cam-approval');
            if(!approvalEl) return;
            cameraApprovalMode = approvalEl.checked;
            if(!cameraApprovalMode) {
                Object.values(connectedListeners).forEach(p => {
                    if(!p.isRemote && !p.isObs) {
                        p.cameraStatus = 'approved';
                        if(currentStreamToListeners && !p.call) sendStreamToPeer(p.id);
                    }
                });
            } else {
                Object.values(connectedListeners).forEach(p => {
                    if(!p.isObs && !p.isRemote && p.cameraStatus !== 'approved') {
                        p.cameraStatus = 'none';
                    }
                });
            }
            broadcastState();
            updateParticipantsUI();
        }

        function manageUser(peerId, action) {
            const p = connectedListeners[peerId];
            if(action === 'unban') {
                delete bannedUsers[peerId];
                saveHostState();
                updateParticipantsUI();
                showToast("UNBANNED");
                return;
            }

            if(!p) return;
            if(action === 'approve_cam') {
                p.cameraStatus = 'approved';
                if(p.uuid) {
                    approvedUsers[p.uuid] = true;
                    saveHostState();
                }
                if(currentStreamToListeners && !p.call) sendStreamToPeer(peerId);
                showToast(`${p.name}: CAM APPROVED`);
            } else if(action === 'reject_cam') {
                p.cameraStatus = 'none';
                if(p.uuid) {
                    delete approvedUsers[p.uuid];
                    saveHostState();
                }
                showToast(`${p.name}: CAM REJECTED`);
            } else if(action === 'mute') {
                p.isMuted = !p.isMuted;
                showToast(`${p.name}: MUTE ${p.isMuted ? 'ON' : 'OFF'}`);
            } else if(action === 'ban') {
                bannedUsers[peerId] = { name: p.name, time: Date.now(), uuid: p.uuid }; 
                if(p.uuid) delete approvedUsers[p.uuid];
                saveHostState();
                if(p.call) p.call.close();
                p.conn.send({type: 'banned'});
                p.conn.close();
                delete connectedListeners[peerId];
                showToast(`BANNED`, 'error');
            }
            updateParticipantsUI();
            broadcastState(); 
        }

        function updateHostSettings() {
            const hostNameEl = document.getElementById('setting-host-name');
            if(hostNameEl) hostName = hostNameEl.value || "配信太郎";
            const themeEl = document.getElementById('setting-theme');
            if(themeEl) hostTheme = themeEl.value;
            const durEl = document.getElementById('setting-duration');
            if(durEl) {
                durationLimit = parseInt(durEl.value) * 60;
                if(isNaN(durationLimit)) durationLimit = 0;

        function saveHostState() {
            if (!isHostStateLoaded) return; 

            const bgmSettings = {
                shuffle: document.getElementById('bgm-shuffle') ? document.getElementById('bgm-shuffle').checked : false,
                loop: document.getElementById('bgm-loop') ? document.getElementById('bgm-loop').checked : true,
                loopOne: document.getElementById('bgm-loop-one') ? document.getElementById('bgm-loop-one').checked : false
            };
            const audioMixerSettings = {
                jukeboxVol: document.getElementById('host-jukebox-vol') ? document.getElementById('host-jukebox-vol').value : 100,
                jukeboxMuted: document.getElementById('icon-host-jukebox-mute') ? document.getElementById('icon-host-jukebox-mute').classList.contains('fa-volume-xmark') : false,
                streamVol: document.getElementById('host-stream-vol') ? document.getElementById('host-stream-vol').value : 0,
                streamMuted: document.getElementById('icon-host-stream-mute') ? document.getElementById('icon-host-stream-mute').classList.contains('fa-volume-xmark') : true
            };
            const data = { queue, bgmQueue, historyQueue, chatHistory, currentSong, bgmResumeData, hostName, hostTheme, durationLimit, cameraApprovalMode, bannedUsers, bgmSettings, approvedUsers, audioMixerSettings };
            localStorage.setItem('jukebox_state_' + currentRoomId, JSON.stringify(data));
        }

        function loadHostState() {
            try {
                const saved = localStorage.getItem('jukebox_state_' + currentRoomId);
                if(saved) {
                    const data = JSON.parse(saved);
                    queue = Array.isArray(data.queue) ? data.queue : [];
                    bgmQueue = Array.isArray(data.bgmQueue) ? data.bgmQueue : [];
                    historyQueue = Array.isArray(data.historyQueue) ? data.historyQueue : [];
                    chatHistory = Array.isArray(data.chatHistory) ? data.chatHistory : [];
                    currentSong = data.currentSong || null;
                    bgmResumeData = data.bgmResumeData || null;
                    cameraApprovalMode = !!data.cameraApprovalMode;
                    bannedUsers = data.bannedUsers || {};
                    approvedUsers = data.approvedUsers || {};
                    
                    const camAppEl = document.getElementById('setting-cam-approval');
                    if(camAppEl) camAppEl.checked = cameraApprovalMode;
                    
                    if(data.hostName) { hostName = data.hostName; const hnEl = document.getElementById('setting-host-name'); if(hnEl) hnEl.value = hostName; }
                    if(data.hostTheme) { hostTheme = data.hostTheme; const thEl = document.getElementById('setting-theme'); if(thEl) thEl.value = hostTheme; }
                    if(data.durationLimit !== undefined) { durationLimit = data.durationLimit; const duEl = document.getElementById('setting-duration'); if(duEl) duEl.value = durationLimit / 60; }
                    
                    if(data.bgmSettings) {
                        const bgmShuf = document.getElementById('bgm-shuffle'); if(bgmShuf) bgmShuf.checked = data.bgmSettings.shuffle;
                        const bgmLoop = document.getElementById('bgm-loop'); if(bgmLoop) bgmLoop.checked = data.bgmSettings.loop;
                        const bgmLoopOne = document.getElementById('bgm-loop-one'); if(bgmLoopOne) bgmLoopOne.checked = data.bgmSettings.loopOne;
                    }

                    if(data.audioMixerSettings) {
                        const hbVol = document.getElementById('host-jukebox-vol');
                        if(hbVol) hbVol.value = data.audioMixerSettings.jukeboxVol;
                        const jIcon = document.getElementById('icon-host-jukebox-mute');
                        if (jIcon) {
                            if (data.audioMixerSettings.jukeboxMuted) {
                                jIcon.classList.replace('fa-volume-high', 'fa-volume-xmark');
                                jIcon.parentElement.classList.replace('text-gray-300', 'text-gray-500');
                            } else {
                                jIcon.classList.replace('fa-volume-xmark', 'fa-volume-high');
                                jIcon.parentElement.classList.replace('text-gray-500', 'text-gray-300');
                            }
                        }

                        if (player && typeof player.setVolume === 'function') {
                            player.setVolume(data.audioMixerSettings.jukeboxVol);
                            if (data.audioMixerSettings.jukeboxMuted) player.mute();
                            else player.unMute();
                        }

                        const hsVol = document.getElementById('host-stream-vol');
                        if(hsVol) hsVol.value = data.audioMixerSettings.streamVol;
                        const sIcon = document.getElementById('icon-host-stream-mute');
                        if (sIcon) {
                            if (data.audioMixerSettings.streamMuted) {
                                sIcon.classList.replace('fa-volume-high', 'fa-volume-xmark');
                                sIcon.parentElement.classList.replace('text-gray-300', 'text-gray-500');
                            } else {
                                sIcon.classList.replace('fa-volume-xmark', 'fa-volume-high');
                                sIcon.parentElement.classList.replace('text-gray-500', 'text-gray-300');
                            }
                        }

                        const streamVid = document.getElementById('host-stream-preview');
                        if (streamVid) {
                            streamVid.volume = data.audioMixerSettings.streamVol / 100;
                            streamVid.muted = data.audioMixerSettings.streamMuted;
                        }
                    }

                    updateUI();
                }
            } catch(e) { console.warn("Failed to load host state", e); }
            
            isHostStateLoaded = true; 
        }

        function applyBitrate(call, bitrateKbps) {
            if(!call || !call.peerConnection) return;
            const senders = call.peerConnection.getSenders();
            const videoSender = senders.find(s => s.track && s.track.kind === 'video');
            if (videoSender) {
                const params = videoSender.getParameters();
                if (!params.encodings) params.encodings = [{}];
                params.encodings[0].maxBitrate = bitrateKbps * 1000;
                videoSender.setParameters(params).catch(e => console.log("Bitrate error:", e));
            }
        }

        function sendStreamToPeer(peerId) {
            if(!currentStreamToListeners) return;
            const listener = connectedListeners[peerId];
            if(listener && listener.conn.open) {
                const call = peer.call(peerId, currentStreamToListeners);
                listener.call = call;
                setTimeout(() => applyBitrate(call, 2500), 1000); 
            }
        }

        function broadcastStreamToListeners(stream) {
            currentStreamToListeners = stream;
            Object.values(connectedListeners).forEach(listener => {
                if(!cameraApprovalMode || listener.cameraStatus === 'approved' || listener.isObs || listener.isRemote) {
                    sendStreamToPeer(listener.id);
                }
            });
            showToast("カメラ中継を開始しました", "info");
            broadcastState();
        }

        function stopBroadcastStream() {
            currentStreamToListeners = null;
            Object.values(connectedListeners).forEach(listener => {
                if(listener.call) { listener.call.close(); listener.call = null; }
            });
            showToast("カメラ中継が停止しました", "info");
            broadcastState(); 
        }

        function triggerTTS(chatObj) {
