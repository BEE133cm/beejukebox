        function loadYouTubeAPI() {
            if (window.YT && window.YT.Player) {
                if (document.getElementById('youtube-player')) {
                    initPlayer();
                }
            } else if (!document.getElementById('youtube-api-script')) {
                const tag = document.createElement('script');
                tag.id = 'youtube-api-script';
                tag.src = 'https://www.youtube.com/iframe_api';
                const firstScriptTag = document.getElementsByTagName('script')[0];
                if (firstScriptTag && firstScriptTag.parentNode) {
                    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
                } else {
                    document.head.appendChild(tag);
                }
            }
        }
        
        window.onYouTubeIframeAPIReady = function() { 
            if (document.getElementById('youtube-player')) {
                initPlayer(); 
            }
        };

        function initPlayer() {
            if(player && typeof player.playVideo === 'function') return;
            if(!document.getElementById('youtube-player')) return; 
            player = new YT.Player('youtube-player', {
                height: '100%', width: '100%',
                playerVars: { autoplay: 1, controls: 1, rel: 0 },
                events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerReady(event) {
            try {
                const saved = localStorage.getItem('jukebox_state_' + currentRoomId);
                if(saved) {
                    const data = JSON.parse(saved);
                    if(data.audioMixerSettings) {
                        player.setVolume(data.audioMixerSettings.jukeboxVol);
                        if(data.audioMixerSettings.jukeboxMuted) player.mute();
                        else player.unMute();
                    }
                }
            } catch(e) {}

            if(currentSong) {
                if (currentSong.listId) player.loadPlaylist({list: currentSong.listId, index: currentSong.playlistIndex || 0, startSeconds: currentSong.startSeconds || 0});
                else player.loadVideoById({videoId: currentSong.videoId, startSeconds: currentSong.startSeconds || 0});
            } else if (queue.length > 0 || bgmQueue.length > 0) playNext();
        }

        let durationCheckTimeout = null;

        function onPlayerStateChange(event) {
            updateUI(); 
            if (event.data === YT.PlayerState.PLAYING) {
                try {
                    const saved = localStorage.getItem('jukebox_state_' + currentRoomId);
                    if(saved) {
                        const data = JSON.parse(saved);
                        if(data.audioMixerSettings) {
                            player.setVolume(data.audioMixerSettings.jukeboxVol);
                            if(data.audioMixerSettings.jukeboxMuted) player.mute();
                            else player.unMute();
                        }
                    }
                } catch(e) {}

                if (currentSong && currentSong.isBGM && currentSong.listId && !currentSong._settingsApplied) {
                    currentSong._settingsApplied = true;
                    if (typeof player.setShuffle === 'function') {
                        const bgmShuf = document.getElementById('bgm-shuffle');
                        player.setShuffle(bgmShuf ? bgmShuf.checked : false);
                    }
                    if (typeof player.setLoop === 'function') {
                        const bgmLoop = document.getElementById('bgm-loop');
                        player.setLoop(bgmLoop ? bgmLoop.checked : false);
                    }
                }

                if(currentSong) {
                    try {
                        let videoData = player.getVideoData();
                        if(videoData && videoData.title && currentSong.title === "取得中...") {
                            currentSong.title = videoData.title;
                            updateUI();
                        }
                    } catch(e) {}
                }
                
                if(currentSong && !currentSong.isBGM && durationLimit > 0) {
                    if(durationCheckTimeout) clearTimeout(durationCheckTimeout);
                    durationCheckTimeout = setTimeout(() => {
                        const dur = player.getDuration();
                        if(dur > durationLimit) {
                            showToast(`曲が長すぎるためスキップしました(${Math.floor(dur/60)}分)`, "error");
                            playNext(true);
                        }
                    }, 1000); 
                }
            } 
            else if (event.data === YT.PlayerState.ENDED) {
                const bgmLoopOne = document.getElementById('bgm-loop-one');
                if (currentSong && currentSong.isBGM && bgmLoopOne && bgmLoopOne.checked) {
                    player.seekTo(0);
                    player.playVideo();
                    return;
                }
                playNext();
            }
        }

        function togglePlayHost() {
            if(!player || !currentSong || typeof player.getPlayerState !== 'function') return;
            if(player.getPlayerState() === 1) player.pauseVideo();
            else player.playVideo();
        }

        function playNext(forceSkip = false) {
            if (!player || typeof player.loadVideoById !== 'function') return;

            if (currentSong && !currentSong.isBGM) {
                historyQueue.unshift(currentSong);
                if (historyQueue.length > 20) historyQueue.pop();
            }

            if (currentSong && currentSong.isBGM && queue.length > 0 && !forceSkip) {
                bgmResumeData = {
                    videoId: currentSong.videoId, listId: currentSong.listId, title: currentSong.title,
                    time: player.getCurrentTime(), playlistIndex: player.getPlaylistIndex ? player.getPlaylistIndex() : 0
                };
            }

            if (queue.length > 0) {
                currentSong = queue.shift();
                player.loadVideoById({videoId: currentSong.videoId});
            } 
            else if (bgmResumeData) {
                currentSong = {
                    id: 'bgm-resumed', videoId: bgmResumeData.videoId, listId: bgmResumeData.listId,
                    title: bgmResumeData.title, requester: '🎵 待機BGM (再開)', isBGM: true,
                    startSeconds: bgmResumeData.time, playlistIndex: bgmResumeData.playlistIndex
                };
                if (currentSong.listId) player.loadPlaylist({list: currentSong.listId, index: bgmResumeData.playlistIndex, startSeconds: bgmResumeData.time});
                else player.loadVideoById({videoId: currentSong.videoId, startSeconds: bgmResumeData.time});
                bgmResumeData = null; 
            }
            else if (bgmQueue.length > 0) {
                let bgm;
                const bgmShuf = document.getElementById('bgm-shuffle');
                const bgmLoop = document.getElementById('bgm-loop');
                let shuffleOn = bgmShuf && bgmShuf.checked;
                let loopOn = bgmLoop && bgmLoop.checked;

                if (shuffleOn && bgmQueue.length > 1 && !bgmQueue[0].isPlaylist) {
                    let randomIndex = Math.floor(Math.random() * bgmQueue.length);
                    bgm = bgmQueue.splice(randomIndex, 1)[0];
                } else {
                    bgm = bgmQueue.shift();
                }

                if (loopOn) {
                    bgmQueue.push(bgm); 
                }
                
                if(bgm.isPlaylist) {
                    currentSong = { id: 'bgm-pl', videoId: '', listId: bgm.listId, title: '📁 プレイリスト', requester: '🎵 待機BGM', isBGM: true };
                    player.loadPlaylist({list: bgm.listId});
                } else {
                    currentSong = { id: 'bgm-' + generateId(), videoId: bgm.videoId, listId: null, title: bgm.title || "取得中...", requester: '🎵 待機BGM', isBGM: true };
                    player.loadVideoById({videoId: currentSong.videoId});
                }
            } else {
                currentSong = null;
                player.stopVideo();
            }
            saveHostState();
            updateUI();
        }

        function extractVideoId(url) {
            const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=))([^"&?\/\s]{11})/);
            return match ? match[1] : null;
        }

        function extractPlaylistId(url) {
            const match = url.match(/[?&]list=([^#\&\?]+)/);
            return match ? match[1] : null;
        }

        function addBGM() {
            const urlEl = document.getElementById('input-bgm-url');
            if(!urlEl) return;
            const url = urlEl.value;
            if(!url) return;

            const listId = extractPlaylistId(url);
            if(listId) {
                bgmQueue.push({ isPlaylist: true, listId: listId, rawUrl: url, title: "📁 プレイリスト" });
                showToast("プレイリストを追加しました");
                updateAndSaveBGM();
            } else {
                const vid = extractVideoId(url);
                if(vid) {
                    const bgmItem = { isPlaylist: false, videoId: vid, rawUrl: url, title: "取得中..." };
                    bgmQueue.push(bgmItem);
                    showToast("BGMを追加しました");
                    updateAndSaveBGM();
                    
                    fetchYouTubeTitle(vid).then(title => {
                        const bItem = bgmQueue.find(b => b.videoId === vid);
                        if(bItem) { bItem.title = title; updateAndSaveBGM(); }
                    });
                } else showToast("無効なURLです", "error");
            }
            urlEl.value = '';
        }

        function updateAndSaveBGM() {
            saveHostState();
            updateUI();
            if(!currentSong && player && typeof player.getPlayerState === 'function') playNext();
        }

        function updateBGMPlaybackSettings() {
            saveHostState();
            if (player && typeof player.setShuffle === 'function' && currentSong && currentSong.isBGM && currentSong.listId) {
                const bgmShuf = document.getElementById('bgm-shuffle');
                player.setShuffle(bgmShuf ? bgmShuf.checked : false);
                const bgmLoop = document.getElementById('bgm-loop');
                player.setLoop(bgmLoop ? bgmLoop.checked : false);
            }
        }

        function toggleLightMode() {
            isLightMode = !isLightMode;
            const container = document.getElementById('youtube-player-container');
            const btn = document.getElementById('btn-light-mode');
            if(isLightMode) {
                if(container) container.classList.add('youtube-hidden');
                if(btn) {
                    btn.innerHTML = '<i class="fa-solid fa-ban"></i> 映像OFF';
                    btn.classList.replace('bg-gray-800', 'bg-red-900');
                    btn.classList.replace('hover:bg-gray-700', 'hover:bg-red-800');
                    btn.classList.replace('border-gray-700', 'border-red-900');
                }
            } else {
                if(container) container.classList.remove('youtube-hidden');
                if(btn) {
                    btn.innerHTML = '<i class="fa-solid fa-video"></i> 映像ON';
                    btn.classList.replace('bg-red-900', 'bg-gray-800');
                    btn.classList.replace('hover:bg-red-800', 'hover:bg-gray-700');
                    btn.classList.replace('border-red-900', 'border-gray-700');
                }
            }
        }

        function updateUI() {
            const hostNpText = document.getElementById('host-now-playing');
            const hostNpReq = document.getElementById('host-now-requester');
            
            if(currentSong) {
                if(hostNpText) hostNpText.textContent = currentSong.title;
                if(hostNpReq) hostNpReq.textContent = currentSong.requester || "";
                document.querySelectorAll('.marquee-content').forEach(el => { el.style.animation = 'none'; el.offsetHeight; el.style.animation = null; });
            } else {
                if(hostNpText) hostNpText.textContent = "BGM停止中";
                if(hostNpReq) hostNpReq.textContent = "---";
            }

            const playBtn = document.getElementById('btn-host-play');
            if(playBtn && player && typeof player.getPlayerState === 'function') {
                const isPlaying = player.getPlayerState() === 1;
                playBtn.innerHTML = isPlaying 
                    ? `<i class="fa-solid fa-pause text-xs"></i>` 
                    : `<i class="fa-solid fa-play text-xs"></i>`;
            }

            const qList = document.getElementById('host-queue-list');
            if(qList) {
                qList.innerHTML = '';
                queue.forEach((q, idx) => {
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between bg-[#18181b] p-2 rounded-sm text-[10px] mb-1.5 shadow-sm border border-gray-800";
                    div.innerHTML = `
                        <div class="flex items-center gap-2 overflow-hidden">
                            <span class="text-gray-500 font-bold w-4 text-center">${idx+1}</span>
                            <div class="truncate">
                                <p class="text-white truncate font-bold text-[11px]">${q.title}</p>
                                <p class="text-[9px] text-gray-500 truncate"><i class="fa-solid fa-user"></i> ${q.requesterReal || q.requester} ${q.isRemote ? '(<i class="fa-solid fa-crown text-yellow-500"></i>)' : ''}</p>
                            </div>
                        </div>
                        <button onclick="removeQueue('${q.id}')" class="text-gray-600 hover:text-red-400 px-2 flex-shrink-0 transition-colors"><i class="fa-solid fa-xmark"></i></button>
                    `;
                    qList.appendChild(div);
                });
            }
            
            const qBadge = document.getElementById('queue-badge');
            if(qBadge) qBadge.textContent = queue.length;

            const hostHist = document.getElementById('host-history-list');
            if(hostHist) {
                hostHist.innerHTML = '';
                historyQueue.forEach((q, idx) => {
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between bg-[#18181b] border border-gray-800 p-2 rounded-sm text-[10px] mb-1.5 shadow-sm";
                    div.innerHTML = `
                        <div class="flex items-center gap-2 overflow-hidden flex-1">
                            <span class="text-gray-500 font-bold w-4 text-center">${idx+1}</span>
                            <div class="truncate">
                                <p class="text-gray-400 truncate font-bold text-[11px]">${q.title}</p>
                                <p class="text-[9px] text-gray-600 truncate"><i class="fa-solid fa-user"></i> ${q.requesterReal}</p>
                            </div>
                        </div>
                        <button onclick="reRequestHost('${q.videoId}', '${q.requesterReal}')" class="text-[9px] bg-gray-800 hover:bg-gray-700 text-indigo-400 border border-gray-700 px-2 py-1 rounded-sm flex-shrink-0 transition-colors shadow-sm"><i class="fa-solid fa-rotate-right"></i></button>
                    `;
                    hostHist.appendChild(div);
                });
            }

            const bList = document.getElementById('host-bgm-list');
            if(bList) {
                bList.innerHTML = '';
                bgmQueue.forEach((b, idx) => {
                    const div = document.createElement('div');
                    div.className = "flex justify-between bg-[#0e0e10] border border-gray-800 p-2 rounded-sm items-center mb-1 shadow-inner";
                    div.innerHTML = `
                        <span class="text-gray-300 truncate text-[10px] font-bold flex-1">${b.title || '取得中...'}</span>
                        <button onclick="removeBGM(${idx})" class="text-gray-600 hover:text-red-400 px-2 transition-colors"><i class="fa-solid fa-xmark text-xs"></i></button>
                    `;
                    bList.appendChild(div);
                });
            }

            renderChatList('host-chat-list', chatHistory);
            broadcastState();
        }

        function reRequestHost(videoId, reqName) {
            queue.push({ id: generateId(), videoId: videoId, title: "取得中...", requester: reqName, requesterReal: reqName, isAnon: false });
            showToast("再リクエストしました");
            updateUI();
            
            fetchYouTubeTitle(videoId).then(title => {
                const qItem = queue[queue.length - 1];
                if(qItem && qItem.videoId === videoId) { qItem.title = title; updateUI(); }
            });
            if(!currentSong || currentSong.isBGM) playNext();
        }

        function removeQueue(id) { queue = queue.filter(q => q.id !== id); saveHostState(); updateUI(); }
        function removeBGM(idx) { bgmQueue.splice(idx, 1); saveHostState(); updateUI(); }

    </script>
</body>
</html>
