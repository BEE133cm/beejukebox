<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remote Jukebox - Camera Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0e0e10; color: white; overscroll-behavior-y: none; margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .marquee-container { overflow: hidden; white-space: nowrap; position: relative; width: 100%; display: flex; }
        .marquee-content { 
            display: inline-block; 
            white-space: nowrap;
            padding-left: 100vw; 
            animation: marquee 15s linear infinite; 
        }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .toast {
            position: fixed; top: 20px; right: 20px; z-index: 9999;
            transform: translateX(150%); transition: transform 0.3s ease-in-out;
        }
        .toast.show { transform: translateX(0); }

        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 12px); }
    </style>
</head>
<body class="overflow-hidden relative h-[100dvh] flex flex-col bg-[#0e0e10]">

    <!-- トースト通知 -->
    <div id="toast" class="toast bg-gray-800 border-l-4 border-green-500 text-white p-4 rounded shadow-lg flex items-center gap-3 text-sm">
        <span id="toast-msg"></span>
    </div>

    <!-- パスワード入力モーダル -->
    <div id="password-modal" class="hidden fixed inset-0 z-[1000] bg-black/80 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-gray-900 border border-green-500 rounded-xl p-6 w-full max-w-sm shadow-2xl text-center">
            <h3 class="text-xl font-bold text-white mb-2"><i class="fa-solid fa-lock"></i> パスワードが必要です</h3>
            <p class="text-sm text-gray-400 mb-6">ホストが設定した管理パスワードを入力してください。</p>
            <input type="password" id="room-password-input" placeholder="管理パスワードを入力" class="w-full bg-gray-800 border border-gray-600 rounded p-3 text-white mb-2 outline-none focus:border-green-500">
            <p id="password-error" class="hidden text-red-500 text-xs mb-4">パスワードが間違っています</p>
            <div class="flex gap-3 mt-4">
                <button onclick="closePasswordModal()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 rounded-lg transition-colors">キャンセル</button>
                <button onclick="submitPassword()" class="flex-1 bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-lg transition-colors">接続する</button>
            </div>
        </div>
    </div>

    <!-- ================= 1. ポータル画面 (サーバーセレクト) ================= -->
    <div id="portal-view" class="flex flex-col items-center justify-center h-full p-4 bg-[#111827] absolute inset-0 z-[100]">
        <div class="w-full max-w-md bg-gray-900 border border-gray-700 p-6 rounded-2xl shadow-2xl">
            <div class="text-center mb-6 border-b border-gray-700 pb-4">
                <h2 class="text-xl font-bold text-white"><i class="fa-solid fa-camera text-green-400"></i> カメラ専用ポータル</h2>
                <p class="text-sm text-gray-400 mt-1">過去のルームを選ぶか、IDを入力して接続</p>
            </div>

            <h3 class="text-sm font-bold text-gray-300 mb-3"><i class="fa-regular fa-clock"></i> 過去に配信したルーム</h3>
            <div id="portal-history-list" class="flex flex-col gap-2 mb-6 max-h-48 overflow-y-auto">
                <!-- 履歴がここに入る -->
            </div>

            <div class="border-t border-gray-700 pt-4">
                <h3 class="text-sm font-bold text-gray-300 mb-3"><i class="fa-solid fa-plus"></i> 新しい部屋で配信する</h3>
                <div class="flex flex-col gap-3">
                    <input type="text" id="portal-room-id" placeholder="ルームIDを入力..." class="w-full bg-gray-800 text-white border border-gray-600 rounded p-3 outline-none focus:border-green-500">
                    <button onclick="joinFromPortal()" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-lg transition-colors">接続する</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= 7. カメラ送出用ビュー (新フルスクリーンUI) ================= -->
    <div id="camera-view" class="hidden fixed top-0 left-0 w-full h-[100dvh] z-50 bg-[#0e0e10] flex flex-col landscape:flex-row text-sm">
        
        <!-- 設定モーダル -->
        <div id="camera-settings-modal" class="hidden absolute inset-0 z-[60] bg-black/80 flex items-center justify-center backdrop-blur-sm px-4">
            <div class="bg-[#18181b] border border-gray-700 p-6 rounded-xl w-full max-w-sm space-y-6 shadow-2xl">
                <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                    <h3 class="text-white font-bold text-sm"><i class="fa-solid fa-gear"></i> 配信設定</h3>
                    <button onclick="document.getElementById('camera-settings-modal').classList.add('hidden')" class="text-gray-400 hover:text-white bg-gray-800 rounded-full w-6 h-6 flex items-center justify-center transition-colors"><i class="fa-solid fa-xmark"></i></button>
                </div>
                
                <div class="space-y-5">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1 font-bold"><i class="fa-solid fa-tv"></i> 画質 (解像度)</label>
                        <select id="cam-res" class="w-full bg-gray-800 text-white rounded p-2 text-sm border border-gray-600 outline-none focus:border-indigo-500 mb-3">
                            <option value="1920x1080">1080p (フルHD / 高画質・高負荷)</option>
                            <option value="1280x720" selected>720p (HD / 標準・おすすめ)</option>
                            <option value="854x480">480p (SD / 軽量・安定優先)</option>
                        </select>
                        
                        <label class="block text-xs text-gray-400 mb-1 font-bold mt-2"><i class="fa-solid fa-signal"></i> 最大ビットレート (kbps)</label>
                        <input type="number" id="cam-bitrate" value="2500" step="500" class="w-full bg-gray-800 text-white rounded p-2 text-sm border border-gray-600 outline-none focus:border-indigo-500" placeholder="例: 2500">
                        <p class="text-[10px] text-gray-500 mt-1 leading-tight">※数値を上げるとモザイクが減りますがパケット消費と発熱が増加します。</p>
                    </div>

                    <div class="border-t border-gray-800 pt-4">
                        <label class="block text-xs text-gray-400 mb-1 font-bold flex justify-between">
                            <span><i class="fa-solid fa-microphone"></i> マイク音量ブースト</span>
                            <span id="cam-mic-gain-val" class="text-white">1.0x</span>
                        </label>
                        <input type="range" id="cam-mic-gain" min="0" max="10" step="0.1" value="1" class="w-full accent-green-500" oninput="updateMicGain(this.value)">
                        <p class="text-[10px] text-gray-500 mt-1 leading-tight">※スマホ側の声が小さい場合のみ数値を上げてください。最大10倍。</p>
                    </div>

                    <div class="border-t border-gray-800 pt-4">
                        <label class="block text-xs text-gray-400 mb-1 font-bold flex justify-between">
                            <span><i class="fa-solid fa-desktop"></i> 共有画面の音量 (システム音)</span>
                            <span id="cam-sys-gain-val" class="text-white">100%</span>
                        </label>
                        <input type="range" id="cam-sys-gain" min="0" max="1" step="0.05" value="1" class="w-full accent-indigo-500" oninput="updateSysGain(this.value)">
                        <p class="text-[10px] text-gray-500 mt-1 leading-tight">※画面共有時のゲーム音やBGMの音量を調整します。</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- ========== 左ペイン: 映像とメーター (横画面時は左60%、縦画面時は上部) ========== -->
        <div class="flex flex-col w-full landscape:w-[60%] shrink-0 landscape:h-full bg-black relative border-b landscape:border-b-0 landscape:border-r border-gray-800 z-20">
            
            <!-- 1. 映像エリア (上に詰める) -->
            <div id="camera-video-container" class="relative w-full flex-1 bg-black flex flex-col justify-start overflow-hidden">
                
                <!-- ステータス ＆ NowPlaying 帯 (上部固定) -->
                <div class="absolute top-0 left-0 w-full bg-gradient-to-b from-black/90 to-transparent pt-1.5 pb-4 px-3 z-30 flex items-center gap-2 pointer-events-none">
                    <span id="camera-status" class="text-[11px] text-yellow-500 font-bold animate-pulse drop-shadow-md shrink-0">配信設定・待機中...</span>
                    <div class="marquee-container h-4 flex-1">
                        <div class="marquee-content font-bold text-white text-[11px] leading-tight flex items-center gap-2 drop-shadow-md">
                            <span id="camera-now-playing">待機中...</span>
                            <span id="camera-now-requester" class="text-indigo-300 font-normal"></span>
                        </div>
                    </div>
                </div>

                <!-- 映像 -->
                <video id="camera-preview" autoplay muted playsinline class="w-full aspect-video object-contain relative z-10 mt-6 transition-opacity duration-300"></video>
                
                <!-- 本当の映像OFFオーバーレイ -->
                <div id="camera-off-overlay" class="hidden absolute inset-0 bg-gray-900 flex flex-col items-center justify-center text-gray-500 font-bold gap-2 z-15 mt-6">
                    <span class="text-3xl"><i class="fa-solid fa-video-slash"></i></span>
                    <span class="text-sm">映像OFF (音声のみ配信中)</span>
                </div>
                
                <!-- ステルス用オーバーレイ (タップで解除) -->
                <div id="camera-stealth-overlay" class="hidden absolute inset-0 bg-black z-40 flex flex-col items-center justify-center text-gray-500 gap-3 mt-6 cursor-pointer" onclick="toggleStealthMode()">
                    <i class="fa-solid fa-eye-slash text-4xl"></i>
                    <span class="text-xs font-bold text-center">画面ステルス中<br>(タップで解除)</span>
                </div>

                <!-- カメラ切り替えボタン (右下) -->
                <button onclick="toggleCameraFacingMode()" id="btn-cam-switch" class="absolute bottom-3 right-3 z-30 bg-gray-800/80 hover:bg-gray-700 text-white w-10 h-10 rounded-full shadow-[0_0_10px_rgba(0,0,0,0.5)] flex items-center justify-center transition-transform active:scale-90 border border-gray-600">
                    <i class="fa-solid fa-camera-rotate text-lg"></i>
                </button>
            </div>

            <!-- 2. コントロールバー (黒帯) -->
            <div class="flex-shrink-0 bg-[#111827] border-t border-gray-800 px-2 py-2 flex items-center justify-between z-30 shadow-md">
                <!-- 配信前 -->
                <div id="camera-setup-controls" class="w-full flex items-center gap-2">
                    <button onclick="startCameraStream()" id="btn-cam-start" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded text-xs flex items-center justify-center gap-1 transition-transform active:scale-95">
                        <i class="fa-solid fa-camera"></i> カメラ配信
                    </button>
                    <button onclick="startScreenStream()" id="btn-screen-start" class="flex-1 bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 rounded text-xs flex items-center justify-center gap-1 transition-transform active:scale-95">
                        <i class="fa-solid fa-desktop"></i> 画面＋マイク
                    </button>
                    <button onclick="document.getElementById('camera-settings-modal').classList.remove('hidden')" class="w-8 h-8 rounded bg-gray-700 text-gray-300 flex items-center justify-center shadow transition-colors hover:bg-gray-600 hover:text-white shrink-0">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>
                <!-- 配信中 -->
                <div id="camera-active-controls" class="hidden w-full flex items-center gap-1">
                    <button onclick="toggleCameraMic()" id="btn-cam-mic" class="flex-1 bg-green-600 text-white font-bold py-2 rounded shadow flex justify-center items-center gap-1 text-[10px] transition-colors">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    <button onclick="toggleCameraVideo()" id="btn-cam-vid" class="flex-1 bg-green-600 text-white font-bold py-2 rounded shadow flex justify-center items-center gap-1 text-[10px] transition-colors">
                        <i class="fa-solid fa-video"></i>
                    </button>
                    <button onclick="toggleStealthMode()" id="btn-cam-stealth" class="flex-1 bg-gray-700 text-gray-300 font-bold py-2 rounded shadow flex justify-center items-center gap-1 text-[10px] transition-colors border border-gray-600">
                        <i class="fa-solid fa-eye-slash"></i> 隠す
                    </button>
                    <button onclick="refreshCameraStream()" class="flex-1 bg-indigo-600 text-white font-bold py-2 rounded shadow flex justify-center items-center gap-1 text-[10px] transition-colors">
                        <i class="fa-solid fa-rotate-right"></i> 更新
                    </button>
                    <button onclick="stopCameraStream()" class="flex-1 bg-red-600 text-white font-bold py-2 rounded shadow flex justify-center items-center gap-1 text-[10px] transition-colors">
                        <i class="fa-solid fa-stop"></i> 停止
                    </button>
                    <button onclick="document.getElementById('camera-settings-modal').classList.remove('hidden')" class="w-8 h-8 rounded bg-gray-700 text-gray-300 flex items-center justify-center shadow transition-colors hover:bg-gray-600 hover:text-white shrink-0">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>
            </div>

            <!-- 3. オーディオメーター -->
            <div class="w-full h-1.5 bg-gray-900 shrink-0 relative border-t border-gray-800">
                <canvas id="mic-meter" class="absolute inset-0 w-full h-full"></canvas>
            </div>
        </div>

        <!-- ========== 右ペイン: タブとコンテンツ (横画面時は右40%、縦画面時は下部) ========== -->
        <div class="flex-1 flex flex-col min-h-0 landscape:w-[40%] landscape:h-full bg-[#0e0e10] z-10">
            <!-- タブヘッダー -->
            <div class="flex bg-[#18181b] border-b border-gray-800 shrink-0 shadow-md z-10">
                <button onclick="switchCameraMenuTab('chat')" id="camera-menu-tab-chat" class="flex-1 py-2.5 text-[11px] font-bold text-indigo-400 border-b-2 border-indigo-500 transition-colors">💬 コメント</button>
                <button onclick="switchCameraMenuTab('users')" id="camera-menu-tab-users" class="flex-1 py-2.5 text-[11px] font-bold text-gray-500 border-b-2 border-transparent transition-colors">👥 参加者</button>
            </div>
            
            <!-- コンテンツエリア -->
            <div class="flex-1 relative overflow-hidden">
                <!-- 💬 コメント タブ -->
                <div id="camera-menu-content-chat" class="absolute inset-0 flex flex-col">
                    <div id="camera-chat-list" class="flex-1 p-3 space-y-3 overflow-y-auto pb-4 relative z-10"></div>
                </div>
                
                <!-- 👥 参加者 タブ -->
                <div id="camera-menu-content-users" class="hidden absolute inset-0 overflow-y-auto p-3 bg-[#111827] pb-12">
                    <div class="flex justify-between items-center border-b border-gray-800 pb-2 mb-3">
                        <h3 class="font-bold text-gray-200 text-xs">参加者管理 <span id="camera-participant-count" class="text-indigo-300 ml-1"></span></h3>
                    </div>
                    <div id="camera-participant-list" class="space-y-2"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let peer = null;
        let dataConn = null;
        let currentRoomId = null;
        let myId = null;
        let pendingConnection = null;
        let savedPasswords = JSON.parse(localStorage.getItem('jukebox_passwords')) || {};
        
        let isStreaming = false;
        
        let chatHistory = []; 
        let currentSong = null;

        // オーディオと映像設定
        let cameraStream = null; // 映像を含むメインストリーム
        let micStream = null;    // マイクのストリーム
        let sysStream = null;    // 画面共有(システム)のストリーム
        
        let isMicOn = true;
        let isVideoOn = true;
        
        let audioContext, analyser, meterDrawId;
        let microphoneSource = null;
        let systemAudioSource = null;
        let micGainNode = null;
        let sysGainNode = null;
        let outDestination = null;
        
        let camCall = null;
        let isStealthMode = false;

        let currentCamWidth = 1280;
        let currentCamHeight = 720;
        let currentBitrate = 2500;
        let currentFacingMode = 'environment';
        let currentStreamMode = 'camera'; // 'camera' or 'screen'

        function showToast(msg, type="info") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerHTML = msg;
            toast.className = `toast bg-gray-800 border-l-4 border-green-500 text-white p-4 rounded shadow-lg flex items-center gap-3 text-sm`;
            if (type === 'error') toast.classList.replace('border-green-500', 'border-red-500');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function generateId() { return Math.random().toString(36).substring(2, 9); }

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            if(params.has('cam') || params.has('host')) {
                currentRoomId = params.get('cam') || params.get('host');
                joinRoom(currentRoomId);
            } else {
                showPortal();
            }
        };

        function showView(viewId) {
            ['portal-view', 'camera-view'].forEach(id => {
                const el = document.getElementById(id);
                if(el) { el.classList.add('hidden'); el.classList.remove('flex'); }
            });
            const v = document.getElementById(viewId);
            if(v) {
                v.classList.remove('hidden');
                v.classList.add('flex');
            }
        }

        function showPortal() {
            showView('portal-view');
            renderPortalHistory();
            const url = new URL(window.location);
            url.searchParams.delete('cam');
            url.searchParams.delete('host');
            history.replaceState(null, '', url);
        }

        function renderPortalHistory() {
            const list = document.getElementById('portal-history-list');
            const history = JSON.parse(localStorage.getItem('jukebox_cam_history')) || [];
            
            if(history.length === 0) {
                list.innerHTML = '<p class="text-gray-500 text-center text-sm py-4">過去の配信履歴はありません</p>';
                return;
            }

            list.innerHTML = '';
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'bg-gray-800 p-3 rounded-lg flex justify-between items-center cursor-pointer hover:bg-gray-700 transition border border-transparent hover:border-green-500/50 mb-2';
                div.innerHTML = `
                    <div class="flex-1 min-w-0" onclick="joinFromPortalHistory('${item.roomId}')">
                        <div class="font-bold text-white text-sm truncate">${item.hostName || item.roomId}</div>
                        <div class="text-xs text-gray-400">ID: ${item.roomId}</div>
                    </div>
                    <button class="text-red-400 hover:text-red-300 p-2" onclick="deletePortalHistory('${item.roomId}', event)"><i class="fa-solid fa-xmark"></i></button>
                `;
                list.appendChild(div);
            });
        }

        function deletePortalHistory(roomId, event) {
            event.stopPropagation();
            let history = JSON.parse(localStorage.getItem('jukebox_cam_history')) || [];
            history = history.filter(h => h.roomId !== roomId);
            localStorage.setItem('jukebox_cam_history', JSON.stringify(history));
            renderPortalHistory();
            showToast("履歴を削除しました");
        }

        function saveCamHistory(roomId, hostName) {
            if(!roomId) return;
            let history = JSON.parse(localStorage.getItem('jukebox_cam_history')) || [];
            history = history.filter(h => h.roomId !== roomId);
            history.unshift({ roomId: roomId, hostName: hostName || roomId, time: Date.now() });
            if(history.length > 10) history = history.slice(0, 10);
            localStorage.setItem('jukebox_cam_history', JSON.stringify(history));
        }

        function joinFromPortalHistory(roomId) {
            document.getElementById('portal-room-id').value = roomId;
            joinFromPortal();
        }

        function joinFromPortal() {
            const roomId = document.getElementById('portal-room-id').value.trim();
            if(!roomId) return showToast("ルームIDを入力してください", "error");
            joinRoom(roomId);
        }

        function joinRoom(roomId) {
            currentRoomId = roomId;
            showView('camera-view');
            
            initCamera();
            
            const url = new URL(window.location);
            url.searchParams.set('cam', currentRoomId);
            history.replaceState(null, '', url);
        }

        // タブ切り替え
        function switchCameraMenuTab(tabId) {
            ['chat', 'users'].forEach(id => {
                document.getElementById('camera-menu-content-' + id).classList.add('hidden');
                const btn = document.getElementById('camera-menu-tab-' + id);
                if (btn) {
                    btn.classList.remove('text-indigo-400', 'border-indigo-500');
                    btn.classList.add('text-gray-500', 'border-transparent');
                }
            });
            document.getElementById('camera-menu-content-' + tabId).classList.remove('hidden');
            const activeBtn = document.getElementById('camera-menu-tab-' + tabId);
            if (activeBtn) {
                activeBtn.classList.add('text-indigo-400', 'border-indigo-500');
                activeBtn.classList.remove('text-gray-500', 'border-transparent');
            }
            if(tabId === 'chat') {
                const chatList = document.getElementById('camera-chat-list');
                if(chatList) chatList.scrollTop = chatList.scrollHeight;
            }
        }

        // パスワード処理
        function showPasswordModal() {
            document.getElementById('password-modal').classList.remove('hidden');
            document.getElementById('room-password-input').value = '';
            document.getElementById('password-error').classList.add('hidden');
        }
        function hidePasswordModal() { document.getElementById('password-modal').classList.add('hidden'); }
        function closePasswordModal() {
            hidePasswordModal();
            showToast("接続をキャンセルしました", "error");
            if (dataConn) dataConn.close();
            showPortal();
        }
        function submitPassword() {
            const pwd = document.getElementById('room-password-input').value;
            if (!pwd) {
                const err = document.getElementById('password-error');
                err.textContent = "パスワードを入力してください";
                err.classList.remove('hidden');
                return;
            }
            document.getElementById('password-error').classList.add('hidden');
            if (pendingConnection) {
                pendingConnection.send({ type: 'auth_request', password: pwd });
            }
        }

        // PeerJS初期化と接続処理
        function initCamera() {
            document.getElementById('camera-status').textContent = "ホストに接続・認証中...";
            document.getElementById('camera-status').classList.replace('text-green-500', 'text-yellow-500');
            
            // とりあえずプレビューだけ表示 (配信はしない)
            navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: true })
                .then(stream => {
                    cameraStream = stream;
                    micStream = stream; // プレビュー段階では同じストリームを扱う
                    sysStream = null;
                    document.getElementById('camera-preview').srcObject = stream;
                    setupAudioMixer();
                })
                .catch(err => {
                    showToast("カメラ/マイクが取得できませんでした", "error");
                    document.getElementById('camera-status').textContent = "エラーが発生しました";
                });

            if(!peer || peer.destroyed) {
                myId = `cam-${generateId()}`;
                peer = new Peer(myId);
            }
            
            if(!dataConn || !dataConn.open) {
                peer.on('open', () => setupCameraConnection());
                if(peer.open) setupCameraConnection();
            } else {
                setupCameraConnection();
            }
        }

        function setupCameraConnection() {
            if(!dataConn || !dataConn.open) dataConn = peer.connect(`jukebox-${currentRoomId}`);
            
            pendingConnection = dataConn;

            dataConn.on('data', (data) => {
                if (data.type === 'ping') {
                    dataConn.send({ type: 'pong' });
                    return;
                }
                
                if (data.type === 'sync_playback') {
                    if (data.videoId && data.videoId !== (currentSong ? currentSong.videoId : "")) {
                        currentSong = { videoId: data.videoId };
                    }
                }
                
                if (data.type === 'state') {
                    saveCamHistory(currentRoomId, data.hostName);
                    
                    if (data.requirePassword) {
                        const savedPwd = savedPasswords[currentRoomId];
                        if (savedPwd) {
                            dataConn.send({ type: 'auth_request', password: savedPwd });
                        } else {
                            showPasswordModal();
                        }
                    } else {
                        cameraReadyToStart();
                    }

                    if(data.currentSong) currentSong = data.currentSong;
                    const playingEl = document.getElementById('camera-now-playing');
                    if(currentSong && playingEl) {
                        playingEl.textContent = currentSong.title;
                        const reqName = currentSong.isAnon ? '184(匿名)' : (currentSong.requester || "");
                        document.getElementById('camera-now-requester').innerHTML = reqName ? `- <i class="fa-solid fa-user"></i> ${reqName}` : "";
                    } else if (playingEl) {
                        playingEl.textContent = "BGM停止中";
                        document.getElementById('camera-now-requester').textContent = "";
                    }

                    if (data.chatHistory) {
                        chatHistory = data.chatHistory;
                        renderChatList('camera-chat-list', chatHistory, true);
                    }
                    if (data.participants) {
                        window.remoteReceivedParticipants = data.participants;
                        renderParticipantList(document.getElementById('camera-participant-list'));
                    }

                } else if (data.type === 'auth_response') {
                    if (data.success) {
                        hidePasswordModal();
                        showToast("カメラ認証に成功しました");
                        const pwdInput = document.getElementById('room-password-input').value;
                        if (pwdInput) {
                            savedPasswords[currentRoomId] = pwdInput;
                            localStorage.setItem('jukebox_passwords', JSON.stringify(savedPasswords));
                        }
                        cameraReadyToStart();
                    } else {
                        document.getElementById('password-error').classList.remove('hidden');
                        delete savedPasswords[currentRoomId];
                        localStorage.setItem('jukebox_passwords', JSON.stringify(savedPasswords));
                        showPasswordModal();
                    }
                } else if (data.type === 'new_chat') {
                    if(!chatHistory.some(c => c.id === data.chat.id)) {
                        chatHistory.push(data.chat);
                        if(chatHistory.length > 100) chatHistory.shift();
                        renderChatList('camera-chat-list', chatHistory, true);
                    }
                }
            });
        }

        function cameraReadyToStart() {
            pendingConnection = null;
            if(!isStreaming) {
                document.getElementById('camera-status').textContent = "配信準備完了 (設定をしてスタート)";
                document.getElementById('camera-status').classList.replace('text-yellow-500', 'text-green-500');
            }
        }

        // カメラとマイク・画面共有の制御
        function applyCameraSettings() {
            const res = document.getElementById('cam-res').value.split('x');
            currentCamWidth = parseInt(res[0]);
            currentCamHeight = parseInt(res[1]);
            currentBitrate = parseInt(document.getElementById('cam-bitrate').value) || 2500;
        }

        function updateMicGain(val) {
            const displayVal = parseFloat(val).toFixed(1) + 'x';
            document.getElementById('cam-mic-gain-val').textContent = displayVal;
            if (micGainNode) {
                micGainNode.gain.value = parseFloat(val);
            }
        }

        function updateSysGain(val) {
            const displayVal = Math.round(val * 100) + '%';
            document.getElementById('cam-sys-gain-val').textContent = displayVal;
            if (sysGainNode) {
                sysGainNode.gain.value = parseFloat(val);
            }
        }

        function setupAudioMixer() {
            try {
                if(!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if(audioContext.state === 'suspended') audioContext.resume();
                
                // クリーンアップ
                if(analyser) analyser.disconnect();
                if(microphoneSource) microphoneSource.disconnect();
                if(systemAudioSource) systemAudioSource.disconnect();
                if(micGainNode) micGainNode.disconnect();
                if(sysGainNode) sysGainNode.disconnect();
                
                analyser = audioContext.createAnalyser();
                outDestination = audioContext.createMediaStreamDestination();
                
                // マイクのルーティング
                if (micStream && micStream.getAudioTracks().length > 0) {
                    microphoneSource = audioContext.createMediaStreamSource(micStream);
                    micGainNode = audioContext.createGain();
                    const currentMicGain = document.getElementById('cam-mic-gain') ? parseFloat(document.getElementById('cam-mic-gain').value) : 1.0;
                    micGainNode.gain.value = currentMicGain;
                    
                    microphoneSource.connect(micGainNode);
                    micGainNode.connect(outDestination);
                    micGainNode.connect(analyser); // メーター用
                }

                // 共有画面(システム)の音声のルーティング
                if (sysStream && sysStream.getAudioTracks().length > 0) {
                    systemAudioSource = audioContext.createMediaStreamSource(sysStream);
                    sysGainNode = audioContext.createGain();
                    const currentSysGain = document.getElementById('cam-sys-gain') ? parseFloat(document.getElementById('cam-sys-gain').value) : 1.0;
                    sysGainNode.gain.value = currentSysGain;
                    
                    systemAudioSource.connect(sysGainNode);
                    sysGainNode.connect(outDestination);
                    sysGainNode.connect(analyser); // メーター用 (ミックスして表示)
                }
                
                analyser.fftSize = 256;
                if(!meterDrawId) drawMicMeter();
            } catch(e) { console.error("Audio processing setup error:", e); }
        }

        function drawMicMeter() {
            const canvas = document.getElementById('mic-meter');
            if(!canvas || !analyser) return;
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            const ctx = canvas.getContext('2d');
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            
            function draw() {
                meterDrawId = requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for(let i = 0; i < bufferLength; i++) sum += dataArray[i];
                let width = ((sum / bufferLength) / 128) * canvas.width; 
                if(!isMicOn) width = 0;
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let grad = ctx.createLinearGradient(0, 0, canvas.width, 0);
                grad.addColorStop(0, '#22c55e'); grad.addColorStop(0.7, '#eab308'); grad.addColorStop(1, '#ef4444'); 
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, canvas.height);
            }
            draw();
        }

        function getProcessedStream() {
            if (outDestination && cameraStream) {
                const audioTracks = outDestination.stream.getAudioTracks();
                const videoTracks = cameraStream.getVideoTracks();
                if (audioTracks.length > 0 && videoTracks.length > 0) {
                    return new MediaStream([videoTracks[0], audioTracks[0]]);
                }
            }
            return cameraStream;
        }

        function applyBitrate(call, bitrateKbps) {
            if(!call || !call.peerConnection) return;
            const senders = call.peerConnection.getSenders();
            const videoSender = senders.find(s => s.track && s.track.kind === 'video');
            if (videoSender) {
                const params = videoSender.getParameters();
                if (!params.encodings) params.encodings = [{}];
                params.encodings[0].maxBitrate = bitrateKbps * 1000;
                videoSender.setParameters(params).catch(e => console.log("Bitrate error:", e));
            }
        }

        function startCameraStream() {
            applyCameraSettings();
            
            if(cameraStream) cameraStream.getTracks().forEach(t=>t.stop());
            if(micStream && micStream !== cameraStream) micStream.getTracks().forEach(t=>t.stop());
            if(sysStream && sysStream !== cameraStream) sysStream.getTracks().forEach(t=>t.stop());
            
            document.getElementById('camera-status').textContent = "配信を開始しています...";
            document.getElementById('camera-status').classList.replace('text-green-500', 'text-yellow-500');

            navigator.mediaDevices.getUserMedia({
                video: { facingMode: currentFacingMode, width: { ideal: currentCamWidth }, height: { ideal: currentCamHeight } },
                audio: true
            }).then(stream => {
                currentStreamMode = 'camera';
                cameraStream = stream;
                micStream = stream; // カメラ配信の時は1つのストリームに両方入る
                sysStream = null;
                
                const videoTrack = cameraStream.getVideoTracks()[0];
                if (videoTrack && 'contentHint' in videoTrack) videoTrack.contentHint = 'detail';

                document.getElementById('camera-preview').srcObject = stream;
                setupAudioMixer();

                executeCamCall(currentBitrate);

            }).catch(err => {
                showToast("カメラの取得に失敗しました", "error");
                document.getElementById('camera-status').textContent = "エラーが発生しました";
            });
        }

        function startScreenStream() {
            applyCameraSettings();
            
            if(cameraStream) cameraStream.getTracks().forEach(t=>t.stop());
            if(micStream && micStream !== cameraStream) micStream.getTracks().forEach(t=>t.stop());
            if(sysStream && sysStream !== cameraStream) sysStream.getTracks().forEach(t=>t.stop());
            
            document.getElementById('camera-status').textContent = "画面共有＋マイクを開始しています...";
            document.getElementById('camera-status').classList.replace('text-green-500', 'text-yellow-500');

            // 画面共有とマイクを同時に要求する
            Promise.all([
                navigator.mediaDevices.getDisplayMedia({
                    video: { width: { ideal: currentCamWidth }, height: { ideal: currentCamHeight } },
                    audio: { systemAudio: "include" }
                }).catch(e => { throw new Error("Screen share cancelled"); }),
                navigator.mediaDevices.getUserMedia({ audio: true }).catch(e => {
                    showToast("マイクが取得できませんでした (共有音のみ)", "info");
                    return null;
                })
            ]).then(([dispStream, mStream]) => {
                currentStreamMode = 'screen';
                cameraStream = dispStream;
                sysStream = dispStream;
                micStream = mStream; // マイクが拒否された場合は null
                
                const videoTrack = cameraStream.getVideoTracks()[0];
                if (videoTrack) {
                    videoTrack.onended = () => { if (isStreaming) stopCameraStream(); };
                }

                document.getElementById('camera-preview').srcObject = cameraStream;
                setupAudioMixer();

                executeCamCall(currentBitrate);

            }).catch(err => {
                showToast("画面共有がキャンセルされました", "error");
                document.getElementById('camera-status').textContent = "配信準備完了";
                document.getElementById('camera-status').classList.replace('text-yellow-500', 'text-green-500');
            });
        }
        
        function executeCamCall(bitrate) {
            document.getElementById('camera-status').innerHTML = '<i class="fa-solid fa-circle text-red-500 animate-pulse"></i> 映像＋音声 配信中！';
            document.getElementById('camera-status').classList.replace('text-yellow-500', 'text-red-500');
            document.getElementById('camera-setup-controls').classList.add('hidden');
            document.getElementById('camera-active-controls').classList.remove('hidden');
            
            const streamToSend = getProcessedStream();
            camCall = peer.call(`jukebox-${currentRoomId}`, streamToSend);
            setTimeout(() => applyBitrate(camCall, bitrate), 1000);
            
            isStreaming = true;
        }

        function refreshCameraStream() {
            showToast("映像・音声をリフレッシュ中...");
            if(camCall) camCall.close();
            
            applyCameraSettings();
            if(cameraStream) cameraStream.getTracks().forEach(t=>t.stop());
            if(micStream && micStream !== cameraStream) micStream.getTracks().forEach(t=>t.stop());
            if(sysStream && sysStream !== cameraStream) sysStream.getTracks().forEach(t=>t.stop());

            if (currentStreamMode === 'screen') {
                Promise.all([
                    navigator.mediaDevices.getDisplayMedia({
                        video: { width: { ideal: currentCamWidth }, height: { ideal: currentCamHeight } },
                        audio: { systemAudio: "include" }
                    }),
                    navigator.mediaDevices.getUserMedia({ audio: true }).catch(e => null)
                ]).then(([dispStream, mStream]) => {
                    cameraStream = dispStream;
                    sysStream = dispStream;
                    micStream = mStream;
                    
                    const videoTrack = cameraStream.getVideoTracks()[0];
                    if (videoTrack) {
                        videoTrack.onended = () => { if (isStreaming) stopCameraStream(); };
                    }
                    document.getElementById('camera-preview').srcObject = cameraStream;
                    setupAudioMixer();
                    
                    const streamToSend = getProcessedStream();
                    camCall = peer.call(`jukebox-${currentRoomId}`, streamToSend);
                    setTimeout(() => applyBitrate(camCall, currentBitrate), 1000);
                    showToast("更新しました！", "info");
                }).catch(e => {
                    showToast("更新エラー: " + e, "error");
                    stopCameraStream();
                });
            } else {
                navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode, width: { ideal: currentCamWidth }, height: { ideal: currentCamHeight } },
                    audio: true
                }).then(stream => {
                    cameraStream = stream;
                    micStream = stream;
                    sysStream = null;
                    const videoTrack = cameraStream.getVideoTracks()[0];
                    if (videoTrack && 'contentHint' in videoTrack) videoTrack.contentHint = 'detail';

                    document.getElementById('camera-preview').srcObject = stream;
                    setupAudioMixer();
                    
                    const streamToSend = getProcessedStream();
                    camCall = peer.call(`jukebox-${currentRoomId}`, streamToSend);
                    setTimeout(() => applyBitrate(camCall, currentBitrate), 1000);
                    showToast("更新しました！", "info");
                }).catch(e => {
                    showToast("更新エラー: " + e, "error");
                });
            }
        }

        function stopCameraStream() {
            if(camCall) { camCall.close(); camCall = null; }
            if(dataConn && dataConn.open) dataConn.send({type: 'camera_stop'});

            if(cameraStream) cameraStream.getTracks().forEach(t=>t.stop());
            if(micStream && micStream !== cameraStream) micStream.getTracks().forEach(t=>t.stop());
            if(sysStream && sysStream !== cameraStream) sysStream.getTracks().forEach(t=>t.stop());

            document.getElementById('camera-status').innerHTML = '<i class="fa-solid fa-stop text-green-500"></i> 配信停止 (設定して再スタート可能)';
            document.getElementById('camera-status').classList.replace('text-red-500', 'text-green-500');
            showToast("配信を停止しました");
            document.getElementById('camera-setup-controls').classList.remove('hidden');
            document.getElementById('camera-active-controls').classList.add('hidden');
            if(isStealthMode) toggleStealthMode();
            
            isStreaming = false;
        }

        function toggleCameraMic() {
            if(!micStream) return;
            isMicOn = !isMicOn;
            const audioTracks = micStream.getAudioTracks();
            if(audioTracks.length > 0) audioTracks[0].enabled = isMicOn;
            const btn = document.getElementById('btn-cam-mic');
            btn.innerHTML = isMicOn ? '<i class="fa-solid fa-microphone"></i>' : '<i class="fa-solid fa-microphone-slash"></i>';
            btn.classList.toggle('bg-green-600', isMicOn);
            btn.classList.toggle('bg-gray-600', !isMicOn);
        }

        function toggleCameraVideo() {
            if(!cameraStream) return;
            isVideoOn = !isVideoOn;
            const videoTracks = cameraStream.getVideoTracks();
            if(videoTracks.length > 0) videoTracks[0].enabled = isVideoOn;
            const btn = document.getElementById('btn-cam-vid');
            btn.innerHTML = isVideoOn ? '<i class="fa-solid fa-video"></i>' : '<i class="fa-solid fa-video-slash"></i>';
            btn.classList.toggle('bg-green-600', isVideoOn);
            btn.classList.toggle('bg-gray-600', !isVideoOn);
            document.getElementById('camera-off-overlay').classList.toggle('hidden', isVideoOn);
        }

        function toggleCameraFacingMode() {
            if (currentStreamMode === 'screen') {
                showToast("画面共有中はカメラの切り替えはできません", "error");
                return;
            }
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            if (camCall) {
                refreshCameraStream();
            } else {
                navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode, width: { ideal: currentCamWidth }, height: { ideal: currentCamHeight } },
                    audio: true
                }).then(stream => {
                    if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
                    cameraStream = stream;
                    micStream = stream;
                    const videoTrack = cameraStream.getVideoTracks()[0];
                    if (videoTrack && 'contentHint' in videoTrack) videoTrack.contentHint = 'detail';
                    document.getElementById('camera-preview').srcObject = stream;
                    setupAudioMixer();
                }).catch(err => {
                    showToast("カメラの切り替えに失敗しました", "error");
                });
            }
        }

        function toggleStealthMode() {
            isStealthMode = !isStealthMode;
            const video = document.getElementById('camera-preview');
            const overlay = document.getElementById('camera-stealth-overlay');
            const btn = document.getElementById('btn-cam-stealth');
            
            if (isStealthMode) {
                video.classList.add('opacity-0');
                overlay.classList.remove('hidden');
                btn.classList.replace('bg-gray-700', 'bg-red-700');
                btn.classList.replace('text-gray-300', 'text-white');
                btn.innerHTML = '<i class="fa-solid fa-eye"></i> 見る';
                showToast("画面を隠蔽しました（配信は継続中）");
            } else {
                video.classList.remove('opacity-0');
                overlay.classList.add('hidden');
                btn.classList.replace('bg-red-700', 'bg-gray-700');
                btn.classList.replace('text-white', 'text-gray-300');
                btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i> 隠す';
                showToast("画面を表示しました");
            }
        }

        function renderChatList(containerId, chats, isPrivileged) {
            const container = document.getElementById(containerId);
            if(!container) return;

            container.innerHTML = '';
            chats.forEach(c => {
                const div = document.createElement('div');
                div.className = "text-[13px] leading-relaxed flex group";
                
                const dispName = (c.isAnon && !isPrivileged) ? '184(匿名)' : c.senderReal;
                const badge = c.isRemote ? '<i class="fa-solid fa-crown text-yellow-400"></i> ' : '';
                const nameColor = c.isRemote ? 'text-yellow-400' : 'text-indigo-400';
                
                div.innerHTML = `
                    <div class="flex-1 break-words">
                        <span class="font-bold ${nameColor} mr-1">${badge}${dispName}:</span>
                        <span class="text-gray-100">${c.text}</span>
                    </div>
                `;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function renderParticipantList(container) {
            if(!container) return;
            container.innerHTML = '';
            const list = window.remoteReceivedParticipants || [];
            let validParticipantCount = 0;

            list.forEach(p => {
                if(p.isObs || p.isCam) return; 
                validParticipantCount++;
                const div = document.createElement('div');
                div.className = "flex items-center justify-between bg-gray-700 p-2 rounded text-sm mb-1";
                
                let nameLabel = p.name;
                if(p.isRemote) nameLabel += ' <span class="text-xs text-yellow-400">(<i class="fa-solid fa-crown text-yellow-400"></i>)</span>';
                if(p.isMuted) nameLabel += ' <span class="text-xs text-red-400"><i class="fa-solid fa-volume-xmark"></i>ミュート</span>';

                div.innerHTML = `<div class="truncate flex-1"><span class="text-gray-200">${nameLabel}</span></div>`;
                container.appendChild(div);
            });

            const countEl = document.getElementById('camera-participant-count');
            if (countEl) countEl.textContent = `(現在: ${validParticipantCount}人)`;
        }

    </script>
</body>
