<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remote Jukebox - Camera Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0e0e10; color: white; overscroll-behavior-y: none; margin: 0; padding: 0; }
        
        .toast {
            position: fixed; top: 20px; right: 20px; z-index: 9999;
            transform: translateX(150%); transition: transform 0.3s ease-in-out;
        }
        .toast.show { transform: translateX(0); }

        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }

        .btn-active {
            background-color: #ef4444 !important; /* red-500 */
            color: white !important;
        }
    </style>
</head>
<body class="overflow-hidden relative h-[100dvh] flex flex-col bg-[#0e0e10]">

    <!-- トースト通知 -->
    <div id="toast" class="toast bg-gray-800 border-l-4 border-green-500 text-white p-4 rounded shadow-lg flex items-center gap-3 text-sm">
        <span id="toast-msg"></span>
    </div>

    <!-- パスワード入力モーダル -->
    <div id="password-modal" class="hidden fixed inset-0 z-[1000] bg-black/80 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-gray-900 border border-green-500 rounded-xl p-6 w-full max-w-sm shadow-2xl text-center">
            <h3 class="text-xl font-bold text-white mb-2"><i class="fa-solid fa-lock"></i> パスワードが必要です</h3>
            <p class="text-sm text-gray-400 mb-6">ホストが設定した管理パスワードを入力してください。</p>
            <input type="password" id="room-password-input" placeholder="管理パスワードを入力" class="w-full bg-gray-800 border border-gray-600 rounded p-3 text-white mb-2 outline-none focus:border-green-500">
            <p id="password-error" class="hidden text-red-500 text-xs mb-4">パスワードが間違っています</p>
            <div class="flex gap-3 mt-4">
                <button onclick="closePasswordModal()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 rounded-lg transition-colors">キャンセル</button>
                <button onclick="submitPassword()" class="flex-1 bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-lg transition-colors">接続する</button>
            </div>
        </div>
    </div>

    <!-- ================= 1. ポータル画面 (サーバーセレクト) ================= -->
    <div id="portal-view" class="flex flex-col items-center justify-center h-full p-4 bg-[#111827] absolute inset-0 z-[100]">
        <div class="w-full max-w-md bg-gray-900 border border-gray-700 p-6 rounded-2xl shadow-2xl">
            <div class="text-center mb-6 border-b border-gray-700 pb-4">
                <h2 class="text-xl font-bold text-white"><i class="fa-solid fa-camera text-green-400"></i> カメラ専用ポータル</h2>
                <p class="text-sm text-gray-400 mt-1">過去のルームを選ぶか、IDを入力して接続</p>
            </div>

            <h3 class="text-sm font-bold text-gray-300 mb-3"><i class="fa-regular fa-clock"></i> 過去に配信したルーム</h3>
            <div id="portal-history-list" class="flex flex-col gap-2 mb-6 max-h-48 overflow-y-auto">
                <!-- 履歴がここに入る -->
            </div>

            <div class="border-t border-gray-700 pt-4">
                <h3 class="text-sm font-bold text-gray-300 mb-3"><i class="fa-solid fa-plus"></i> 新しい部屋で配信する</h3>
                <div class="flex flex-col gap-3">
                    <input type="text" id="portal-room-id" placeholder="ルームIDを入力..." class="w-full bg-gray-800 text-white border border-gray-600 rounded p-3 outline-none focus:border-green-500">
                    <button onclick="joinFromPortal()" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-lg transition-colors">接続する</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= 2. カメラビュー全体 ================= -->
    <div id="camera-view" class="hidden flex-col h-full w-full relative z-10">
        <!-- ヘッダー -->
        <div class="bg-[#18181b] border-b border-gray-800 p-4 flex justify-between items-center z-20 shadow-md flex-shrink-0">
            <div class="flex items-center gap-3">
                <button onclick="disconnectAndGoToPortal()" class="text-gray-400 hover:text-white bg-gray-800 w-8 h-8 rounded-full flex items-center justify-center shadow transition-colors" title="ポータルに戻る"><i class="fa-solid fa-chevron-left"></i></button>
                <div>
                    <h1 class="text-white font-bold text-lg flex items-center gap-2">
                        <i class="fa-solid fa-camera text-green-400"></i> カメラポータル
                    </h1>
                    <p class="text-xs text-gray-400 mt-0.5">ルームID: <span id="display-room-id" class="font-mono text-gray-300"></span></p>
                </div>
            </div>
            <div id="status-indicator" class="text-xs font-bold text-yellow-500 bg-yellow-500/10 px-3 py-1.5 rounded-full flex items-center gap-1.5 border border-yellow-500/30">
                <span class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse" id="status-dot"></span>
                <span id="status-text">接続中...</span>
            </div>
        </div>

        <!-- 映像プレビューエリア -->
        <div class="flex-1 relative bg-black flex items-center justify-center overflow-hidden">
            <video id="local-video" autoplay playsinline muted class="w-full h-full object-contain"></video>
            <!-- 初期表示 / エラー時オーバーレイ -->
            <div id="video-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/80 z-10 text-center p-4">
                <i class="fa-solid fa-video-slash text-4xl text-gray-600 mb-4"></i>
                <p id="video-overlay-text" class="text-gray-400 text-sm">カメラへのアクセスを許可してください</p>
            </div>
        </div>

        <!-- コントロールバー -->
        <div class="bg-[#18181b] border-t border-gray-800 p-5 pb-safe flex justify-center gap-8 z-20 flex-shrink-0 relative">
            <!-- マイクボタン -->
            <button id="btn-audio" onclick="toggleAudio()" class="w-14 h-14 rounded-full bg-gray-700 hover:bg-gray-600 text-white flex items-center justify-center text-xl transition-all shadow-lg active:scale-95" title="マイクのON/OFF">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <!-- 配信停止・開始ボタン -->
            <button id="btn-stream" onclick="toggleStream()" class="w-16 h-16 rounded-full bg-red-600 hover:bg-red-500 text-white flex items-center justify-center text-2xl transition-all shadow-[0_0_15px_rgba(220,38,38,0.4)] active:scale-95" title="配信の開始/停止">
                <i class="fa-solid fa-stop"></i>
            </button>
            <!-- ビデオボタン -->
            <button id="btn-video" onclick="toggleVideo()" class="w-14 h-14 rounded-full bg-gray-700 hover:bg-gray-600 text-white flex items-center justify-center text-xl transition-all shadow-lg active:scale-95" title="カメラのON/OFF">
                <i class="fa-solid fa-video"></i>
            </button>
            <!-- カメラ反転ボタン (モバイルなど複数カメラがある場合) -->
            <button id="btn-switch-cam" onclick="switchCamera()" class="absolute right-6 bottom-[max(20px,env(safe-area-inset-bottom))] w-10 h-10 rounded-full bg-gray-800 border border-gray-600 text-gray-300 flex items-center justify-center text-sm transition-colors hover:bg-gray-700 hover:text-white" title="カメラ切り替え">
                <i class="fa-solid fa-rotate"></i>
            </button>
        </div>
    </div>

    <script>
        let peer = null;
        let dataConn = null;
        let mediaConn = null;
        let currentRoomId = null;
        let myId = null;
        let pendingConnection = null;
        let savedPasswords = JSON.parse(localStorage.getItem('jukebox_passwords')) || {};
        
        let localStream = null;
        let isAudioEnabled = true;
        let isVideoEnabled = true;
        let facingMode = 'user'; // 'user' (フロント) or 'environment' (リア)
        let isStreaming = false;

        function showToast(msg, type="info") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerHTML = msg;
            toast.className = `toast bg-gray-800 border-l-4 border-green-500 text-white p-4 rounded shadow-lg flex items-center gap-3 text-sm`;
            if (type === 'error') toast.classList.replace('border-green-500', 'border-red-500');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function generateId() { return Math.random().toString(36).substring(2, 9); }

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            if(params.has('cam') || params.has('host')) {
                currentRoomId = params.get('cam') || params.get('host');
                joinRoom(currentRoomId);
            } else {
                showPortal();
            }
        };

        function showView(viewId) {
            ['portal-view', 'camera-view'].forEach(id => {
                const el = document.getElementById(id);
                if(el) { el.classList.add('hidden'); el.classList.remove('flex'); }
            });
            const v = document.getElementById(viewId);
            if(v) {
                v.classList.remove('hidden');
                v.classList.add('flex');
            }
        }

        function showPortal() {
            showView('portal-view');
            renderPortalHistory();
            const url = new URL(window.location);
            url.searchParams.delete('cam');
            url.searchParams.delete('host');
            history.replaceState(null, '', url);
        }

        function renderPortalHistory() {
            const list = document.getElementById('portal-history-list');
            const history = JSON.parse(localStorage.getItem('jukebox_cam_history')) || [];
            
            if(history.length === 0) {
                list.innerHTML = '<p class="text-gray-500 text-center text-sm py-4">過去の配信履歴はありません</p>';
                return;
            }

            list.innerHTML = '';
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'bg-gray-800 p-3 rounded-lg flex justify-between items-center cursor-pointer hover:bg-gray-700 transition border border-transparent hover:border-green-500/50 mb-2';
                div.innerHTML = `
                    <div class="flex-1 min-w-0" onclick="joinFromPortalHistory('${item.roomId}')">
                        <div class="font-bold text-white text-sm truncate">${item.hostName || item.roomId}</div>
                        <div class="text-xs text-gray-400">ID: ${item.roomId}</div>
                    </div>
                    <button class="text-red-400 hover:text-red-300 p-2" onclick="deletePortalHistory('${item.roomId}', event)"><i class="fa-solid fa-xmark"></i></button>
                `;
                list.appendChild(div);
            });
        }

        function deletePortalHistory(roomId, event) {
            event.stopPropagation();
            let history = JSON.parse(localStorage.getItem('jukebox_cam_history')) || [];
            history = history.filter(h => h.roomId !== roomId);
            localStorage.setItem('jukebox_cam_history', JSON.stringify(history));
            renderPortalHistory();
            showToast("履歴を削除しました");
        }

        function saveCamHistory(roomId, hostName) {
            if(!roomId) return;
            let history = JSON.parse(localStorage.getItem('jukebox_cam_history')) || [];
            history = history.filter(h => h.roomId !== roomId);
            history.unshift({ roomId: roomId, hostName: hostName || roomId, time: Date.now() });
            if(history.length > 10) history = history.slice(0, 10);
            localStorage.setItem('jukebox_cam_history', JSON.stringify(history));
        }

        function joinFromPortalHistory(roomId) {
            document.getElementById('portal-room-id').value = roomId;
            joinFromPortal();
        }

        function joinFromPortal() {
            const roomId = document.getElementById('portal-room-id').value.trim();
            if(!roomId) return showToast("ルームIDを入力してください", "error");
            joinRoom(roomId);
        }

        function joinRoom(roomId) {
            currentRoomId = roomId;
            document.getElementById('display-room-id').textContent = currentRoomId;
            showView('camera-view');
            
            initPeer();
            
            const url = new URL(window.location);
            url.searchParams.set('cam', currentRoomId);
            history.replaceState(null, '', url);
        }

        function disconnectAndGoToPortal() {
            if(dataConn) dataConn.close();
            if(mediaConn) mediaConn.close();
            if(peer) peer.destroy();
            if(isStreaming) stopStreaming();
            if(localStream) {
                 localStream.getTracks().forEach(t=>t.stop());
                 localStream = null;
                 document.getElementById('local-video').srcObject = null;
            }
            document.getElementById('video-overlay').classList.remove('hidden');
            document.getElementById('video-overlay-text').textContent = "カメラへのアクセスを許可してください";
            updateStatus('切断されました', 'bg-red-500', 'text-red-500');
            showPortal();
        }

        // パスワード処理
        function showPasswordModal() {
            document.getElementById('password-modal').classList.remove('hidden');
            document.getElementById('room-password-input').value = '';
            document.getElementById('password-error').classList.add('hidden');
        }
        function hidePasswordModal() { document.getElementById('password-modal').classList.add('hidden'); }
        function closePasswordModal() {
            hidePasswordModal();
            showToast("接続をキャンセルしました", "error");
            if (dataConn) dataConn.close();
            updateStatus('エラー', 'bg-red-500', 'text-red-500');
            showPortal();
        }
        function submitPassword() {
            const pwd = document.getElementById('room-password-input').value;
            if (!pwd) {
                const err = document.getElementById('password-error');
                err.textContent = "パスワードを入力してください";
                err.classList.remove('hidden');
                return;
            }
            document.getElementById('password-error').classList.add('hidden');
            if (pendingConnection) {
                pendingConnection.send({ type: 'auth_request', password: pwd });
            }
        }

        function updateStatus(text, dotColor, textColor) {
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-text');
            const indicator = document.getElementById('status-indicator');
            
            txt.textContent = text;
            
            // リセット
            dot.className = `w-2 h-2 rounded-full ${dotColor} animate-pulse`;
            indicator.className = `text-xs font-bold ${textColor} bg-${dotColor.split('-')[1]}-500/10 px-3 py-1.5 rounded-full flex items-center gap-1.5 border border-${dotColor.split('-')[1]}-500/30`;
        }

        // PeerJS初期化
        function initPeer() {
            myId = `cam-${generateId()}`;
            peer = new Peer(myId);

            peer.on('open', (id) => {
                updateStatus('認証中...', 'bg-yellow-500', 'text-yellow-500');
                dataConn = peer.connect(`jukebox-${currentRoomId}`);
                
                dataConn.on('open', () => {
                    // 自動認証を試行
                    const pwd = savedPasswords[currentRoomId];
                    if (pwd) dataConn.send({ type: 'auth_request', password: pwd });
                });

                dataConn.on('data', (data) => {
                    if (data.type === 'auth_required') {
                        pendingConnection = dataConn;
                        showPasswordModal();
                    } else if (data.type === 'auth_response') {
                        if (data.success) {
                            hidePasswordModal();
                            showToast("ホストに接続しました！");
                            updateStatus('オンライン', 'bg-green-500', 'text-green-500');
                            const pwdInput = document.getElementById('room-password-input').value;
                            if (pwdInput) {
                                savedPasswords[currentRoomId] = pwdInput;
                                localStorage.setItem('jukebox_passwords', JSON.stringify(savedPasswords));
                            }
                            pendingConnection = null;
                            startLocalVideo(); // 認証成功後にカメラ起動
                        } else {
                            document.getElementById('password-error').classList.remove('hidden');
                            delete savedPasswords[currentRoomId];
                            localStorage.setItem('jukebox_passwords', JSON.stringify(savedPasswords));
                            showPasswordModal();
                        }
                    } else if (data.type === 'ping') {
                        dataConn.send({ type: 'pong' });
                    } else if (data.type === 'state') {
                        saveCamHistory(currentRoomId, data.hostName);
                    }
                });

                dataConn.on('close', () => {
                    updateStatus('切断されました', 'bg-red-500', 'text-red-500');
                    if (mediaConn) mediaConn.close();
                });
            });

            peer.on('error', (err) => {
                showToast(`接続エラー: ${err.type}`, 'error');
                updateStatus('エラー', 'bg-red-500', 'text-red-500');
            });
        }

        /* カメラとマイクの制御 */
        async function startLocalVideo() {
            try {
                const constraints = {
                    video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: true
                };
                
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                }

                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                
                const videoEl = document.getElementById('local-video');
                videoEl.srcObject = localStream;
                document.getElementById('video-overlay').classList.add('hidden');

                // 初期状態の反映
                updateStreamState();
                
                // ホストへ配信開始
                startStreaming();
                
            } catch (err) {
                console.error("Camera access error:", err);
                document.getElementById('video-overlay-text').textContent = "カメラ/マイクのアクセスが拒否されました";
                showToast("カメラ/マイクを使用できません", "error");
            }
        }

        function startStreaming() {
            if (!localStream || !peer) return;
            if (mediaConn) mediaConn.close();
            
            mediaConn = peer.call(`jukebox-${currentRoomId}`, localStream);
            isStreaming = true;
            updateStreamButtonUI();
            showToast("ホストへの映像送信を開始しました");
        }

        function stopStreaming() {
            if (mediaConn) {
                mediaConn.close();
                mediaConn = null;
            }
            if (dataConn && dataConn.open) {
                dataConn.send({ type: 'camera_stop' }); // ホストに明示的に停止を通知
            }
            isStreaming = false;
            updateStreamButtonUI();
            showToast("映像送信を一時停止しました");
        }

        function toggleStream() {
            if (isStreaming) {
                stopStreaming();
            } else {
                // peerオブジェクトが死んでいないか確認
                if(peer && !peer.destroyed) {
                    startStreaming();
                } else {
                    // 切断されていたら再接続フローからやり直す
                    initPeer();
                }
            }
        }

        function updateStreamButtonUI() {
            const btn = document.getElementById('btn-stream');
            if (isStreaming) {
                btn.innerHTML = '<i class="fa-solid fa-stop"></i>';
                btn.classList.add('bg-red-600', 'hover:bg-red-500', 'shadow-[0_0_15px_rgba(220,38,38,0.4)]');
                btn.classList.remove('bg-gray-600', 'hover:bg-gray-500', 'shadow-lg');
            } else {
                btn.innerHTML = '<i class="fa-solid fa-play ml-1"></i>'; // playアイコン
                btn.classList.remove('bg-red-600', 'hover:bg-red-500', 'shadow-[0_0_15px_rgba(220,38,38,0.4)]');
                btn.classList.add('bg-gray-600', 'hover:bg-gray-500', 'shadow-lg');
            }
        }

        function toggleAudio() {
            if (!localStream) return;
            isAudioEnabled = !isAudioEnabled;
            updateStreamState();
            
            const btn = document.getElementById('btn-audio');
            if (isAudioEnabled) {
                btn.innerHTML = '<i class="fa-solid fa-microphone"></i>';
                btn.classList.remove('btn-active');
            } else {
                btn.innerHTML = '<i class="fa-solid fa-microphone-slash"></i>';
                btn.classList.add('btn-active');
            }
        }

        function toggleVideo() {
            if (!localStream) return;
            isVideoEnabled = !isVideoEnabled;
            updateStreamState();
            
            const btn = document.getElementById('btn-video');
            if (isVideoEnabled) {
                btn.innerHTML = '<i class="fa-solid fa-video"></i>';
                btn.classList.remove('btn-active');
            } else {
                btn.innerHTML = '<i class="fa-solid fa-video-slash"></i>';
                btn.classList.add('btn-active');
            }
        }

        function updateStreamState() {
            if (!localStream) return;
            localStream.getAudioTracks().forEach(track => track.enabled = isAudioEnabled);
            localStream.getVideoTracks().forEach(track => track.enabled = isVideoEnabled);
        }

        function switchCamera() {
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            startLocalVideo(); // カメラ取得をやり直す
            showToast(facingMode === 'user' ? "フロントカメラに切り替えました" : "背面カメラに切り替えました");
        }

    </script>
</body>
</html>
