<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remote Jukebox - Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0e0e10; color: white; overscroll-behavior-y: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .marquee-container { overflow: hidden; white-space: nowrap; position: relative; width: 100%; display: flex; }
        .marquee-content { 
            display: inline-block; 
            white-space: nowrap;
            padding-left: 100vw; 
            animation: marquee 15s linear infinite; 
        }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .toast {
            position: fixed; top: 20px; right: 20px; z-index: 9999;
            transform: translateX(150%); transition: transform 0.3s ease-in-out;
        }
        .toast.show { transform: translateX(0); }

        .youtube-hidden { position: absolute; width: 1px; height: 1px; top: -9999px; left: -9999px; }
        
        .layer-hidden { opacity: 0; pointer-events: none; z-index: 0; }
        .layer-visible { opacity: 1; pointer-events: auto; z-index: 10; }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 12px); }

        /* チャット入力フローティング作戦 (キーボード対策) */
        .chat-backdrop {
            position: absolute; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 30; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
        }
        .chat-backdrop.active { opacity: 1; pointer-events: auto; }
        .chat-input-container { transition: all 0.2s ease; }
        .chat-input-floating {
            position: fixed !important; top: 35vh !important; left: 0 !important; right: 0 !important; z-index: 9999 !important;
            padding: 15px !important; background: rgba(24, 24, 27, 0.98) !important;
            border-top: 1px solid #4f46e5 !important; border-bottom: 1px solid #4f46e5 !important;
            box-shadow: 0 15px 30px rgba(0,0,0,0.8) !important;
        }
    </style>

    <!-- Firebase Initialization -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // 【重要】Firebase 接続設定
        // ==========================================
        const myFirebaseConfig = {
          apiKey: "AIzaSyCxE0jwT0tuvsEvMWTS4SH9FYTLdYzlIvM",
          authDomain: "beejukebox-94ad8.firebaseapp.com",
          projectId: "beejukebox-94ad8",
          storageBucket: "beejukebox-94ad8.firebasestorage.app",
          messagingSenderId: "902266249398",
          appId: "1:902266249398:web:8de3ff1d14ea5eef224617",
          measurementId: "G-H4SV4FHX3Z"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'jukebox-app';
        let firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        if (!firebaseConfig && myFirebaseConfig) firebaseConfig = myFirebaseConfig;

        try {
            if (!firebaseConfig || Object.keys(firebaseConfig).length === 0) {
                throw new Error("Firebaseの接続設定がありません。");
            }
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            window.db = db;
            window.auth = auth;
            window.appId = appId;
            window.doc = doc;
            window.getDoc = getDoc;
            window.updateDoc = updateDoc;
            window.onSnapshot = onSnapshot;

            async function initFirebase() {
                try {
                    if (initialAuthToken) await signInWithCustomToken(auth, initialAuthToken);
                    else await signInAnonymously(auth);
                    window.dispatchEvent(new Event('firebase-auth-ready'));
                } catch (e) {
                    console.error("Firebase Auth Error:", e);
                }
            }
            initFirebase();
        } catch (e) {
            console.error("Firebase Setup Error:", e);
        }
    </script>
</head>
<body class="p-0 overflow-hidden relative">

    <!-- トースト通知 -->
    <div id="toast" class="toast bg-gray-800 border-l-4 border-red-500 text-white p-4 rounded shadow-lg flex items-center gap-3 text-sm">
        <span id="toast-msg"></span>
    </div>

    <!-- リモコン用上部速報通知 -->
    <div id="remote-top-notification" class="fixed top-0 left-0 w-full z-[9999] transform -translate-y-full transition-transform duration-300 ease-out flex justify-center pointer-events-none">
        <div class="bg-gray-900 border-b-2 border-indigo-500 shadow-[0_10px_25px_rgba(0,0,0,0.8)] rounded-b-2xl p-4 w-full max-w-md flex flex-col gap-3 pointer-events-auto backdrop-blur-md bg-opacity-95">
            <div class="flex justify-between items-center gap-3">
                <span id="remote-top-msg" class="text-white text-sm font-bold flex-1 break-words leading-tight"></span>
                <button onclick="closeRemoteTopNotification()" class="text-gray-400 hover:text-white flex-shrink-0 bg-gray-800 rounded-full w-6 h-6 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="remote-top-action" class="hidden flex gap-2 mt-1"></div>
        </div>
    </div>

    <!-- パスワード入力モーダル -->
    <div id="password-modal" class="hidden fixed inset-0 z-[1000] bg-black/80 flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-indigo-500 rounded-xl p-6 w-full max-w-sm shadow-2xl text-center">
            <h3 class="text-xl font-bold text-white mb-2"><i class="fa-solid fa-lock"></i> パスワードが必要です</h3>
            <p class="text-sm text-gray-400 mb-6">このルームを操作・配信するには<br>ホストが設定したパスワードが必要です。</p>
            <input type="password" id="room-password-input" placeholder="管理パスワードを入力" class="w-full bg-gray-800 border border-gray-600 rounded p-3 text-white mb-2 outline-none focus:border-indigo-500">
            <p id="password-error" class="hidden text-red-500 text-xs mb-4">パスワードが間違っています</p>
            <div class="flex gap-3 mt-4">
                <button onclick="closePasswordModal()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 rounded-lg">キャンセル</button>
                <button onclick="submitPassword()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg">接続する</button>
            </div>
        </div>
    </div>

    <!-- リモコン用カメラ承認ポップアップ -->
    <div id="remote-cam-modal" class="hidden fixed inset-0 z-[5000] bg-black/80 flex items-center justify-center p-4">
        <div class="bg-gray-800 border border-gray-700 rounded-xl p-6 w-full max-w-sm shadow-2xl text-center">
            <h3 class="text-xl font-bold text-white mb-2"><i class="fa-solid fa-video"></i> 視聴リクエスト</h3>
            <p class="text-sm text-gray-300 mb-6"><span id="remote-cam-req-name" class="font-bold text-yellow-400 text-lg"></span> さんがカメラの視聴を申請しました。</p>
            <div class="space-y-3">
                <button onclick="handleRemoteCamRequest('approve')" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-lg shadow-lg flex items-center justify-center gap-2"><i class="fa-regular fa-circle"></i> 承認する</button>
                <button onclick="handleRemoteCamRequest('reject')" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-lg shadow-lg flex items-center justify-center gap-2"><i class="fa-solid fa-xmark"></i> 拒否する</button>
                <button onclick="handleRemoteCamRequest('ignore')" class="w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 rounded-lg">後で決める (無視)</button>
            </div>
        </div>
    </div>

    <!-- ================= 1. ポータル画面 (サーバーセレクト) ================= -->
    <div id="portal-view" class="flex flex-col items-center justify-center min-h-[100dvh] p-4 bg-[#111827]">
        <div class="w-full max-w-md bg-gray-900 border border-gray-700 p-6 rounded-2xl shadow-2xl">
            <div class="text-center mb-6 border-b border-gray-700 pb-4">
                <h2 class="text-xl font-bold text-white"><i class="fa-solid fa-crown text-yellow-400"></i> リモコン専用ポータル</h2>
                <p class="text-sm text-gray-400 mt-1">過去のルームを選ぶか、IDを入力して操作</p>
            </div>

            <h3 class="text-sm font-bold text-gray-300 mb-3"><i class="fa-regular fa-clock"></i> 過去に操作したルーム</h3>
            <div id="portal-history-list" class="flex flex-col gap-2 mb-6 max-h-48 overflow-y-auto">
                <!-- 履歴がここに入る -->
            </div>

            <div class="border-t border-gray-700 pt-4">
                <h3 class="text-sm font-bold text-gray-300 mb-3"><i class="fa-solid fa-plus"></i> 新しい部屋を操作する</h3>
                <div class="flex flex-col gap-3">
                    <input type="text" id="portal-room-id" placeholder="ルームIDを入力..." class="w-full bg-gray-800 text-white border border-gray-600 rounded p-3 outline-none focus:border-indigo-500">
                    <button onclick="joinFromPortal()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg">接続する</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= 2. リモコン画面 (フルスクリーンUI) ================= -->
    <div id="remote-view" class="hidden flex-col w-full h-[100dvh] bg-[#0e0e10] text-sm">
        
        <!-- 設定モーダル -->
        <div id="remote-settings-modal" class="hidden absolute inset-0 z-[60] bg-black/80 flex items-center justify-center backdrop-blur-sm px-4">
            <div class="bg-[#18181b] border border-gray-700 p-6 rounded-xl w-full max-w-sm space-y-6 shadow-2xl overflow-y-auto max-h-[90vh]">
                <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                    <h3 class="text-white font-bold text-sm"><i class="fa-solid fa-gear"></i> メディア設定</h3>
                    <button onclick="document.getElementById('remote-settings-modal').classList.add('hidden')" class="text-gray-400 hover:text-white bg-gray-800 rounded-full w-6 h-6 flex items-center justify-center transition-colors"><i class="fa-solid fa-xmark"></i></button>
                </div>
                
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="text-gray-300 text-sm font-bold"><i class="fa-solid fa-video"></i> Streamの音声</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="toggle-remote-cam-mute" class="sr-only peer" onchange="toggleRemoteAudioFromSwitch(this.checked)">
                            <div class="w-11 h-6 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-500"></div>
                        </label>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-300 text-sm font-bold"><i class="fa-solid fa-music"></i> Jukeboxの音声</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="toggle-remote-wp-mute" class="sr-only peer" onchange="toggleWatchPartyMuteFromSwitch(this.checked)">
                            <div class="w-11 h-6 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-500"></div>
                        </label>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-300 text-sm font-bold"><i class="fa-solid fa-desktop"></i> Jukeboxの映像</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="toggle-remote-wp-video" class="sr-only peer" checked onchange="toggleRemoteWatchPartyVideoFromSwitch(this.checked)">
                            <div class="w-11 h-6 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-500"></div>
                        </label>
                    </div>
                </div>

            </div>
        </div>

        <!-- 映像エリア (上部固定) -->
        <div id="remote-video-area" class="relative w-full bg-black shrink-0 z-20 flex justify-center overflow-hidden" style="aspect-ratio: 16/9;">
            <!-- NowPlaying帯 -->
            <div class="absolute top-0 left-0 w-full bg-gradient-to-b from-black/90 to-transparent pt-1.5 pb-4 px-3 z-30 flex items-center gap-2 pointer-events-none">
                <div class="marquee-container h-4 flex-1">
                    <div class="marquee-content font-bold text-white text-[11px] leading-tight flex items-center gap-2 drop-shadow-md">
                        <span id="remote-now-playing">クラウド同期中...</span>
                        <span id="remote-now-requester" class="text-indigo-300 font-normal"></span>
                    </div>
                </div>
            </div>

            <!-- Streamレイヤー -->
            <div id="remote-cam-layer" class="absolute inset-0 layer-hidden bg-black">
                <button onclick="requestRemoteCamera()" id="btn-remote-toggle-camera" class="absolute inset-0 m-auto w-[80%] h-12 bg-red-600 hover:bg-red-500 text-white font-bold rounded-lg flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(220,38,38,0.5)] z-20 transition-all duration-300 opacity-50 cursor-not-allowed" disabled>
                    配信はオフラインです
                </button>
                <video id="remote-video" autoplay playsinline muted class="w-full h-full object-contain relative z-10"></video>
            </div>
            
            <!-- Jukeboxレイヤー -->
            <div id="remote-wp-layer" class="absolute inset-0 layer-visible bg-black">
                <div id="remote-youtube-player-wrapper" class="w-full h-full">
                    <div id="remote-youtube-player" class="w-full h-full pointer-events-auto"></div>
                </div>
                <!-- 初回タップ用オーバーレイ -->
                <div id="remote-youtube-overlay" class="absolute inset-0 z-20 cursor-pointer bg-black/80 flex flex-col items-center justify-center text-white transition-colors duration-300" onclick="handleOverlayClick()">
                    <span class="text-4xl mb-2 hover:scale-110 transition-transform"><i class="fa-solid fa-play"></i></span>
                    <span class="text-sm font-bold">タップして音声をONにして視聴開始</span>
                </div>
            </div>
        </div>

        <!-- テーマ表示 -->
        <div id="remote-theme-display-container" class="bg-indigo-900/90 border-b border-indigo-500/50 text-indigo-100 text-[11px] py-1.5 px-3 text-center font-bold shrink-0 hidden shadow-md z-10 break-words"></div>

        <div class="flex-shrink-0 flex justify-between items-center px-3 py-2 bg-[#18181b] border-b border-gray-800 z-10 shadow-md">
            <!-- 映像切り替えタブ -->
            <div class="flex gap-2">
                <button onclick="switchRemoteLayer('cam')" id="remote-tab-cam" class="px-4 py-1.5 rounded-full bg-gray-700 text-gray-400 text-xs font-bold transition-all shadow flex items-center gap-1.5"><i class="fa-solid fa-video"></i> Stream</button>
                <button onclick="switchRemoteLayer('wp')" id="remote-tab-wp" class="px-4 py-1.5 rounded-full bg-indigo-600 text-white text-xs font-bold transition-all shadow flex items-center gap-1.5"><i class="fa-solid fa-music"></i> Jukebox</button>
            </div>
            <!-- 設定モーダル呼び出しボタン -->
            <button onclick="document.getElementById('remote-settings-modal').classList.remove('hidden')" class="w-8 h-8 rounded-full bg-gray-700 text-gray-300 flex items-center justify-center shadow transition-colors hover:bg-gray-600 hover:text-white" title="設定">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>

        <!-- 基本コントロール (テーマ入力 & 再生ボタン) -->
        <div class="flex-shrink-0 bg-[#111827] border-b border-gray-800 px-3 py-3 space-y-2 z-10 shadow-md">
            <div class="flex gap-2">
                <input type="text" id="remote-input-theme" placeholder="テーマ・気分を変更" class="flex-1 bg-[#18181b] border border-gray-700 rounded-lg p-2 text-white text-xs outline-none focus:border-indigo-500">
                <button onclick="sendRemoteTheme()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 rounded-lg text-xs font-bold transition-colors">更新</button>
            </div>
            <div class="flex gap-2">
                <button onclick="sendRemoteCommand('toggle')" id="btn-remote-play" class="flex-1 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 font-bold py-2.5 rounded-lg shadow transition-transform active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play text-lg"></i>
                </button>
                <button onclick="sendRemoteCommand('skip')" class="flex-1 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 font-bold py-2.5 rounded-lg shadow transition-transform active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-forward-step text-lg"></i>
                </button>
            </div>
        </div>

        <!-- タブメニューエリア (下部) -->
        <div class="flex-1 flex flex-col min-h-0 bg-[#0e0e10]">
            <!-- タブヘッダー -->
            <div class="flex bg-[#18181b] border-b border-gray-800 shrink-0 shadow-md z-10">
                <button onclick="switchRemoteMenuTab('chat')" id="remote-menu-tab-chat" class="flex-1 py-2.5 text-[11px] font-bold text-indigo-400 border-b-2 border-indigo-500 transition-colors">💬 コメント</button>
                <button onclick="switchRemoteMenuTab('users')" id="remote-menu-tab-users" class="flex-1 py-2.5 text-[11px] font-bold text-gray-500 border-b-2 border-transparent transition-colors">👥 参加者</button>
                <button onclick="switchRemoteMenuTab('list')" id="remote-menu-tab-list" class="flex-1 py-2.5 text-[11px] font-bold text-gray-500 border-b-2 border-transparent transition-colors">📋 リスト</button>
                <button onclick="switchRemoteMenuTab('misc')" id="remote-menu-tab-misc" class="flex-1 py-2.5 text-[11px] font-bold text-gray-500 border-b-2 border-transparent transition-colors">⚙️ その他</button>
            </div>

            <!-- コンテンツエリア -->
            <div class="flex-1 relative overflow-hidden">
                <!-- 💬 コメント タブ -->
                <div id="remote-menu-content-chat" class="absolute inset-0 flex flex-col">
                    <div id="remote-status" class="absolute top-2 left-0 w-full text-center text-[10px] text-yellow-500 animate-pulse pointer-events-none">ルームに接続中...</div>
                    <div id="remote-chat-list" class="flex-1 p-3 space-y-3 overflow-y-auto pb-4 pt-6 relative z-10"></div>
                    <!-- チャット入力フローティング -->
                    <div id="remote-chat-backdrop" class="chat-backdrop" onclick="closeRemoteChatInput()"></div>
                    <div id="remote-chat-input-container" class="flex-shrink-0 px-3 py-2 bg-[#18181b] border-t border-gray-800 flex gap-2 items-center chat-input-container relative z-20 pb-safe">
                        <input type="text" id="remote-chat-input" name="dummy-remote-chat" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" data-lpignore="true" onfocus="focusRemoteChatInput()" onblur="blurRemoteChatInputDelay()" onkeypress="if(event.key === 'Enter') sendChatRequest()" class="flex-1 bg-[#27272a] text-white text-sm rounded-full px-4 py-2 border-none outline-none focus:ring-1 focus:ring-indigo-500 placeholder-gray-500" placeholder="チャットを送信">
                        <button onclick="sendChatRequest()" class="bg-indigo-600 hover:bg-indigo-500 text-white rounded-full w-9 h-9 flex items-center justify-center font-bold shrink-0 transition-colors shadow"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>

                <!-- 👥 参加者 タブ -->
                <div id="remote-menu-content-users" class="hidden absolute inset-0 overflow-y-auto p-3 bg-[#111827] pb-12">
                    <div class="flex justify-between items-center border-b border-gray-800 pb-2 mb-3">
                        <h3 class="font-bold text-gray-200 text-xs">参加者管理 <span id="remote-participant-count" class="text-indigo-300 ml-1"></span></h3>
                        <label class="flex items-center gap-1 text-[10px] text-gray-300 cursor-pointer">
                            <input type="checkbox" id="remote-cam-approval-toggle" onchange="sendRemoteCamApprovalToggle(this.checked)" class="rounded bg-gray-900 border-gray-600 text-red-500">
                            視聴承認制
                        </label>
                    </div>
                    <div id="remote-participant-list" class="space-y-2"></div>
                </div>

                <!-- 📋 リスト タブ -->
                <div id="remote-menu-content-list" class="hidden absolute inset-0 overflow-y-auto p-3 bg-[#111827] pb-12">
                    <div class="space-y-4">
                        <div>
                            <h3 class="text-xs font-bold text-gray-400 mb-2 border-b border-gray-800 pb-1">順番待ち (<span id="remote-queue-count">0</span>)</h3>
                            <div id="remote-queue-list" class="space-y-1.5 text-[10px]"></div>
                        </div>
                        <div>
                            <h3 class="text-xs font-bold text-gray-400 mb-2 border-b border-gray-800 pb-1">再生履歴</h3>
                            <div id="remote-history-list" class="space-y-1.5 text-[10px] text-gray-500"></div>
                        </div>
                    </div>
                </div>

                <!-- ⚙️ その他 タブ -->
                <div id="remote-menu-content-misc" class="hidden absolute inset-0 overflow-y-auto p-3 bg-[#111827] pb-12">
                    <div class="space-y-4">
                        <div>
                            <h3 class="text-xs font-bold text-indigo-400 mb-2"><i class="fa-solid fa-music"></i> リモコンからリクエスト</h3>
                            <div class="flex gap-2">
                                <input type="text" id="remote-url" placeholder="YouTube URL" class="flex-1 bg-[#18181b] border border-gray-700 rounded p-2 text-white text-xs outline-none focus:border-indigo-500">
                                <button onclick="sendRemoteRequest()" class="bg-red-600 hover:bg-red-500 text-white px-3 rounded text-xs font-bold transition-colors">追加</button>
                            </div>
                        </div>
                        <div class="border-t border-gray-800 pt-3">
                            <label class="flex items-center justify-between text-xs text-gray-300 cursor-pointer">
                                <span><i class="fa-solid fa-head-side-waveform text-indigo-400"></i> チャット読み上げ (TTS)</span>
                                <div class="relative inline-flex items-center">
                                    <input type="checkbox" id="remote-tts-toggle" class="sr-only peer">
                                    <div class="w-9 h-5 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-500"></div>
                                </div>
                            </label>
                        </div>
                        <div class="border-t border-gray-800 pt-3 mt-4 text-center">
                            <button onclick="disconnectAndGoToPortal()" class="bg-gray-800 border border-gray-600 hover:bg-gray-700 text-gray-300 text-xs py-2 px-4 rounded transition-colors">ポータル画面へ戻る</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 全画面共通リロードボタン (アイコン化) -->
    <button onclick="location.reload()" class="fixed top-3 right-3 bg-gray-800/80 hover:bg-gray-700 border border-gray-600 text-white w-9 h-9 flex items-center justify-center rounded-full shadow-lg text-sm font-bold z-[9999] backdrop-blur-sm transition-colors active:bg-gray-600" title="画面を更新">
        <i class="fa-solid fa-rotate-right"></i>
    </button>

    <script>
        let peer = null;
        let listenerConn = null; // P2P connection (カメラ等の一部機能用)
        let currentRoomId = null;
        let listenerId = null;

        let savedPasswords = JSON.parse(localStorage.getItem('jukebox_passwords')) || {};
        let myGuestUUID = localStorage.getItem('jukebox_uuid');
        if (!myGuestUUID) {
            myGuestUUID = 'user-' + generateId() + generateId();
            localStorage.setItem('jukebox_uuid', myGuestUUID);
        }

        let pendingConnection = null;
        let chatHistory = []; 
        let currentSong = null;
        let isWatchPartyEnabled = true;
        let viewerYTPlayer = null;
        let isWpOverlayActive = true;
        let hostCurrentTime = 0;
        let hostCurrentStatus = 'paused';
        let hostStartedAt = null;
        let remoteHasStream = false;

        let remoteNotifTimeout = null;
        let cachedRoomState = null; // Firestore更新用キャッシュ

        // --- 自動リカバリー用変数・処理 ---
        let reconnectTimeout = null;
        let reconnectAttempts = 0;

        function scheduleReconnect() {
            if (reconnectTimeout) clearTimeout(reconnectTimeout);
            const delay = Math.min(3000 * Math.pow(1.5, reconnectAttempts), 30000); 
            reconnectTimeout = setTimeout(() => {
                if (currentRoomId && (!listenerConn || !listenerConn.open)) {
                     reconnectAttempts++;
                     showToast(`ホストと通信が切れました。再接続中... (${reconnectAttempts}回目)`, "info");
                     if (peer) { peer.destroy(); peer = null; }
                     startP2PConnection(); 
                }
            }, delay);
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                if (currentRoomId && (!listenerConn || !listenerConn.open)) {
                    if (peer) { peer.destroy(); peer = null; }
                    startP2PConnection();
                }
            }
        });
        // ----------------------------------

        function generateId() { return Math.random().toString(36).substring(2, 9); }

        function showToast(msg, type="info") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerHTML = msg;
            toast.className = `toast bg-gray-800 border-l-4 border-red-500 text-white p-4 rounded shadow-lg flex items-center gap-3 text-sm`;
            if (type === 'error') toast.classList.replace('border-indigo-500', 'border-red-500');
            else toast.classList.replace('border-red-500', 'border-indigo-500');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        window.onload = () => {
            const rTts = document.getElementById('remote-tts-toggle');
            if(rTts) {
                const savedTTS = localStorage.getItem('jukebox_remote_tts');
                if (savedTTS === 'true') {
                    rTts.checked = true;
                }
                rTts.addEventListener('change', (e) => {
                    localStorage.setItem('jukebox_remote_tts', e.target.checked);
                    if (e.target.checked) {
                        window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
                    }
                });
            }

            const params = new URLSearchParams(window.location.search);
            if(params.has('remote')) {
                currentRoomId = params.get('remote');
                joinRoom(currentRoomId);
            } else {
                showPortal();
            }
        };

        function showView(viewId) {
            ['portal-view', 'remote-view'].forEach(id => {
                const el = document.getElementById(id);
                if(el) { el.classList.add('hidden'); el.classList.remove('flex'); }
            });
            const v = document.getElementById(viewId);
            if(v) {
                v.classList.remove('hidden');
                if(viewId === 'remote-view') v.classList.add('flex');
            }
        }

        function showPortal() {
            showView('portal-view');
            document.body.classList.remove('p-0', 'overflow-hidden');
            document.body.classList.add('bg-[#111827]');
            renderPortalHistory();
            
            const url = new URL(window.location);
            url.searchParams.delete('remote');
            history.replaceState(null, '', url);
        }

        function renderPortalHistory() {
            const list = document.getElementById('portal-history-list');
            const history = JSON.parse(localStorage.getItem('jukebox_remote_history')) || [];
            
            if(history.length === 0) {
                list.innerHTML = '<p class="text-gray-500 text-center text-sm py-4">過去の接続履歴はありません</p>';
                return;
            }

            list.innerHTML = '';
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'bg-gray-800 p-3 rounded-lg flex justify-between items-center cursor-pointer hover:bg-gray-700 transition border border-transparent hover:border-indigo-500/50 mb-2';
                div.innerHTML = `
                    <div class="flex-1 min-w-0" onclick="joinFromPortalHistory('${item.roomId}')">
                        <div class="font-bold text-white text-sm truncate">${item.hostName} の部屋</div>
                        <div class="text-xs text-gray-400">ID: ${item.roomId}</div>
                    </div>
                    <button class="text-red-400 hover:text-red-300 p-2" onclick="deleteRemoteHistory('${item.roomId}', event)"><i class="fa-solid fa-xmark"></i></button>
                `;
                list.appendChild(div);
            });
        }

        function saveRemoteHistory(roomId, hostName) {
            if(!roomId) return;
            let history = JSON.parse(localStorage.getItem('jukebox_remote_history')) || [];
            history = history.filter(h => h.roomId !== roomId);
            history.unshift({ roomId: roomId, hostName: hostName || roomId, time: Date.now() });
            if(history.length > 10) history = history.slice(0, 10);
            localStorage.setItem('jukebox_remote_history', JSON.stringify(history));
        }

        function deleteRemoteHistory(roomId, event) {
            event.stopPropagation();
            let history = JSON.parse(localStorage.getItem('jukebox_remote_history')) || [];
            history = history.filter(h => h.roomId !== roomId);
            localStorage.setItem('jukebox_remote_history', JSON.stringify(history));
            renderPortalHistory();
            showToast("履歴を削除しました");
        }

        function joinFromPortalHistory(roomId) {
            document.getElementById('portal-room-id').value = roomId;
            joinFromPortal();
        }

        function joinFromPortal() {
            const roomId = document.getElementById('portal-room-id').value.trim();
            if(!roomId) return showToast("ルームIDを入力してください", "error");
            joinRoom(roomId);
        }

        function joinRoom(roomId) {
            currentRoomId = roomId;
            showView('remote-view');
            document.body.classList.remove('bg-[#111827]');
            document.body.classList.add('p-0', 'overflow-hidden');
            
            // Firebaseが準備できていれば開始
            if (window.db) initRemoteConnection();
            else window.addEventListener('firebase-auth-ready', initRemoteConnection, { once: true });
            
            const url = new URL(window.location);
            url.searchParams.set('remote', currentRoomId);
            history.replaceState(null, '', url);
        }

        function disconnectAndGoToPortal() {
            if(listenerConn) listenerConn.close();
            if(peer) peer.destroy();
            showPortal();
        }

        function showPasswordModal() {
            document.getElementById('password-modal').classList.remove('hidden');
            document.getElementById('room-password-input').value = '';
            document.getElementById('password-error').classList.add('hidden');
        }

        function hidePasswordModal() { document.getElementById('password-modal').classList.add('hidden'); }
        
        function closePasswordModal() {
            hidePasswordModal();
            showToast("接続をキャンセルしました", "info");
            if (pendingConnection) pendingConnection.close();
            showPortal();
        }

        function submitPassword() {
            const pwd = document.getElementById('room-password-input').value;
            if (!pwd) {
                const err = document.getElementById('password-error');
                err.textContent = "パスワードを入力してください";
                err.classList.remove('hidden');
                return;
            }
            document.getElementById('password-error').classList.add('hidden');

            if (pendingConnection) {
                pendingConnection.send({ type: 'auth_request', password: pwd });
            }
        }

        function showRemoteTopNotification(msg, actionHtml = '') {
            const panel = document.getElementById('remote-top-notification');
            const msgEl = document.getElementById('remote-top-msg');
            const actionEl = document.getElementById('remote-top-action');
            if(!panel) return;
            
            msgEl.innerHTML = msg; 
            if (actionHtml) {
                actionEl.innerHTML = actionHtml;
                actionEl.classList.remove('hidden');
            } else {
                actionEl.innerHTML = '';
                actionEl.classList.add('hidden');
            }
            
            panel.classList.remove('-translate-y-full');
            panel.classList.add('translate-y-0');
            
            if(remoteNotifTimeout) clearTimeout(remoteNotifTimeout);
            let duration = actionHtml ? 10000 : 4000;
            remoteNotifTimeout = setTimeout(() => {
                closeRemoteTopNotification();
            }, duration);
        }

        function closeRemoteTopNotification() {
            const panel = document.getElementById('remote-top-notification');
            if(panel) {
                panel.classList.remove('translate-y-0');
                panel.classList.add('-translate-y-full');
            }
        }

        // --- Firebase Cloud Sync Handler ---
        function startCloudConnection() {
            window.onSnapshot(window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', currentRoomId), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    cachedRoomState = data; // Firestore更新用キャッシュ
                    renderRemoteState(data);
                    handleCloudYouTubeSync(data);
                }
            }, (err) => {
                console.error("Firebase Sync Error:", err);
            });
            loadYouTubeAPI();
        }

        // --- YouTube Cloud-based Enforcement ---
        function handleCloudYouTubeSync(data) {
            if (!isWatchPartyEnabled) return;

            if (!viewerYTPlayer) {
                if (typeof YT === 'undefined' || !YT.Player) return; 
                
                let playerOptions = {
                    height: '100%', width: '100%',
                    playerVars: { autoplay: 1, controls: 1, rel: 0, disablekb: 0 },
                    events: {
                        'onReady': (event) => {
                            event.target.mute(); 
                            if (currentSong && currentSong.videoId) {
                                let startPos = 0;
                                if (data.status === 'playing' && data.currentSong.startedAt) {
                                    startPos = (Date.now() - data.currentSong.startedAt) / 1000;
                                } else if (data.currentSong.pausePosition) {
                                    startPos = data.currentSong.pausePosition;
                                }
                                event.target.loadVideoById({videoId: currentSong.videoId, startSeconds: startPos});
                            }
                        },
                        'onStateChange': (event) => {
                            if (event.data === YT.PlayerState.PLAYING) {
                                const wpToggle = document.getElementById('toggle-remote-wp-mute');
                                if (wpToggle && wpToggle.checked) {
                                    event.target.unMute();
                                }
                            }
                        }
                    }
                };
                if (data.currentSong && data.currentSong.videoId) playerOptions.videoId = data.currentSong.videoId;
                if (document.getElementById('remote-youtube-player')) {
                    viewerYTPlayer = new YT.Player('remote-youtube-player', playerOptions);
                }
                return;
            }

            if (typeof viewerYTPlayer.getPlayerState !== 'function') return;

            if (!data.currentSong || !data.currentSong.videoId) {
                if (viewerYTPlayer.getPlayerState() !== -1 && viewerYTPlayer.getPlayerState() !== 5) viewerYTPlayer.stopVideo();
                currentSong = null;
                return;
            }

            hostCurrentStatus = data.status;
            hostStartedAt = data.currentSong.startedAt;

            if (!currentSong || currentSong.videoId !== data.currentSong.videoId) {
                currentSong = data.currentSong;
                let startPos = 0;
                if (data.status === 'playing' && data.currentSong.startedAt) startPos = (Date.now() - data.currentSong.startedAt) / 1000;
                else if (data.currentSong.pausePosition) startPos = data.currentSong.pausePosition;
                
                viewerYTPlayer.loadVideoById({videoId: currentSong.videoId, startSeconds: startPos});
            }
        }

        // 強制同期
        setInterval(() => {
            enforceSync();
        }, 1000);

        function enforceSync() {
            if (!viewerYTPlayer || typeof viewerYTPlayer.getPlayerState !== 'function' || isWpOverlayActive) return;
            
            try {
                const vData = viewerYTPlayer.getVideoData();
                if (!vData || !vData.video_id) return;
            } catch(e) { return; }

            const myState = viewerYTPlayer.getPlayerState();
            const myTime = viewerYTPlayer.getCurrentTime() || 0;

            if (hostCurrentStatus === 'playing' && hostStartedAt) {
                const expectedTime = (Date.now() - hostStartedAt) / 1000;
                const diff = expectedTime - myTime;

                if (myState !== 1 && myState !== 3) {
                    viewerYTPlayer.seekTo(expectedTime, true);
                    viewerYTPlayer.playVideo();
                } else {
                    if (Math.abs(diff) > 2.0) {
                        viewerYTPlayer.seekTo(expectedTime, true);
                    } else if (Math.abs(diff) > 0.5) {
                        viewerYTPlayer.setPlaybackRate(diff > 0 ? 1.05 : 0.95);
                    } else {
                        viewerYTPlayer.setPlaybackRate(1.0);
                    }
                }
            } else if (hostCurrentStatus === 'paused') {
                if (myState === 1 || myState === 3) {
                    viewerYTPlayer.pauseVideo();
                    if (currentSong && currentSong.pausePosition) {
                        viewerYTPlayer.seekTo(currentSong.pausePosition, true);
                    }
                }
            }
        }

        function initRemoteConnection() {
            startP2PConnection();
            startCloudConnection();
        }

        function startP2PConnection() {
            if (peer) peer.destroy();
            listenerId = generateId();
            peer = new Peer(`remote-${listenerId}`);

            peer.on('open', () => {
                listenerConn = peer.connect(`jukebox-${currentRoomId}`);
                pendingConnection = listenerConn;

                listenerConn.on('open', () => {
                    reconnectAttempts = 0; 
                    const statusId = 'remote-status';
                    if(document.getElementById(statusId)) {
                        document.getElementById(statusId).textContent = "接続完了！";
                        document.getElementById(statusId).classList.replace('text-yellow-500', 'text-green-500');
                        document.getElementById(statusId).classList.replace('text-red-500', 'text-green-500');
                    }
                    sendProfileUpdate();
                });

                listenerConn.on('close', () => {
                    const statusId = 'remote-status';
                    if(document.getElementById(statusId)) {
                        document.getElementById(statusId).textContent = "通信切断...";
                        document.getElementById(statusId).classList.replace('text-green-500', 'text-red-500');
                    }
                    scheduleReconnect();
                });

                listenerConn.on('data', (data) => {
                    if (data.type === 'ping') {
                        listenerConn.send({ type: 'pong' });
                        return;
                    }
                    if(data.type === 'banned') {
                        document.body.innerHTML = '<div class="banned-overlay"><h1 class="text-3xl mb-4 text-red-500"><i class="fa-solid fa-ban"></i> ブロックされました</h1><p class="text-gray-300">アクセスが制限されています。</p></div>';
                        if(peer) peer.destroy();
                        return;
                    }
                    if(data.type === 'error') { showToast(data.msg, "error"); return; }
                    
                    if(data.type === 'remote_alert') {
                        showRemoteTopNotification(data.msg);
                        return;
                    }

                    if(data.type === 'camera_request_alert') {
                        showCameraRequestModal(data.id, data.name);
                        const actionBtns = `
                            <button onclick="handleRemoteCamRequestTop('approve', '${data.id}')" class="flex-1 bg-green-600 hover:bg-green-500 text-white font-bold py-2 rounded-lg text-sm shadow"><i class="fa-solid fa-check"></i> 承認する</button>
                            <button onclick="handleRemoteCamRequestTop('reject', '${data.id}')" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-2 rounded-lg text-sm shadow"><i class="fa-solid fa-xmark"></i> 拒否する</button>
                        `;
                        showRemoteTopNotification(`<i class="fa-solid fa-bell text-yellow-400"></i> <span class="text-yellow-400 text-base">${data.name}</span> が視聴承認待ちです`, actionBtns);
                        return;
                    }
                    
                    // P2PからのStateはパスワード処理のみに使用
                    if(data.type === 'state') {
                        if (data.requirePassword) {
                            const savedPwd = savedPasswords[currentRoomId];
                            if (savedPwd) {
                                listenerConn.send({ type: 'auth_request', password: savedPwd });
                            } else {
                                showPasswordModal();
                            }
                        } else {
                            pendingConnection = null;
                        }
                    }
                    
                    if (data.type === 'auth_response') {
                        if (data.success) {
                            hidePasswordModal();
                            showToast("認証に成功しました");
                            const pwdInput = document.getElementById('room-password-input').value;
                            if (pwdInput) {
                                savedPasswords[currentRoomId] = pwdInput;
                                localStorage.setItem('jukebox_passwords', JSON.stringify(savedPasswords));
                            }
                            pendingConnection = null;
                            sendProfileUpdate();
                        } else {
                            document.getElementById('password-error').classList.remove('hidden');
                            delete savedPasswords[currentRoomId];
                            localStorage.setItem('jukebox_passwords', JSON.stringify(savedPasswords));
                            showPasswordModal(); 
                        }
                    }
                    
                    if (data.type === 'auth_required') {
                         showToast("操作にはパスワード認証が必要です", "error");
                         pendingConnection = listenerConn;
                         showPasswordModal();
                    }
                });
            });

            peer.on('call', (call) => {
                call.answer(); 
                call.on('stream', (stream) => {
                    remoteHasStream = true;
                    const video = document.getElementById('remote-video');
                    const btn = document.getElementById('btn-remote-toggle-camera');
                    
                    if(btn) btn.classList.add('hidden'); 
                    video.srcObject = stream;
                    
                    const camMuteToggle = document.getElementById('toggle-remote-cam-mute');
                    if(camMuteToggle) camMuteToggle.checked = true;
                    video.muted = true; 
                    
                    video.play().catch(e => {
                        video.muted = true;
                        if(camMuteToggle) camMuteToggle.checked = false;
                        video.play().catch(er=>{});
                    });
                });
                call.on('close', () => { 
                    remoteHasStream = false;
                    const videoEl = document.getElementById('remote-video');
                    if (videoEl) videoEl.srcObject = null;
                    const btn = document.getElementById('btn-remote-toggle-camera');
                    if(btn) { 
                        btn.classList.remove('hidden'); 
                        btn.disabled = false;
                        btn.classList.remove('opacity-50', 'cursor-not-allowed');
                        btn.innerHTML = '<i class="fa-solid fa-video text-white text-xs"></i> 映像を受信 (タップ)';
                    }
                });
            });

            peer.on('disconnected', () => scheduleReconnect());
            peer.on('error', (err) => {
                scheduleReconnect();
            });
        }

        function sendProfileUpdate() {
            if(!listenerConn || !listenerConn.open) return;
            listenerConn.send({ type: 'update_profile', name: "👑 配信管理者", isRemote: true, isObs: false, uuid: myGuestUUID });
        }

        function switchRemoteLayer(layer) {
            const camLayer = document.getElementById('remote-cam-layer');
            const wpLayer = document.getElementById('remote-wp-layer');
            const tabCam = document.getElementById('remote-tab-cam');
            const tabWp = document.getElementById('remote-tab-wp');

            if(layer === 'cam') {
                camLayer.classList.replace('layer-hidden', 'layer-visible');
                wpLayer.classList.replace('layer-visible', 'layer-hidden');
                tabCam.classList.add('bg-red-600', 'text-white');
                tabCam.classList.remove('bg-gray-700', 'text-gray-400');
                tabWp.classList.add('bg-gray-700', 'text-gray-400');
                tabWp.classList.remove('bg-indigo-600', 'text-white');
            } else {
                wpLayer.classList.replace('layer-hidden', 'layer-visible');
                camLayer.classList.replace('layer-visible', 'layer-hidden');
                tabWp.classList.add('bg-indigo-600', 'text-white');
                tabWp.classList.remove('bg-gray-700', 'text-gray-400');
                tabCam.classList.add('bg-gray-700', 'text-gray-400');
                tabCam.classList.remove('bg-red-600', 'text-white');
            }
        }

        function switchRemoteMenuTab(tabId) {
            ['chat', 'users', 'list', 'misc'].forEach(id => {
                document.getElementById('remote-menu-content-' + id).classList.add('hidden');
                const btn = document.getElementById('remote-menu-tab-' + id);
                if (btn) {
                    btn.classList.remove('text-indigo-400', 'border-indigo-500');
                    btn.classList.add('text-gray-500', 'border-transparent');
                }
            });
            document.getElementById('remote-menu-content-' + tabId).classList.remove('hidden');
            const activeBtn = document.getElementById('remote-menu-tab-' + tabId);
            if (activeBtn) {
                activeBtn.classList.add('text-indigo-400', 'border-indigo-500');
                activeBtn.classList.remove('text-gray-500', 'border-transparent');
            }
            if(tabId === 'chat') {
                const chatList = document.getElementById('remote-chat-list');
                if(chatList) chatList.scrollTop = chatList.scrollHeight;
            }
        }

        function focusRemoteChatInput() {
            document.getElementById('remote-chat-input-container').classList.add('chat-input-floating');
            document.getElementById('remote-chat-backdrop').classList.add('active');
        }

        function closeRemoteChatInput() {
            const input = document.getElementById('remote-chat-input');
            if (input) input.blur();
            document.getElementById('remote-chat-input-container').classList.remove('chat-input-floating');
            document.getElementById('remote-chat-backdrop').classList.remove('active');
        }

        function blurRemoteChatInputDelay() {
            setTimeout(() => {
                const input = document.getElementById('remote-chat-input');
                if (document.activeElement !== input) closeRemoteChatInput();
            }, 200);
        }

        // --- Firestore Update Wrappers ---
        
        function sendChatRequest() {
            const inputId = 'remote-chat-input';
            const text = document.getElementById(inputId).value.trim();
            if(!text || !cachedRoomState) return;

            const newChat = {
                id: generateId(), text: text, sender: "👑 配信管理者", senderReal: "配信管理者", isAnon: false, isRemote: true, time: Date.now()
            };
            
            let chatHistory = cachedRoomState.chatHistory || [];
            chatHistory.push(newChat);
            if(chatHistory.length > 100) chatHistory.shift();

            window.updateDoc(window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', currentRoomId), {
                chatHistory: chatHistory
            }).then(() => {
                document.getElementById(inputId).value = '';
                closeRemoteChatInput();
            }).catch(e => showToast("チャット送信エラー", "error"));
        }

        function deleteChat(id) {
            if(!cachedRoomState) return;
            let chatHistory = cachedRoomState.chatHistory || [];
            chatHistory = chatHistory.filter(c => c.id !== id);
            window.updateDoc(window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', currentRoomId), {
                chatHistory: chatHistory
            });
        }

        // 再生制御・管理系コマンドは、Hostに処理を委譲するため、Firestoreの "remoteCommand" フィールドに書き込む
        function sendRemoteCommand(cmd, action = null, targetId = null) {
            if(!cachedRoomState) return;
            const commandData = {
                cmd: cmd,
                action: action,
                targetId: targetId,
                ts: Date.now()
            };
            window.updateDoc(window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', currentRoomId), {
                remoteCommand: commandData
            }).then(() => {
                if(cmd !== 'manage') showToast("コマンドを送信しました");
            });
        }

        function sendRemoteTheme() {
            const newTheme = document.getElementById('remote-input-theme').value;
            if(!cachedRoomState) return;
            window.updateDoc(window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', currentRoomId), {
                theme: newTheme
            }).then(() => {
                document.getElementById('remote-input-theme').value = '';
                showToast("テーマを更新しました");
            });
        }

        function sendRemoteCamApprovalToggle(isChecked) {
            sendRemoteCommand('manage', 'toggle_cam_approval', isChecked);
        }

        let currentCamReqPeerId = null;
        function showCameraRequestModal(peerId, name) {
            currentCamReqPeerId = peerId;
            document.getElementById('remote-cam-req-name').textContent = name;
            document.getElementById('remote-cam-modal').classList.remove('hidden');
        }

        function handleRemoteCamRequest(action) {
            document.getElementById('remote-cam-modal').classList.add('hidden');
            if(!currentCamReqPeerId) return;
            if(action === 'approve') sendRemoteCommand('manage', 'approve_cam', currentCamReqPeerId);
            else if (action === 'reject') sendRemoteCommand('manage', 'reject_cam', currentCamReqPeerId);
            currentCamReqPeerId = null;
        }

        function handleRemoteCamRequestTop(action, targetId) {
            closeRemoteTopNotification();
            document.getElementById('remote-cam-modal').classList.add('hidden');
            if(action === 'approve') sendRemoteCommand('manage', 'approve_cam', targetId);
            else if (action === 'reject') sendRemoteCommand('manage', 'reject_cam', targetId);
        }

        function extractVideoId(url) {
            const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=))([^"&?\/\s]{11})/);
            return match ? match[1] : null;
        }

        async function fetchYouTubeTitle(videoId) {
            try {
                const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
                if(res.ok) {
                    const data = await res.json();
                    return data.title || "取得中...";
                }
            } catch(e) {}
            return "取得中...";
        }

        function sendRemoteRequest() {
            const url = document.getElementById('remote-url').value;
            if(!url || !cachedRoomState) return;
            const vid = extractVideoId(url);
            if(vid) {
                const newReq = { id: generateId(), videoId: vid, title: "取得中...", requester: `👑 配信管理者`, requesterReal: '配信管理者', isAnon: false, isRemote: true };
                let queue = cachedRoomState.queue || [];
                queue.push(newReq);
                
                window.updateDoc(window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', currentRoomId), { queue: queue })
                .then(() => {
                    document.getElementById('remote-url').value = '';
                    showToast("追加しました！");
                    
                    fetchYouTubeTitle(vid).then(title => {
                        if(!cachedRoomState) return;
                        let currentQ = cachedRoomState.queue || [];
                        const qItem = currentQ.find(q => q.id === newReq.id);
                        if(qItem) {
                            qItem.title = title;
                            window.updateDoc(window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', currentRoomId), { queue: currentQ });
                        }
                    });
                });
            } else {
                showToast("無効なYouTube URLです", "error");
            }
        }

        function reRequestRemote(videoId) {
            if(!cachedRoomState) return;
            const newReq = { id: generateId(), videoId: videoId, title: "取得中...", requester: `👑 配信管理者`, requesterReal: '配信管理者', isAnon: false, isRemote: true };
            let queue = cachedRoomState.queue || [];
            queue.push(newReq);
            window.updateDoc(window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', currentRoomId), { queue: queue })
            .then(() => {
                showToast("再リクエストを追加しました");
                fetchYouTubeTitle(videoId).then(title => {
                    if(!cachedRoomState) return;
                    let currentQ = cachedRoomState.queue || [];
                    const qItem = currentQ.find(q => q.id === newReq.id);
                    if(qItem) {
                        qItem.title = title;
                        window.updateDoc(window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', currentRoomId), { queue: currentQ });
                    }
                });
            });
        }

        function requestRemoteCamera() {
            const btn = document.getElementById('btn-remote-toggle-camera');
            if (btn && btn.disabled) return; 
            if (listenerConn && listenerConn.open) {
                listenerConn.send({ type: 'request_camera' });
                if (btn) btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-white"></i> 取得中...';
            }
        }

        function loadYouTubeAPI() {
            if (window.YT && window.YT.Player) {
                // API is ready
            } else if (!document.getElementById('youtube-api-script')) {
                const tag = document.createElement('script');
                tag.id = 'youtube-api-script';
                tag.src = 'https://www.youtube.com/iframe_api';
                const firstScriptTag = document.getElementsByTagName('script')[0];
                firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
            }
        }

        function handleOverlayClick() {
            if (isWpOverlayActive) {
                if (viewerYTPlayer && typeof viewerYTPlayer.unMute === 'function') {
                    viewerYTPlayer.unMute();
                    const toggle = document.getElementById('toggle-remote-wp-mute');
                    if(toggle) toggle.checked = true;
                    if (typeof viewerYTPlayer.getPlayerState === 'function' && viewerYTPlayer.getPlayerState() !== 1 && viewerYTPlayer.getPlayerState() !== 3) {
                        viewerYTPlayer.playVideo();
                    }
                }
                const overlay = document.getElementById('remote-youtube-overlay');
                if(overlay) overlay.style.display = 'none'; 
                isWpOverlayActive = false;
                showToast("音声をONにして視聴を開始しました！", "info");
            }
        }

        function toggleRemoteAudioFromSwitch(isSoundOn) {
            const video = document.getElementById('remote-video');
            if (video) {
                video.muted = !isSoundOn;
                if (!video.muted) video.play().catch(e=>{});
            }
        }

        function toggleWatchPartyMuteFromSwitch(isSoundOn) {
            if (!viewerYTPlayer || typeof viewerYTPlayer.isMuted !== 'function') return;
            if (isSoundOn) viewerYTPlayer.unMute();
            else viewerYTPlayer.mute();
        }

        function toggleRemoteWatchPartyVideoFromSwitch(isOn) {
            const playerWrapper = document.getElementById('remote-youtube-player-wrapper');
            if (playerWrapper) {
                playerWrapper.style.opacity = isOn ? '1' : '0';
                playerWrapper.style.pointerEvents = isOn ? 'auto' : 'none';
            }
        }

        function triggerTTS(chatObj) {
            let ttsOn = false;
            const toggle = document.getElementById('remote-tts-toggle');
            if(toggle) ttsOn = toggle.checked;
            if(!ttsOn) return;
            
            // 自分の発言と、前回の発言と同じ場合は読み上げない(二重読み上げ防止)
            if (chatObj.senderReal === "配信管理者") return;
            
            let name = chatObj.isAnon ? '184(匿名)' : chatObj.senderReal;
            const text = `${name}さんから、${chatObj.text}`;
            const ut = new SpeechSynthesisUtterance(text);
            ut.lang = 'ja-JP';
            window.speechSynthesis.speak(ut);
        }

        function renderChatList(containerId, chats, isPrivileged) {
            const container = document.getElementById(containerId);
            if(!container) return;
            container.innerHTML = '';
            chats.forEach(c => {
                const div = document.createElement('div');
                div.className = "text-[13px] leading-relaxed flex group";
                const dispName = (c.isAnon && !isPrivileged) ? '184(匿名)' : c.senderReal;
                const badge = c.isRemote ? '<i class="fa-solid fa-crown text-yellow-400"></i> ' : '';
                const nameColor = c.isRemote ? 'text-yellow-400' : 'text-indigo-400';
                div.innerHTML = `
                    <div class="flex-1 break-words">
                        <span class="font-bold ${nameColor} mr-1">${badge}${dispName}:</span>
                        <span class="text-gray-100">${c.text}</span>
                    </div>
                `;
                if (isPrivileged) {
                    const delBtn = document.createElement('button');
                    delBtn.className = "text-red-500 hover:text-red-400 opacity-0 group-hover:opacity-100 px-2 transition-opacity flex-shrink-0";
                    delBtn.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
                    delBtn.onclick = () => deleteChat(c.id);
                    div.appendChild(delBtn);
                }
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function renderParticipantList(container) {
            if(!container) return;
            container.innerHTML = '';
            const list = cachedRoomState ? (cachedRoomState.participants || []) : [];
            let validParticipantCount = 0;

            list.forEach(p => {
                if(p.isObs || p.isCam) return; 
                validParticipantCount++;
                const div = document.createElement('div');
                div.className = "flex items-center justify-between bg-gray-700 p-2 rounded text-sm mb-1";
                
                let nameLabel = p.name;
                if(p.isRemote) nameLabel += ' <span class="text-xs text-yellow-400">(<i class="fa-solid fa-crown text-yellow-400"></i>)</span>';
                if(p.isMuted) nameLabel += ' <span class="text-xs text-red-400"><i class="fa-solid fa-volume-xmark"></i>ミュート</span>';

                let controls = '';
                if(!p.isRemote) {
                    const toggleEl = document.getElementById('remote-cam-approval-toggle');
                    if(toggleEl && toggleEl.checked) {
                        if(p.cameraStatus === 'requested') {
                            controls += `<button onclick="sendRemoteCommand('manage', 'approve_cam', '${p.id}')" class="text-xs bg-yellow-600 hover:bg-yellow-500 text-white px-2 py-1 rounded mr-1"><i class="fa-solid fa-check"></i></button>`;
                            controls += `<button onclick="sendRemoteCommand('manage', 'reject_cam', '${p.id}')" class="text-xs bg-gray-600 hover:bg-gray-500 text-white px-2 py-1 rounded mr-2"><i class="fa-solid fa-xmark"></i></button>`;
                        } else if(p.cameraStatus === 'approved') {
                            controls += `<span class="text-xs text-green-400 mr-2"><i class="fa-solid fa-video"></i>許可済</span>`;
                        }
                    }
                    controls += `<button onclick="sendRemoteCommand('manage', 'mute', '${p.id}')" class="text-xs ${p.isMuted ? 'bg-gray-500' : 'bg-orange-600'} text-white px-2 py-1 rounded mr-1" title="リクエスト禁止"><i class="fa-solid fa-volume-xmark"></i></button>`;
                    controls += `<button onclick="sendRemoteCommand('manage', 'ban', '${p.id}')" class="text-xs bg-red-600 hover:bg-red-500 text-white px-2 py-1 rounded" title="BAN"><i class="fa-solid fa-ban"></i></button>`;
                }

                div.innerHTML = `<div class="truncate flex-1"><span class="text-gray-200">${nameLabel}</span></div><div class="flex-shrink-0 flex items-center">${controls}</div>`;
                container.appendChild(div);
            });

            const countEl = document.getElementById('remote-participant-count');
            if (countEl) countEl.textContent = `(現在: ${validParticipantCount}人)`;

            const bUsers = cachedRoomState ? (cachedRoomState.bannedUsers || {}) : {};
            if(Object.keys(bUsers).length > 0) {
                const banHeader = document.createElement('div');
                banHeader.className = "text-xs font-bold text-red-400 mt-4 mb-2 border-b border-gray-700 pb-1";
                banHeader.innerHTML = `<i class="fa-solid fa-ban"></i> BANされたユーザー`;
                container.appendChild(banHeader);

                Object.entries(bUsers).forEach(([id, info]) => {
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between bg-red-900/30 border border-red-900 p-2 rounded text-sm mb-1";
                    div.innerHTML = `
                        <div class="truncate flex-1"><span class="text-gray-300 line-through">${info.name}</span></div>
                        <button onclick="sendRemoteCommand('manage', 'unban', '${id}')" class="text-xs bg-gray-600 hover:bg-gray-500 text-white px-2 py-1 rounded">解除</button>
                    `;
                    container.appendChild(div);
                });
            }
        }

        // 新規チャット検知用
        let lastChatCount = 0;

        function renderRemoteState(state) {
            saveRemoteHistory(currentRoomId, state.hostName);

            const { queue, historyQueue, chatHistory, currentSong, status, hostTheme, isLive, cameraApprovalMode: serverCamAppMode, participants, bannedUsers } = state;
            
            const toggleEl = document.getElementById('remote-cam-approval-toggle');
            if (toggleEl) toggleEl.checked = serverCamAppMode;

            if(chatHistory) {
                renderChatList('remote-chat-list', chatHistory, true);
                
                // 新規チャット通知＆読み上げ判定
                if (chatHistory.length > lastChatCount) {
                    const newChats = chatHistory.slice(lastChatCount);
                    newChats.forEach(c => {
                        if(c.senderReal !== "配信管理者") {
                            showRemoteTopNotification(`<i class="fa-solid fa-comment-dots text-gray-400"></i> <span class="text-gray-300 text-xs">${c.senderReal}</span><br>${c.text}`);
                        }
                        triggerTTS(c);
                    });
                } else if (chatHistory.length < lastChatCount) {
                    // 削除された場合など
                }
                lastChatCount = chatHistory.length;
            }

            const playingEl = document.getElementById('remote-now-playing');
            if(currentSong && playingEl) {
                playingEl.textContent = currentSong.title;
                const remoteReqEl = document.getElementById('remote-now-requester');
                if(remoteReqEl) {
                    const reqName = currentSong.isAnon ? '184(匿名)' : (currentSong.requesterReal || "");
                    remoteReqEl.innerHTML = reqName ? `<i class="fa-solid fa-user"></i> ${reqName}` : "---";
                }
            } else if (playingEl) {
                playingEl.textContent = "BGM停止中";
                const remoteReqEl = document.getElementById('remote-now-requester');
                if(remoteReqEl) remoteReqEl.textContent = "---";
            }

            const remotePlayBtn = document.getElementById('btn-remote-play');
            if(remotePlayBtn) {
                remotePlayBtn.innerHTML = status === 'playing'
                    ? `<i class="fa-solid fa-pause text-lg"></i>`
                    : `<i class="fa-solid fa-play text-lg"></i>`;
            }

            document.querySelectorAll('.marquee-content').forEach(el => { el.style.animation = 'none'; el.offsetHeight; el.style.animation = null; });

            const tDiv = document.getElementById('remote-theme-display-container');
            if(tDiv) {
                if(hostTheme) { 
                    tDiv.innerHTML = `<i class="fa-solid fa-bullhorn"></i> ${hostTheme}`; 
                    tDiv.classList.remove('hidden'); 
                } else {
                    tDiv.classList.add('hidden');
                }
            }

            const btnRemote = document.getElementById('btn-remote-toggle-camera');
            const tabRemoteCamIcon = document.querySelector('#remote-tab-cam i');
            if(isLive) {
                if(btnRemote && !remoteHasStream) {
                    btnRemote.disabled = false;
                    btnRemote.classList.remove('opacity-50', 'cursor-not-allowed');
                    btnRemote.innerHTML = '<i class="fa-solid fa-video text-white text-xs"></i> 映像を受信 (タップ)';
                }
                if(tabRemoteCamIcon) tabRemoteCamIcon.classList.add('text-red-400', 'animate-pulse', 'drop-shadow-[0_0_8px_rgba(248,113,113,0.8)]');
            } else {
                resetRemoteVideo();
                if(tabRemoteCamIcon) tabRemoteCamIcon.classList.remove('text-red-400', 'animate-pulse', 'drop-shadow-[0_0_8px_rgba(248,113,113,0.8)]');
            }

            renderParticipantList(document.getElementById('remote-participant-list'));

            const safeQueue = queue || [];
            const safeHistoryQueue = historyQueue || [];

            const countEl = document.getElementById('remote-queue-count');
            if(countEl) countEl.textContent = safeQueue.length;
            
            const qList = document.getElementById('remote-queue-list');
            if(qList) {
                qList.innerHTML = '';
                safeQueue.forEach((q, idx) => {
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between bg-gray-800 p-2 rounded border border-gray-700 text-sm mb-1";
                    const dispName = q.isAnon ? '184(匿名)' : q.requesterReal;
                    const isCrown = q.isRemote ? '(<i class="fa-solid fa-crown text-yellow-400"></i>)' : '';
                    div.innerHTML = `
                        <div class="flex items-center gap-2 overflow-hidden">
                            <span class="text-gray-500 font-bold w-4">${idx+1}</span>
                            <div class="truncate">
                                <p class="text-gray-200 truncate font-medium">${q.title}</p>
                                <p class="text-[10px] text-gray-400 truncate"><i class="fa-solid fa-user"></i> ${dispName} ${isCrown}</p>
                            </div>
                        </div>
                    `;
                    const btn = document.createElement('button');
                    btn.className = "text-red-400 hover:text-red-300 text-xs px-2 border border-red-500/50 rounded flex-shrink-0 transition-transform active:scale-90";
                    btn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                    btn.onclick = () => sendRemoteCommand('manage', 'cancel_req', q.id);
                    div.appendChild(btn);
                    qList.appendChild(div);
                });
            }

            const hList = document.getElementById('remote-history-list');
            if(hList) {
                hList.innerHTML = '';
                safeHistoryQueue.forEach((q, idx) => {
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between bg-gray-900 p-2 rounded text-sm mb-1";
                    div.innerHTML = `
                        <div class="flex items-center gap-2 overflow-hidden flex-1">
                            <span class="text-gray-500 font-bold w-4">${idx+1}</span>
                            <div class="truncate">
                                <p class="text-gray-300 truncate font-medium">${q.title}</p>
                                <p class="text-xs text-gray-500 truncate"><i class="fa-solid fa-user"></i> ${q.isAnon ? '184(匿名)' : q.requesterReal}</p>
                            </div>
                        </div>
                        <button onclick="reRequestRemote('${q.videoId}')" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-2 py-1 rounded flex-shrink-0"><i class="fa-solid fa-rotate-right"></i></button>
                    `;
                    hList.appendChild(div);
                });
            }
        }
        
        function resetRemoteVideo() {
            remoteHasStream = false;
            const videoEl = document.getElementById('remote-video');
            if (videoEl) videoEl.srcObject = null;
            const btn = document.getElementById('btn-remote-toggle-camera');
            if(btn) {
                btn.classList.remove('hidden');
                btn.textContent = "配信はオフラインです"; 
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
