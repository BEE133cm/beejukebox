<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remote Jukebox - OBS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; padding: 0; }
        
        /* OBSの背景透過用 */
        body.mode-overlay { background-color: transparent !important; }
        body.mode-cam { background-color: #0e0e10 !important; }

        .marquee-container { overflow: hidden; white-space: nowrap; position: relative; width: 100%; display: flex; }
        .marquee-content { 
            display: inline-block; 
            white-space: nowrap;
            padding-left: 100vw; 
            animation: marquee 15s linear infinite; 
        }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .equalizer {
            display: flex; align-items: flex-end; gap: 3px; height: 20px; opacity: 0; transition: opacity 0.3s;
        }
        .equalizer.active { opacity: 1; }
        .eq-bar {
            width: 4px; background-color: #ef4444; border-radius: 2px;
            animation: eq-bounce 0.5s infinite alternate ease-in-out;
        }
        .eq-bar:nth-child(1) { animation-delay: 0.1s; height: 30%; }
        .eq-bar:nth-child(2) { animation-delay: 0.3s; height: 60%; }
        .eq-bar:nth-child(3) { animation-delay: 0.0s; height: 100%; }
        .eq-bar:nth-child(4) { animation-delay: 0.4s; height: 40%; }
        .eq-bar:nth-child(5) { animation-delay: 0.2s; height: 70%; }
        
        @keyframes eq-bounce {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1); }
        }

        /* 映像レイヤーを隠すためのユーティリティ */
        .youtube-hidden { position: absolute; width: 1px; height: 1px; top: -9999px; left: -9999px; opacity: 0; pointer-events: none; }
    </style>

    <!-- Firebase Initialization -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, addDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // 【重要】Firebase 接続設定
        // クラウド同期を利用するには、ご自身でFirebaseプロジェクトを作成し、
        // 以下の myFirebaseConfig に設定オブジェクトを貼り付けてください。
        // ==========================================
        const firebaseConfig = {
  apiKey: "AIzaSyCxE0jwT0tuvsEvMWTS4SH9FYTLdYzlIvM",
  authDomain: "beejukebox-94ad8.firebaseapp.com",
  projectId: "beejukebox-94ad8",
  storageBucket: "beejukebox-94ad8.firebasestorage.app",
  messagingSenderId: "902266249398",
  appId: "1:902266249398:web:8de3ff1d14ea5eef224617",
  measurementId: "G-H4SV4FHX3Z"
};

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'jukebox-app';
        let firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        if (!firebaseConfig && myFirebaseConfig) {
            firebaseConfig = myFirebaseConfig;
        }

        try {
            if (!firebaseConfig || Object.keys(firebaseConfig).length === 0) {
                throw new Error("Firebaseの接続設定がありません。コード内の myFirebaseConfig を設定してください。");
            }

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            window.db = db;
            window.auth = auth;
            window.appId = appId;
            window.collection = collection;
            window.doc = doc;
            window.setDoc = setDoc;
            window.updateDoc = updateDoc;
            window.addDoc = addDoc;
            window.deleteDoc = deleteDoc;
            window.onSnapshot = onSnapshot;

            async function initFirebase() {
                try {
                    if (initialAuthToken) await signInWithCustomToken(auth, initialAuthToken);
                    else await signInAnonymously(auth);
                    window.dispatchEvent(new Event('firebase-auth-ready'));
                } catch (e) {
                    console.error("Firebase Auth Error:", e);
                }
            }
            initFirebase();
        } catch (e) {
            console.error("Firebase Setup Error:", e);
            window.firebaseInitError = e.message;
        }
    </script>
</head>
<body id="obs-body" class="mode-overlay text-white">

    <!-- エラーメッセージ用オーバーレイ -->
    <div id="error-overlay" class="hidden absolute inset-0 z-50 flex flex-col items-center justify-center bg-black/90">
        <div class="bg-gray-900 border border-red-500 p-6 rounded-xl text-center max-w-lg shadow-2xl">
            <h2 class="text-xl font-bold text-red-500 mb-2"><i class="fa-solid fa-triangle-exclamation"></i> OBS 接続エラー</h2>
            <p id="error-msg" class="text-sm text-gray-300 leading-relaxed"></p>
        </div>
    </div>

    <!-- 映像レイヤー (mode-cam時のみ表示・使用) -->
    <div id="video-layer" class="hidden absolute inset-0 bg-black z-10 flex items-center justify-center overflow-hidden">
        <!-- YouTube 映像・音声 -->
        <div id="youtube-player-wrapper" class="w-full h-full absolute inset-0 z-10 pointer-events-none">
            <div id="obs-youtube-player" class="w-full h-full"></div>
        </div>
        <!-- PeerJS Stream (カメラ中継) -->
        <video id="obs-stream-video" autoplay playsinline class="hidden w-full h-full object-contain absolute inset-0 z-20 bg-black"></video>
    </div>

    <!-- オーバーレイレイヤー (NowPlaying, テーマ等) -->
    <div id="overlay-layer" class="absolute top-0 left-0 w-full z-30 pointer-events-none flex flex-col">
        <!-- NowPlaying帯 -->
        <div class="w-full bg-gradient-to-b from-black/90 via-black/50 to-transparent pt-2.5 pb-5 px-4 flex items-center gap-3">
            <div id="obs-eq" class="equalizer scale-90 shrink-0 origin-left">
                <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
            </div>
            <div class="marquee-container h-6 flex-1">
                <div class="marquee-content font-bold text-white text-sm md:text-base leading-tight flex items-center gap-2 drop-shadow-lg">
                    <span id="obs-now-playing">クラウド同期中...</span>
                    <span id="obs-now-requester" class="text-indigo-300 font-normal"></span>
                </div>
            </div>
        </div>

        <!-- 配信主からのテーマ表示 -->
        <div id="obs-theme-container" class="bg-indigo-900/90 border-b border-indigo-500/50 text-indigo-100 text-[13px] md:text-sm py-1.5 px-4 text-center font-bold hidden shadow-md break-words"></div>
    </div>

    <script>
        let peer = null;
        let obsConn = null;
        let obsId = null;
        
        let viewerYTPlayer = null;
        let currentSong = null;
        let isWatchPartyEnabled = true;

        // UUID生成
        function generateId() { return Math.random().toString(36).substring(2, 9); }
        let obsUUID = localStorage.getItem('jukebox_obs_uuid');
        if (!obsUUID) {
            obsUUID = 'obs-' + generateId() + generateId();
            localStorage.setItem('jukebox_obs_uuid', obsUUID);
        }

        // URLパラメータ解析
        const urlParams = new URLSearchParams(window.location.search);
        let currentRoomId = null;
        let obsMode = 'overlay'; // 'cam' or 'overlay'

        window.onload = () => {
            if (urlParams.has('obs_cam')) {
                currentRoomId = urlParams.get('obs_cam');
                obsMode = 'cam';
            } else if (urlParams.has('obs')) {
                currentRoomId = urlParams.get('obs');
                obsMode = 'overlay';
            }

            initDOM();

            if (!currentRoomId) {
                showError("ルームIDが指定されていません。OBSプロパティのURLを確認してください。");
            } else {
                initOBS();
                
                // Firestore接続 (Cloud Sync)
                if (window.db) startCloudConnection();
                else window.addEventListener('firebase-auth-ready', startCloudConnection, { once: true });
            }
        };

        function showError(msg) {
            document.getElementById('error-overlay').classList.remove('hidden');
            document.getElementById('error-msg').innerHTML = msg;
        }

        function initDOM() {
            const body = document.getElementById('obs-body');
            const videoLayer = document.getElementById('video-layer');
            const ytWrapper = document.getElementById('youtube-player-wrapper');
            const overlayLayer = document.getElementById('overlay-layer');

            if (obsMode === 'cam') {
                body.classList.remove('mode-overlay');
                body.classList.add('mode-cam');
                videoLayer.classList.remove('hidden');
                // カメラモード時は上のテロップ帯を非表示にする
                if (overlayLayer) overlayLayer.classList.add('hidden');
            } else {
                // オーバーレイのみモードの場合は映像を出さない
                videoLayer.classList.add('hidden');
                // 音声のみを再生するためにYouTubeレイヤーを隠す
                ytWrapper.classList.add('youtube-hidden');
                // テロップ帯を表示
                if (overlayLayer) overlayLayer.classList.remove('hidden');
            }
        }

        // ================= Firestore Integration =================
        function startCloudConnection() {
            // Listen to Room State from Firestore
            window.onSnapshot(window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', currentRoomId), (docSnap) => {
                if (docSnap.exists()) {
                    handleRoomSync(docSnap.data());
                } else {
                    document.getElementById('obs-now-playing').textContent = "ホストが見つかりません";
                }
            }, (err) => console.error(err));

            loadYouTubeAPI();
        }

        function handleRoomSync(data) {
            const tDiv = document.getElementById('obs-theme-container');
            if(data.theme) { tDiv.innerHTML = `<i class="fa-solid fa-bullhorn"></i> ${data.theme}`; tDiv.classList.remove('hidden'); }
            else tDiv.classList.add('hidden');

            const playingEl = document.getElementById('obs-now-playing');
            const reqEl = document.getElementById('obs-now-requester');
            const eq = document.getElementById('obs-eq');

            if (data.currentSong) {
                playingEl.textContent = data.currentSong.title;
                const reqName = data.currentSong.isAnon ? '184(匿名)' : (data.currentSong.requesterReal || data.currentSong.requester || "");
                reqEl.innerHTML = reqName ? `- <i class="fa-solid fa-user"></i> ${reqName}` : "";
                
                if(data.status === 'playing') {
                    if (eq) eq.classList.add('active');
                } else {
                    if (eq) eq.classList.remove('active');
                }
                
                if (!currentSong || currentSong.videoId !== data.currentSong.videoId) {
                    currentSong = data.currentSong;
                    if (viewerYTPlayer && typeof viewerYTPlayer.loadVideoById === 'function') {
                        viewerYTPlayer.loadVideoById(currentSong.videoId);
                    }
                }

                if (viewerYTPlayer && typeof viewerYTPlayer.getPlayerState === 'function') {
                    const state = viewerYTPlayer.getPlayerState();
                    if (data.status === 'playing') {
                        const expectedTime = (Date.now() - currentSong.startedAt) / 1000;
                        if (state !== 1 && state !== 3) {
                            viewerYTPlayer.seekTo(expectedTime, true);
                            viewerYTPlayer.playVideo();
                            viewerYTPlayer.unMute(); 
                            viewerYTPlayer.setVolume(100);
                        } else {
                            const diff = expectedTime - viewerYTPlayer.getCurrentTime();
                            if (Math.abs(diff) > 2.0) viewerYTPlayer.seekTo(expectedTime, true);
                        }
                    } else if (data.status === 'paused') {
                        if (state === 1) {
                            viewerYTPlayer.pauseVideo();
                            viewerYTPlayer.seekTo(currentSong.pausePosition || 0, true);
                        }
                    }
                }
            } else {
                currentSong = null;
                playingEl.textContent = "BGM停止中";
                reqEl.textContent = "";
                if(eq) eq.classList.remove('active');
                if (viewerYTPlayer && typeof viewerYTPlayer.stopVideo === 'function') viewerYTPlayer.stopVideo();
            }

            // マーキーアニメーションのリセット
            document.querySelectorAll('.marquee-content').forEach(el => { 
                el.style.animation = 'none'; 
                el.offsetHeight; 
                el.style.animation = null; 
            });
        }

        function loadYouTubeAPI() {
            if (window.YT && window.YT.Player) {
                // Ready
            } else if (!document.getElementById('youtube-api-script')) {
                const tag = document.createElement('script');
                tag.id = 'youtube-api-script';
                tag.src = 'https://www.youtube.com/iframe_api';
                const firstScriptTag = document.getElementsByTagName('script')[0];
                firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
            }
        }
        
        window.onYouTubeIframeAPIReady = function() {
            if (!isWatchPartyEnabled) return;
            viewerYTPlayer = new YT.Player('obs-youtube-player', {
                height: '100%', width: '100%',
                playerVars: { autoplay: 1, controls: 0, rel: 0, disablekb: 1 },
                events: {
                    'onReady': (event) => {
                        // OBSブラウザは自動再生ポリシーをパスできるため音声をONにする
                        event.target.unMute(); 
                        event.target.setVolume(100);
                    }
                }
            });
        };

        // ================= PeerJS (カメラ中継用) =================
        function initOBS() {
            obsId = generateId();
            peer = new Peer(`obs-${obsId}`);

            peer.on('open', () => {
                obsConn = peer.connect(`jukebox-${currentRoomId}`);
                
                obsConn.on('open', () => {
                    sendProfileUpdate();
                });

                obsConn.on('data', (data) => {
                    if (data.type === 'ping') {
                        obsConn.send({ type: 'pong' });
                        return;
                    }
                    if (data.type === 'banned') {
                        showError("このルームへのアクセスが制限されています。");
                        if(peer) peer.destroy();
                        return;
                    }
                    
                    // パスワード認証 (Firestoreでデータは取れるが、カメラ受信のための手続きとして残す)
                    if (data.type === 'auth_required') {
                        const pwd = urlParams.get('pwd');
                        if (pwd) {
                            obsConn.send({ type: 'auth_request', password: pwd });
                        } else {
                            showError("このルームはホストがパスワードを設定しています。<br><br>OBSのブラウザソースのURL末尾に<br><span class='text-yellow-400 font-mono'>&pwd=設定したパスワード</span><br>を追加してください。");
                        }
                    } else if (data.type === 'auth_response') {
                        if (data.success) {
                            sendProfileUpdate();
                        } else {
                            showError("パスワードが間違っています。URLの &pwd=... の値を確認してください。");
                        }
                    }
                });
            });

            // カメラ中継の受信処理
            peer.on('call', (call) => {
                call.answer(); 
                call.on('stream', (stream) => {
                    if (obsMode === 'cam') {
                        const video = document.getElementById('obs-stream-video');
                        video.srcObject = stream;
                        video.classList.remove('hidden');

                        /* OBSで音声が出ない問題を回避するため AudioContext で強制ルーティング */
                        try {
                            if (!window.obsAudioCtx) {
                                window.obsAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                            }
                            if (window.obsAudioSource) window.obsAudioSource.disconnect();
                            
                            window.obsAudioSource = window.obsAudioCtx.createMediaStreamSource(stream);
                            window.obsAudioSource.connect(window.obsAudioCtx.destination);
                            
                            const resumeInterval = setInterval(() => {
                                if (window.obsAudioCtx.state === 'suspended') {
                                    window.obsAudioCtx.resume().catch(()=>{});
                                } else {
                                    clearInterval(resumeInterval);
                                }
                            }, 1000);
                        } catch(e) { console.error("WebAudio API Error", e); }

                        video.muted = false;
                        video.volume = 1.0;
                        video.play().catch(e => {
                            video.muted = true;
                            video.play().catch(er=>{});
                        });
                    }
                });
                call.on('close', () => { 
                    const video = document.getElementById('obs-stream-video');
                    if (video) {
                        video.srcObject = null;
                        video.classList.add('hidden');
                    }
                });
            });

            peer.on('error', (err) => {
                showError(`接続エラーが発生しました: ${err.type}`);
            });
        }

        function sendProfileUpdate() {
            if(!obsConn || !obsConn.open) return;
            obsConn.send({ 
                type: 'update_profile', 
                name: "OBS Overlay", 
                isRemote: false, 
                isObs: true, 
                uuid: obsUUID 
            });
        }
    </script>
</body>
</html>
